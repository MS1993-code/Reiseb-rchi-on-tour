function renderRouteDetail(dd, id){
  const routes = dd.routes;
  const idx = routes.findIndex(r=>r.id===id);
  const r = routes[idx], m = parseRouteMeta(r);
  const prev = routes[idx-1], next = routes[idx+1];
  const pills = [m.daysLabel && `${ICON.calendarDays} ${escapeHtml(m.daysLabel)}`, m.nights.length && `${ICON.locationDot} ${m.nights.length} Unterkünfte`, m.budget && `${ICON.wallet} ${escapeHtml(m.budget)}`].filter(Boolean);
  const days = (r.days||[]).map(d=>{
    const x = parseRouteDay(d);
    const maps = routeDayMapsUrl(dd, x.stops);
    return `<div class="rday">
      <div class="rday-dot">${escapeHtml(x.num.replace(/^Tag\s*/i,'') || '•')}</div>
      <div class="rday-card">
        <div class="rday-num">${escapeHtml(x.num)}</div>
        ${x.title ? `<div class="rday-title">${escapeHtml(x.title)}</div>` : ''}
        ${x.text ? `<div class="rday-text">${renderGuideCalloutText(x.text)}</div>` : ''}
        ${x.overnight && x.overnight!=='–' ? `<div class="rday-night">${ICON.suitcase} Übernachtung: <b>${escapeHtml(x.overnight)}</b></div>` : ''}
        ${x.stops.length ? `<div class="rday-stops">${x.stops.map(st=>`<span class="rday-stop">${escapeHtml(st)}</span>`).join('')}</div>` : ''}
        ${maps ? `<a class="btn rday-maps" href="${maps}" target="_blank" rel="noopener">${ICON.map} Tagesroute in Google Maps</a>` : ''}
      </div>
    </div>`;
  }).join('');
  return `
    <div class="gch-top">
      <button type="button" class="gch-back" data-action="close-route">‹ Alle Routen</button>
      <span class="gch-count">${idx+1} von ${routes.length}</span>
    </div>
    <div class="gch-title"><span class="gch-icon">${ICON.locationDot}</span><h2>${escapeHtml(m.name)}</h2></div>
    ${pills.length ? `<div class="rpills">${pills.map(x=>`<span class="rpill">${x}</span>`).join('')}</div>` : ''}
    ${m.intro ? `<div class="gch-lead"><div class="gch-lead-k">Die Idee</div>${renderGuideCalloutText(m.intro)}</div>` : ''}
    ${days ? `<div class="rtimeline">${days}</div>` : ''}
    <div class="gch-nav">
      ${prev ? `<button type="button" class="gch-nav-btn" data-action="open-route" data-id="${prev.id}"><small>Vorherige</small>‹ ${escapeHtml(parseRouteMeta(prev).name)}</button>` : '<span></span>'}
      ${next ? `<button type="button" class="gch-nav-btn gch-next" data-action="open-route" data-id="${next.id}"><small>Nächste</small>${escapeHtml(parseRouteMeta(next).name)} ›</button>` : `<button type="button" class="gch-nav-btn gch-next" data-action="close-route"><small>Fertig</small>Alle Routen ›</button>`}
    </div>
    <details class="gadmin"><summary>Route verwalten</summary>
      <button type="button" class="btn btn-danger" data-action="delete-route" data-id="${r.id}">${ICON.trash} Route löschen</button>
    </details>`;
}

let hikingMapInstances = {};
function haversineKmSimple(lat1,lng1,lat2,lng2){ return haversineKm(lat1,lng1,lat2,lng2); }
function parseGpxPoints(xmlText){
  const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
  let pts = [...doc.getElementsByTagName('trkpt')];
  if(!pts.length) pts = [...doc.getElementsByTagName('rtept')];
  return pts.map(pt=>{
    const lat = parseFloat(pt.getAttribute('lat'));
    const lng = parseFloat(pt.getAttribute('lon'));
    const eleEl = pt.getElementsByTagName('ele')[0];
    const ele = eleEl ? parseFloat(eleEl.textContent) : null;
    return {lat, lng, ele};
  }).filter(p=>!isNaN(p.lat) && !isNaN(p.lng));
}
function calcTrackDistanceKm(points){
  let total = 0;
  for(let i=1;i<points.length;i++){ total += haversineKmSimple(points[i-1].lat,points[i-1].lng,points[i].lat,points[i].lng); }
  return Math.round(total*10)/10;
}
function calcElevationGain(points){
  let gain = 0;
  for(let i=1;i<points.length;i++){
    if(points[i].ele!=null && points[i-1].ele!=null){
      const diff = points[i].ele - points[i-1].ele;
      if(diff>0) gain += diff;
    }
  }
  return Math.round(gain);
}

function chainWaySegments(members){
  const segments = (members||[]).filter(m=>m.geometry && m.geometry.length>1).map(m=>m.geometry.map(pt=>[pt.lat,pt.lon]));
  if(!segments.length) return [];
  const used = new Array(segments.length).fill(false);
  let chain = segments[0].slice();
  used[0] = true;
  let remaining = segments.length - 1;
  while(remaining>0){
    const chainEnd = chain[chain.length-1];
    let bestIdx = -1, bestDist = Infinity, bestReversed = false;
    for(let i=0;i<segments.length;i++){
      if(used[i]) continue;
      const seg = segments[i];
      const dStart = haversineKm(chainEnd[0],chainEnd[1], seg[0][0], seg[0][1]);
      const dEnd = haversineKm(chainEnd[0],chainEnd[1], seg[seg.length-1][0], seg[seg.length-1][1]);
      if(dStart<bestDist){ bestDist=dStart; bestIdx=i; bestReversed=false; }
      if(dEnd<bestDist){ bestDist=dEnd; bestIdx=i; bestReversed=true; }
    }
    if(bestIdx===-1) break;
    let seg = segments[bestIdx];
    if(bestReversed) seg = seg.slice().reverse();
    chain = chain.concat(seg);
    used[bestIdx] = true;
    remaining--;
  }
  return chain;
}
async function searchHikingTrails(){
  const dd = destDataCache[state.destId];
  const pois = dd.pois || [];
  const selectEl = document.getElementById('hiking-search-poi');
  const rawValue = selectEl ? selectEl.value : state.hikingSearchPoiIndex;
  const poiIndex = rawValue==='mylocation' ? 'mylocation' : parseInt(rawValue,10);
  state.hikingSearchPoiIndex = poiIndex;
  let lat, lng;
  if(poiIndex==='mylocation'){
    if(!navigator.geolocation){ showToast('Standortbestimmung wird von diesem Gerät/Browser nicht unterstützt.'); return; }
    state.hikingSearchLoading = true;
    render();
    try{
      const pos = await new Promise((resolve,reject)=>{
        navigator.geolocation.getCurrentPosition(resolve, reject, {enableHighAccuracy:true, timeout:10000});
      });
      lat = pos.coords.latitude; lng = pos.coords.longitude;
    }catch(e){
      showToast('Standort nicht verfügbar (Berechtigung verweigert?).');
      state.hikingSearchLoading = false;
      render();
      return;
    }
  } else if(pois.length && pois[poiIndex]){ lat = pois[poiIndex].lat; lng = pois[poiIndex].lng; }
  else if(pois.length){ lat = pois[0].lat; lng = pois[0].lng; }
  else { const dest = getCurrentDest(); lat = dest.lat; lng = dest.lng; }
  state.hikingSearchLoading = true;
  render();
  try{
    const radius = 50000;
    const query = `[out:json][timeout:25];relation["route"="hiking"](around:${radius},${lat},${lng});out geom;`;
    const url = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('failed');
    const data = await res.json();
    const relations = (data.elements||[]).filter(el=>el.type==='relation' && el.tags && el.tags.name);
    const results = relations.map(rel=>{
      const track = chainWaySegments(rel.members);
      if(track.length<2) return null;
      const distanceKm = calcTrackDistanceKm(track.map(p=>({lat:p[0],lng:p[1]})));
      if(distanceKm<1 || distanceKm>30) return null;
      return {id:String(rel.id), name:rel.tags.name, distanceKm, track, difficulty: rel.tags.sac_scale||'', network: rel.tags.network||''};
    }).filter(Boolean);
    results.sort((a,b)=>{
      const aLocal = (a.network==='lwn'||a.network==='rwn') ? 0 : 1;
      const bLocal = (b.network==='lwn'||b.network==='rwn') ? 0 : 1;
      if(aLocal!==bLocal) return aLocal-bLocal;
      return a.distanceKm - b.distanceKm;
    });
    const seen = new Set();
    state.hikingSearchResults = results.filter(r=>{
      if(seen.has(r.name)) return false;
      seen.add(r.name);
      return true;
    }).slice(0,25);
  }catch(e){
    state.hikingSearchResults = [];
  }
  state.hikingSearchLoading = false;
  render();
}

function updateLiveTrackingMarker(lat, lng){

function updateTrackingTimerDisplay(){
  if(!state.trackingStartTime) return;
  const elapsedSec = Math.floor((Date.now()-state.trackingStartTime)/1000);
  const h = Math.floor(elapsedSec/3600), m = Math.floor((elapsedSec%3600)/60), s = elapsedSec%60;
  const timeEl = document.getElementById('hike-tracking-timer');
  if(timeEl) timeEl.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  const distEl = document.getElementById('hike-tracking-distance');

async function startHikeTracking(destId, routeId){
  if(!navigator.geolocation){ showToast('Standortbestimmung wird von diesem Gerät/Browser nicht unterstützt.'); return; }
  if(state.trackingRouteId){ showToast('Es läuft bereits eine Wanderung – bitte erst beenden.'); return; }
  state.trackingDestId = destId;
  state.trackingRouteId = routeId;
  state.trackingStartTime = Date.now();
  state.trackingPoints = [];
  state.trackingDistanceKm = 0;
  showToast('Wanderung gestartet – Standort wird verfolgt.');
  state.trackingWatchId = navigator.geolocation.watchPosition(pos=>{
    const {latitude, longitude} = pos.coords;
    if(state.trackingPoints.length){
      const last = state.trackingPoints[state.trackingPoints.length-1];
      state.trackingDistanceKm += haversineKm(last[0], last[1], latitude, longitude);
    }
    state.trackingPoints.push([latitude, longitude]);
    updateLiveTrackingMarker(latitude, longitude);
  }, ()=>{ showToast('Standort konnte nicht ermittelt werden.'); }, {enableHighAccuracy:true, maximumAge:5000, timeout:15000});
  state.trackingTimerInterval = setInterval(updateTrackingTimerDisplay, 1000);
  render();
}
async function stopHikeTracking(){
  if(state.trackingWatchId!=null){ try{ navigator.geolocation.clearWatch(state.trackingWatchId); }catch(e){} }
  if(state.trackingTimerInterval){ clearInterval(state.trackingTimerInterval); state.trackingTimerInterval=null; }
  const durationMin = Math.max(1, Math.round((Date.now()-state.trackingStartTime)/60000));
  const distanceKm = Math.round(state.trackingDistanceKm*10)/10;
  const dd = destDataCache[state.trackingDestId];
  const route = dd && dd.hikingRoutes.find(r=>r.id===state.trackingRouteId);
  if(route){
    if(!route.hikeLogs) route.hikeLogs = [];
    route.hikeLogs.push({
      id: genId(),
      date: new Date(state.trackingStartTime).toISOString().slice(0,10),
      startTime: new Date(state.trackingStartTime).toTimeString().slice(0,5),
      stopTime: new Date().toTimeString().slice(0,5),
      durationMin, distanceKm
    });
    await saveDestData(state.trackingDestId);
  }
  showToast(`Wanderung beendet: ${durationMin} Min., ${distanceKm} km.`);
  state.trackingRouteId = null; state.trackingDestId = null; state.trackingStartTime = null;
  state.trackingPoints = []; state.trackingDistanceKm = 0; state.trackingWatchId = null;
  render();
}

}

function phraseKey(local){
  return (local||'').replace(/\([^)]*\)/g,' ').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim();
}
/* Doppelte Vokabeln entfernen: gleiche Fremdsprache (ohne Aussprache, Akzente, Groß/Klein) = doppelt.
   Behalten wird der ausführlichere Eintrag (mit Aussprache/Kategorie), an der Position des ersten. */
function dedupePhrases(dd){
  const list = dd.phrases || [];
  const keep = [], idx = {};
  let removed = 0;
  const score = (p)=> (/\(/.test(p.local)?2:0) + (p.category?1:0) + (p.src==='guide'?1:0) + (p.local||'').length/1000;
  list.forEach(p=>{
    const k = phraseKey(p.local) + '|' ;
    const key = phraseKey(p.local);
    if(!key){ keep.push(p); return; }
    if(key in idx){
      removed++;
      const j = idx[key];
      if(score(p) > score(keep[j])) keep[j] = Object.assign({}, p, {id:keep[j].id});
    } else { idx[key] = keep.length; keep.push(p); }
  });
  dd.phrases = keep;
  return removed;
}
function phraseParts(local){
  const m = (local||'').match(/^(.*?)\s*\(([^)]+)\)\s*$/);
  return m ? {word:m[1], say:m[2]} : {word:local, say:''};
}
function renderPhrasesTab(dd){
  const dest = getCurrentDest();
  const langInfo = DEST_LANG[dest.id] || {code:'en', speech:'en-US', name:'die Landessprache'};

             : `<button type="button" class="poi2-icon" data-action="speak-phrase" data-text="${escapeHtml(x.word)}" aria-label="Anhören">${ICON.volumeHigh}</button>`}
    </div>`;
  }).join('');
  const addForm = state.addingPhrase ? `
    <div class="inline-form">
      <label class="field-label">Deutsch</label>
      <input class="input" id="new-phrase-german" placeholder="z.B. Guten Morgen" style="margin-bottom:8px;">
      <label class="field-label">${escapeHtml(langInfo.name)}</label>
      <input class="input" id="new-phrase-local" placeholder="z.B. Kalimera" style="margin-bottom:8px;">
      <div class="form-actions">
        <button type="button" class="btn btn-add" data-action="confirm-add-phrase">Speichern</button>
        <button type="button" class="btn" data-action="cancel-add-phrase">Abbrechen</button>
      </div>
    </div>` : `<button type="button" class="btn pg-add-btn" data-action="show-add-phrase">+ Vokabel hinzufügen</button>`;
  return `
    <div class="pg-card pg-pad">
      <div class="bk-kicker">Übersetzer · Deutsch → ${escapeHtml(langInfo.name)}</div>
      <textarea class="textarea" id="translate-input" placeholder="Text auf Deutsch eingeben…" style="min-height:56px;margin-top:8px;"></textarea>
      <button type="button" class="btn btn-add" data-action="do-translate" style="margin-top:8px;width:100%;">Übersetzen</button>
      <div id="translate-result" style="margin-top:10px;"></div>
    </div>
    <div class="pg-sec-head"><h3 class="section-title">Vokabeln <span class="seg-n" style="display:inline-block;">${phrases.length}</span></h3>
      ${phrases.length ? `<button type="button" class="gch-link" data-action="toggle-phrase-edit">${edit ? 'Fertig' : 'Bearbeiten'}</button>` : ''}</div>
    ${cats.length > 1 ? `<div class="pg-chips">${['alle',...cats].map(c=>`<button type="button" class="gch-chip ${cat===c?'active':''}" data-action="phrase-cat" data-cat="${escapeHtml(c)}">${c==='alle'?'Alle':escapeHtml(c)}</button>`).join('')}</div>` : ''}
    ${phrases.length > 10 ? `<input class="input pg-search" id="phrase-search" type="search" placeholder="Vokabeln durchsuchen …" autocomplete="off">` : ''}
    ${phrases.length ? `<div class="pg-card">${rows}</div><p class="empty-state" id="phrase-nohit" style="display:none;">Keine passende Vokabel.</p>` : '<p class="empty-state">Noch keine Vokabeln eingetragen.</p>'}

/* ---------- Guide-Datei-Import (.docx) ---------- */
const CHAPTER_FIELD_MAP = [
  {pattern:/willkommen.*wie sie diesen guide nutzen/i, field:null},
  {pattern:/verstehen/i, field:'understanding'},
  {pattern:/beste reisezeit/i, field:'bestTime'},
  {pattern:/einreise.*formalit.*gesundheit/i, field:'entryHealth'},
  {pattern:/anreise\b/i, field:'arrival'},
  {pattern:/fortbewegung vor ort/i, field:'gettingAround'},
  {pattern:/unterkunft\b/i, field:'accommodation'},
  {pattern:/regionen im überblick/i, field:'regions'},
  {pattern:/fertige routen/i, field:'ROUTES'},
  {pattern:/top-erlebnisse/i, field:'highlights'},
  {pattern:/essen.*trinken/i, field:'RECIPES'},
  {pattern:/budget.*kosten/i, field:'budgetInfo'},
  {pattern:/packliste/i, field:'PACKING'},
  {pattern:/praktisches a.z/i, field:'tips'},
  {pattern:/natur.*sicherheit.*wanderregeln/i, field:'natureSafety'},
  {pattern:/checklisten/i, field:'CHECKLIST_CH16'},
  {pattern:/häufig gestellte fragen/i, field:'FAQ'},
  {pattern:/zum schluss/i, field:null},
  {pattern:/mein reisetagebuch/i, field:null}
];
function findChapterField(headingText){
  for(const rule of CHAPTER_FIELD_MAP){
    if(rule.pattern.test(headingText)) return rule.field;
  }
  return 'overview';
}
function getSubHeadingText(node){
  if(node.tagName==='H1' || node.tagName==='H2' || node.tagName==='H3' || node.tagName==='H4' || node.tagName==='H5' || node.tagName==='H6') return node.textContent.trim();
  if(node.tagName==='P'){
    const strong = node.querySelector('strong, b');
    if(strong){
      const fullText = node.textContent.trim();
      const strongText = strong.textContent.trim();
      const leftover = fullText.replace(strongText,'').trim();
      if(strongText.length>0 && leftover.length<=2 && strongText.length<150) return strongText;
    }
  }
  return null;
}
function extractFormattedText(node){
  let out = '';
  node.childNodes.forEach(child=>{
    if(child.nodeType===3){ out += child.textContent; }
    else if(child.tagName==='STRONG' || child.tagName==='B'){ out += '**'+child.textContent+'**'; }
    else if(child.tagName==='EM' || child.tagName==='I'){ out += child.textContent; }
    else if(child.tagName==='BR'){ out += '\n'; }
    else { out += child.textContent||''; }
  });
  return out.trim();
}
async function onGuideFileSelected(file){
  if(!(await ensureLib('mammoth'))){
    showToast('Der Datei-Import-Dienst konnte nicht geladen werden (keine Internetverbindung).');
    return;
  }
  try{
    const arrayBuffer = await file.arrayBuffer();
    const result = await mammoth.convertToHtml({arrayBuffer});
    const html = result.value;
    if(!html.trim()){ showToast('Aus dieser Datei konnte kein Text extrahiert werden.'); return; }

    const doc = new DOMParser().parseFromString(html, 'text/html');
    const nodes = [...doc.body.children];
    const dd = destDataCache[state.destId];
    const fieldBuckets = {understanding:[], overview:[], bestTime:[], entryHealth:[], arrival:[], gettingAround:[], accommodation:[], regions:[], highlights:[], foodDrink:[], budgetInfo:[], natureSafety:[], tips:[]};
    const packingItemsBuf = [], checklistItemsBuf = [], bucketlistItemsBuf = [];
    let packingIntroBuf = '', checklistIntroBuf = '', bucketlistIntroBuf = '';
    let packingNotesBuf = '', checklistNotesBuf = '', bucketlistNotesBuf = '';
    let currentGroup = null, inBucketPart = false;
    function extractCalloutFromNode(node){
      const txt = node.textContent.trim();
      let m = txt.match(/^(Tipp|Geheimtipp|Achtung)\s*:?\s*(.+)$/i);
      if(m) return m[1]+': '+m[2].trim();
      if(node.tagName==='TABLE'){
        m = txt.match(/^[^\wÄÖÜäöü]{0,3}(Tipp|Geheimtipp|Achtung)\s*:?\s*(.+)$/i);
        if(m) return m[1]+': '+m[2].trim();
      }
      return null;
    }
    let currentMode = null; // 'field' | 'ROUTES' | 'FAQ' | 'BUCKETLIST' | 'PACKING' | 'CHECKLIST_CH16' | 'RECIPES' | null
    let currentField = null;
    let inChapter2 = false;
    let inRecipeSection = false;
    let inSpracheSubsection = false;
    let subBuffer = null;
    let recipeBuffer = null;
    let anyImported = false;
    const dest = getCurrentDest();

    function flushSub(){
      if(subBuffer){
        if(currentMode==='ROUTES'){
          const descText = (subBuffer.descLines||[]).join('\n').trim();
          const days = (subBuffer.days||[]).map(d=>({label:d.label, place:d.place||'', text:d.lines.join('\n').trim()})).filter(d=>d.text);
          if(/^route\s*\d+/i.test(subBuffer.title)){
            if(descText || days.length){
              if(pushIfNew(dd.routes, {id:genId(), title:subBuffer.title, text:descText, days}, r=>r.title.trim().toLowerCase())) anyImported = true;
            }
          } else {
            const combined = [descText, ...days.map(d=>d.label+'\n'+d.text)].filter(Boolean).join('\n\n');
            if(combined){
              fieldBuckets.overview.push(subBuffer.title ? subBuffer.title+'\n'+combined : combined);
              anyImported = true;
            }
          }
        } else if(currentMode==='FAQ'){
          const text = subBuffer.lines.join('\n').trim();
          if(text){
            const question = subBuffer.title||'Frage';
            const dup = dd.faq.some(f=>f.question.trim().toLowerCase()===question.trim().toLowerCase());
            if(!dup){ dd.faq.push({id:genId(), question, answer:text}); anyImported = true; }
          }
        }
      }
      subBuffer = null;
    }
    function extractCellRecipeSection(cell){
      const paras = [...cell.querySelectorAll('p, li')];
      if(!paras.length) return {heading:'', items:[]};
      const first = paras[0];
      const strong = first.querySelector('strong, b');
      const heading = strong ? strong.textContent.trim() : first.textContent.trim();
      const items = paras.slice(1).map(p=>p.textContent.trim()).filter(Boolean);
      return {heading, items};
    }
    function parseRecipeTableFull(table){
      const rows = [...table.querySelectorAll('tr')];
      if(rows.length < 3) return null;
      const rowHasBoldMatching = (row, re) => [...row.querySelectorAll('td, th')].some(c=>{
        const p = c.querySelector('p');
        const s = p && p.querySelector('strong, b');
        return s && re.test(s.textContent);
      });
      const titleRowIdx = rows.findIndex(r=>r.textContent.trim().length>0);
      if(titleRowIdx===-1) return null;
      const ingredientsRowIdx = rows.findIndex(r=>rowHasBoldMatching(r, /zutaten/i));
      const stepsRowIdx = rows.findIndex(r=>rowHasBoldMatching(r, /zubereitung/i));
      const metaRowIdx = rows.findIndex((r,i)=> i>titleRowIdx && (ingredientsRowIdx===-1||i<ingredientsRowIdx) && /für\s*\d+/i.test(r.textContent));

      const titleCell = rows[titleRowIdx].querySelector('td, th');
      const titleParas = titleCell ? [...titleCell.querySelectorAll('p')] : [];
      let name = '', subtitle = '';
      if(titleParas[0]){
        const s = titleParas[0].querySelector('strong, b');
        name = s ? s.textContent.trim() : titleParas[0].textContent.trim();
      }
      for(let i=1;i<titleParas.length;i++){
        const txt = titleParas[i].textContent.trim();
        if(!txt || /^[✦\s]+$/.test(txt)) continue;
        const s = titleParas[i].querySelector('strong, b');
        subtitle = s ? s.textContent.trim() : txt;
      }

      let servings = '', time = '';
      if(metaRowIdx!==-1){
        const metaCell = rows[metaRowIdx].querySelector('td, th');
        const p = metaCell ? metaCell.querySelector('p') : null;
        if(p){
          const s = p.querySelector('strong, b');
          const boldText = s ? s.textContent.trim() : '';
          const fullText = p.textContent.trim();
          servings = boldText.replace(/[·\s]+$/,'').trim();
          time = fullText.slice(boldText.length).replace(/^[·\s]+/,'').trim();
        }
      }

      let ingredients = '';
      if(ingredientsRowIdx!==-1){
        const ingredientCells = [...rows[ingredientsRowIdx].querySelectorAll('td, th')];
        const ingredientGroups = ingredientCells.map(c=>extractCellRecipeSection(c));
        if(ingredientGroups.length===1){
          ingredients = ingredientGroups[0].items.join('\n');
        } else if(ingredientGroups.length>1){
          ingredients = ingredientGroups.map(g=> (g.heading?g.heading+':\n':'') + g.items.join('\n')).join('\n\n');
        }
      }

      let steps = '';
      if(stepsRowIdx!==-1){
        const stepsCell = rows[stepsRowIdx].querySelector('td, th');
        const stepsSection = stepsCell ? extractCellRecipeSection(stepsCell) : {items:[]};
        steps = stepsSection.items.map(s=>s.replace(/^\d+\.\s*/,'')).join('\n');
      }
      return {name, subtitle, servings, time, ingredients, steps};
    }
    function flushRecipeBuffer(){
      if(recipeBuffer){
        const blockText = recipeBuffer.title + '\n' + recipeBuffer.lines.join('\n');
        const parsed = parseRecipeText(blockText);
        if(parsed.ingredients || parsed.steps){
          const newRecipe = {
            id:genId(), destId: dest.id, category:'Sonstiges',
            nameNative: parsed.nameNative || recipeBuffer.title, nameGerman: parsed.nameGerman||'',
            servings: parsed.servings||'', time: parsed.time||'',
            ingredients: parsed.ingredients||'', steps: parsed.steps||''
          };
          if(pushIfNew(recipes, newRecipe, r=>r.destId+'|'+r.nameNative.trim().toLowerCase())) anyImported = true;
        }
      }
      recipeBuffer = null;
    }

    for(const node of nodes){
      if(node.tagName==='H1'){
        if(currentMode==='ROUTES' || currentMode==='FAQ') flushSub();
        if(currentMode==='RECIPES') flushRecipeBuffer();
        const headingText = node.textContent.trim();
        inChapter2 = /verstehen/i.test(headingText);
        inRecipeSection = false;
        inSpracheSubsection = false;
        currentGroup = null; inBucketPart = false;
        const field = findChapterField(headingText);
        currentMode = null; currentField = null;
        if(field==='ROUTES' || field==='FAQ' || field==='BUCKETLIST' || field==='CHECKLIST_CH16' || field==='PACKING' || field==='RECIPES'){ currentMode = field; }
        else if(field!==null){ currentMode = 'field'; currentField = field; }
        continue;
      }
      if(currentMode==='RECIPES'){
        const subHeading = getSubHeadingText(node);
        if(subHeading && /^zum nachkochen/i.test(subHeading)){
          inRecipeSection = true;
        } else if(node.tagName==='TABLE' && inRecipeSection){
          const parsed = parseRecipeTableFull(node);
          if(parsed && (parsed.ingredients || parsed.steps)){
            const newRecipe = {
              id:genId(), destId: dest.id, category:'Sonstiges',
              nameNative: parsed.name || 'Rezept', nameGerman: parsed.subtitle || '',
              servings: parsed.servings, time: parsed.time,
              ingredients: parsed.ingredients, steps: parsed.steps
            };
            if(pushIfNew(recipes, newRecipe, r=>r.destId+'|'+r.nameNative.trim().toLowerCase())) anyImported = true;
          }
        } else if(!inRecipeSection){
          const t = node.tagName==='P' ? extractFormattedText(node) : node.textContent.trim();
          if(t) fieldBuckets.foodDrink.push(t);
        }
      } else if(currentMode==='ROUTES'){
        const subHeading = getSubHeadingText(node);
        if(subHeading && /^route\s*\d+/i.test(subHeading)){
          flushSub();
          subBuffer = {title:subHeading, descLines:[], days:[], currentDay:null};
        } else if(subHeading && /^tag\s*\d+/i.test(subHeading)){
          if(!subBuffer) subBuffer = {title:'', descLines:[], days:[], currentDay:null};
          const m = subHeading.match(/^(tag\s*\d+)\s*:?\s*(.*)/i);
          const dayObj = {label: m ? m[1].trim() : subHeading, place: m && m[2] ? m[2].trim() : '', lines:[]};
          subBuffer.days.push(dayObj);
          subBuffer.currentDay = dayObj;
        } else if(subHeading){
          flushSub();
          subBuffer = {title:subHeading, descLines:[], days:[], currentDay:null};
        } else {
          const t = node.textContent.trim();
          if(t){
            if(!subBuffer) subBuffer = {title:'', descLines:[], days:[], currentDay:null};
            if(subBuffer.currentDay){ subBuffer.currentDay.lines.push(t); }
            else { subBuffer.descLines.push(t); }
          }
        }
      } else if(currentMode==='FAQ'){
        const t = node.textContent.trim();
        if(t){
          const fMatch = t.match(/^F\s*:\s*(.+)/i) || t.match(/^Frage\s*:\s*(.+)/i);
          if(fMatch){
            flushSub();
            subBuffer = {title:fMatch[1].trim(), lines:[]};
          } else if(subBuffer){
            subBuffer.lines.push(t.replace(/^A\s*:\s*/i,'').replace(/^Antwort\s*:\s*/i,''));
          } else {
            fieldBuckets.overview.push(t);
            anyImported = true;
          }
        }
      } else if(currentMode==='BUCKETLIST' || currentMode==='PACKING' || currentMode==='CHECKLIST_CH16'){
        const isChecklist16 = currentMode==='CHECKLIST_CH16';
        const bucketKey = currentMode==='BUCKETLIST' ? 'BUCKETLIST' : (isChecklist16 ? 'CHECKLIST' : 'PACKING');
        const targetItems = bucketKey==='BUCKETLIST' ? bucketlistItemsBuf : (bucketKey==='CHECKLIST' ? checklistItemsBuf : packingItemsBuf);
        const subHeading = getSubHeadingText(node);
        if(subHeading){
          if(isChecklist16 && /bucket/i.test(subHeading)){ inBucketPart = true; currentGroup = null; }
          else { currentGroup = subHeading.replace(/^checkliste:\s*/i,''); inBucketPart = false; }
          continue;
        }
        const callout = extractCalloutFromNode(node);
        if(callout){
          if(bucketKey==='BUCKETLIST' || (isChecklist16 && inBucketPart)) bucketlistNotesBuf += (bucketlistNotesBuf?'\n\n':'')+callout;
          else if(bucketKey==='CHECKLIST') checklistNotesBuf += (checklistNotesBuf?'\n\n':'')+callout;
          else packingNotesBuf += (packingNotesBuf?'\n\n':'')+callout;
          continue;
        }
        if(node.tagName==='UL' || node.tagName==='OL'){
          [...node.querySelectorAll('li')].forEach(li=>{
            const t = li.textContent.trim();
            if(!t) return;
            if(isChecklist16 && inBucketPart){ bucketlistItemsBuf.push({text:t}); }
            else if(bucketKey==='BUCKETLIST'){ bucketlistItemsBuf.push({text:t}); }
            else { targetItems.push({text:t, group:currentGroup}); }
          });
        } else {
          let t = node.textContent.trim();
          t = t.replace(/^[•\-\*▪]\s*/, '').replace(/^\d+[\.\)]\s*/, '');
          if(!t) { /* nothing */ }
          else if(isChecklist16 && inBucketPart){ bucketlistItemsBuf.push({text:t}); }
          else if(bucketKey==='BUCKETLIST'){ bucketlistItemsBuf.push({text:t}); }
          else if(!currentGroup){
            if(bucketKey==='CHECKLIST') checklistIntroBuf += (checklistIntroBuf?'\n\n':'')+t;
            else packingIntroBuf += (packingIntroBuf?'\n\n':'')+t;
          }
          else { targetItems.push({text:t, group:currentGroup}); }
        }
      } else if(currentMode==='field' && currentField){
        if(inChapter2){
          const subHeading = getSubHeadingText(node);
          if(subHeading){
            inSpracheSubsection = /^sprache\b/i.test(subHeading);
            if(inSpracheSubsection) continue;
          }
          if(inSpracheSubsection && node.tagName==='TABLE'){
            [...node.querySelectorAll('tr')].forEach(tr=>{
              const cells = [...tr.querySelectorAll('td,th')];
              let local = '', german = '';
              if(cells.length>=3){ local = cells[0].textContent.trim(); german = cells[2].textContent.trim(); }
              else if(cells.length===2){ local = cells[0].textContent.trim(); german = cells[1].textContent.trim(); }
              if(german && local && !/^deutsch$/i.test(german) && !/^fremdsprache$/i.test(local)){
                const dup = dd.phrases.some(p=>p.local.toLowerCase()===local.toLowerCase() && p.german.toLowerCase()===german.toLowerCase());
                if(!dup){ dd.phrases.push({id:genId(), german, local}); anyImported = true; }
              }
            });
            continue;
          }
        }
        if(node.tagName==='TABLE'){
          const rows = [...node.querySelectorAll('tr')].map(tr=>
            [...tr.querySelectorAll('td,th')].map(c=>c.textContent.trim())
          ).filter(r=>r.some(c=>c));
          if(rows.length){
            fieldBuckets[currentField].push('###TABLE###'+JSON.stringify(rows));
            anyImported = true;
          }
          continue;
        }
        if(node.tagName==='UL' || node.tagName==='OL'){
          const items = [...node.querySelectorAll('li')];
          if(items.length){
            const lines = items.map((li,i)=> (node.tagName==='OL' ? (i+1)+'. ' : '• ') + li.textContent.trim());
            fieldBuckets[currentField].push(lines.join('\n'));
            anyImported = true;
          }
          continue;
        }
        const subHeading = getSubHeadingText(node);
        if(subHeading){
          fieldBuckets[currentField].push('###SUBHEAD###'+subHeading);
          anyImported = true;
          continue;
        }
        const t = node.tagName==='P' ? extractFormattedText(node) : node.textContent.trim();
        if(t){ fieldBuckets[currentField].push(t); anyImported = true; }
      }
    }
    if(currentMode==='ROUTES' || currentMode==='FAQ') flushSub();
    if(currentMode==='RECIPES') flushRecipeBuffer();

    Object.keys(fieldBuckets).forEach(field=>{
      if(fieldBuckets[field].length){
        const newText = fieldBuckets[field].join('\n\n');
        dd.guide[field] = dd.guide[field] ? dd.guide[field]+'\n\n'+newText : newText;
      }
    });
    bucketlistItemsBuf.forEach(it=>{ if(pushIfNew(dd.bucketlist, {id:genId(), text:it.text, checked:false}, x=>x.text.trim().toLowerCase())) anyImported = true; });
    packingItemsBuf.forEach(it=>{ if(pushIfNew(dd.packing, {id:genId(), text:it.text, checked:false, group:it.group}, x=>x.text.trim().toLowerCase())) anyImported = true; });
    checklistItemsBuf.forEach(it=>{ if(pushIfNew(dd.checklist, {id:genId(), text:it.text, checked:false, group:it.group}, x=>x.text.trim().toLowerCase())) anyImported = true; });
    if(packingIntroBuf && !dd.packingIntro.includes(packingIntroBuf)){ dd.packingIntro = dd.packingIntro ? dd.packingIntro+'\n\n'+packingIntroBuf : packingIntroBuf; anyImported = true; }
    if(checklistIntroBuf && !dd.checklistIntro.includes(checklistIntroBuf)){ dd.checklistIntro = dd.checklistIntro ? dd.checklistIntro+'\n\n'+checklistIntroBuf : checklistIntroBuf; anyImported = true; }
    if(bucketlistIntroBuf && !dd.bucketlistIntro.includes(bucketlistIntroBuf)){ dd.bucketlistIntro = dd.bucketlistIntro ? dd.bucketlistIntro+'\n\n'+bucketlistIntroBuf : bucketlistIntroBuf; anyImported = true; }
    if(packingNotesBuf && !dd.packingNotes.includes(packingNotesBuf)){ dd.packingNotes = dd.packingNotes ? dd.packingNotes+'\n\n'+packingNotesBuf : packingNotesBuf; anyImported = true; }
    if(checklistNotesBuf && !dd.checklistNotes.includes(checklistNotesBuf)){ dd.checklistNotes = dd.checklistNotes ? dd.checklistNotes+'\n\n'+checklistNotesBuf : checklistNotesBuf; anyImported = true; }
    if(bucketlistNotesBuf && !dd.bucketlistNotes.includes(bucketlistNotesBuf)){ dd.bucketlistNotes = dd.bucketlistNotes ? dd.bucketlistNotes+'\n\n'+bucketlistNotesBuf : bucketlistNotesBuf; anyImported = true; }

    dd.guide.imported = false;
    dd.guide.importedFileName = file.name;
    await saveDestData(state.destId);
    await sSet('recipes', recipes);
    render();
    showToast(anyImported ? 'Reiseführer eingelesen und auf die Reiter verteilt – bitte prüfen.' : 'Es konnte nichts eindeutig zugeordnet werden – bitte manuell prüfen.');
  }catch(e){
    showToast('Datei konnte nicht gelesen werden. Bitte eine .docx-Datei verwenden.');
  }
}
function parseMarkdownTable(block){
  const lines = block.split('\n').map(l=>l.trim()).filter(Boolean);
  if(lines.length < 2 || !lines[0].startsWith('|') || !/^\|[\s:|-]+\|$/.test(lines[1])) return null;
  return lines.filter((l,idx)=>idx!==1).map(line=>line.replace(/^\||\|$/g,'').split('|').map(c=>c.trim()));
}
function convertMarkdownListLines(block){
  return block.split('\n').map(line=>{
    let m = line.match(/^\s*[-*]\s+(.*)$/);
    if(m) return '• ' + m[1];
    m = line.match(/^\s*(\d+)\.\s+(.*)$/);
    if(m) return m[1] + '. ' + m[2];
    return line;
  }).join('\n');
}
function parseMarkdownRecipe(name, destId, blocks){
  let subtitle = '', servingsTime = '';
  const ingredientGroups = [];
  let steps = [];
  const headerLines = blocks.length ? blocks[0].split('\n').map(l=>l.trim()).filter(Boolean) : [];
  const remainingBlocks = blocks.slice(1);
  let li = 0;
  if(headerLines[li] && /^\*[^*]+\*$/.test(headerLines[li])){ subtitle = headerLines[li].replace(/^\*|\*$/g,''); li++; }
  if(headerLines[li] && !/^\*\*/.test(headerLines[li]) && !/^[-*]\s/.test(headerLines[li])){ servingsTime = headerLines[li]; li++; }
  const leftover = headerLines.slice(li).join('\n');
  const scanBlocks = leftover ? [leftover, ...remainingBlocks] : remainingBlocks;
  for(const rawB of scanBlocks){
    const b = rawB.trim();
    const headM = b.match(/^\*\*(.+?)\*\*\s*\n?([\s\S]*)$/);
    if(headM){
      const heading = headM[1].trim();
      const items = headM[2].trim().split('\n').map(l=>l.replace(/^[-*]\s+/,'').trim()).filter(Boolean);
      if(/zutaten/i.test(heading)) ingredientGroups.push({heading, items});
      else if(/zubereitung/i.test(heading)) steps = items.map(l=>l.replace(/^\d+\.\s*/,''));
    }
  }
  if(!ingredientGroups.length && !steps.length) return null;
  const ingredients = ingredientGroups.length===1 ? ingredientGroups[0].items.join('\n')
    : ingredientGroups.map(g=>g.heading+':\n'+g.items.join('\n')).join('\n\n');
  return {
    id: genId(), destId, category:'Sonstiges', nameNative: name, nameGerman: subtitle,
    servings: (servingsTime.split('·')[0]||'').trim(), time: servingsTime.split('·').slice(1).join('·').trim(),
    ingredients, steps: steps.join('\n')
  };
}
function parseMarkdownGuide(text, destId){
  const fieldBuckets = {understanding:[], overview:[], bestTime:[], entryHealth:[], arrival:[], gettingAround:[], accommodation:[], regions:[], highlights:[], foodDrink:[], budgetInfo:[], natureSafety:[], tips:[]};
  const packingItems = [], checklistItems = [], bucketlistItems = [], faqItems = [], newRecipes = [], newRoutes = [];
  let packingIntro = '', checklistIntro = '', bucketlistIntro = '';
  let packingNotes = '', checklistNotes = '', bucketlistNotes = '';
  let currentMode = null, currentField = null;
  let inRecipeSection = false, currentGroup = null, inBucketPart = false;
  let subBuffer = null;
  let anyImported = false;

  function flushRouteSub(){
    if(subBuffer){
      if(subBuffer.currentDay) subBuffer.days.push(subBuffer.currentDay);
      newRoutes.push({id:genId(), title:subBuffer.title, text:subBuffer.descLines.join('\n\n'),
        days: subBuffer.days.map(d=>({label:d.title, place:'', text:d.lines.join('\n\n')}))});
      subBuffer = null;
    }
  }

  const blocks = text.split(/\n{2,}/);
  let i = 0;
  while(i < blocks.length){
    const block = blocks[i].trim();
    if(!block){ i++; continue; }

    let m = block.match(/^##\s+(.+)$/);
    if(m && !/^##\s+#/.test(block)){
      if(currentMode==='ROUTES') flushRouteSub();
      const title = m[1].trim();
      const field = findChapterField(title);
      currentMode = null; currentField = null;
      inRecipeSection = false; currentGroup = null; inBucketPart = false;
      if(field==='ROUTES'||field==='FAQ'||field==='PACKING'||field==='RECIPES'||field==='CHECKLIST_CH16'){ currentMode = field; }
      else if(field!==null){ currentMode = 'field'; currentField = field; }
      i++; continue;
    }

    let subM = block.match(/^(#{3,4})\s+([^\n]+)\n?([\s\S]*)$/);
    if(subM){
      const level = subM[1].length;
      const subTitle = subM[2].trim();
      const restOfBlock = subM[3].trim();

      if(currentMode==='RECIPES'){
        if(/^zum nachkochen/i.test(subTitle)){ inRecipeSection = true; i++; continue; }
        if(inRecipeSection && level===4){
          let j = i+1;
          const recipeBlocks = restOfBlock ? [restOfBlock] : [];
          while(j<blocks.length && !/^#{2,4}\s/.test(blocks[j].trim())){ recipeBlocks.push(blocks[j]); j++; }
          const recipe = parseMarkdownRecipe(subTitle, destId, recipeBlocks);
          if(recipe){ newRecipes.push(recipe); anyImported = true; }
          i = j; continue;
        }
        i++; continue;
      }

      if(currentMode==='ROUTES'){
        if(level===3 && /^Route\s*\d+/i.test(subTitle)){
          flushRouteSub();
          subBuffer = {title:subTitle, descLines: restOfBlock?[restOfBlock]:[], days:[], currentDay:null};
        } else if(level===4 && subBuffer){
          if(subBuffer.currentDay) subBuffer.days.push(subBuffer.currentDay);
          subBuffer.currentDay = {title:subTitle, lines: restOfBlock?[restOfBlock]:[]};
        } else if(level===3 && subBuffer){
          if(subBuffer.currentDay) subBuffer.days.push(subBuffer.currentDay);
          subBuffer.currentDay = null;
          subBuffer.descLines.push('**'+subTitle+'**');
          if(restOfBlock) subBuffer.descLines.push(restOfBlock);
        }
        i++; continue;
      }

      if(currentMode==='PACKING' || currentMode==='CHECKLIST_CH16'){
        if(currentMode==='CHECKLIST_CH16' && /bucket/i.test(subTitle)){ inBucketPart = true; currentGroup = null; }
        else { currentGroup = subTitle.replace(/^checkliste:\s*/i,''); inBucketPart = false; }
        if(restOfBlock){
          const bulletLines = restOfBlock.split('\n').map(l=>l.replace(/^[-*]\s+/,'').replace(/\*\*/g,'').trim()).filter(Boolean);
          bulletLines.forEach(lineText=>{
            const item = {id:genId(), text:lineText, checked:false};
            if(inBucketPart){ bucketlistItems.push(item); }
            else { item.group = currentGroup; (currentMode==='PACKING'?packingItems:checklistItems).push(item); }
          });
          anyImported = true;
        }
        i++; continue;
      }

      if(currentMode==='field'){
        fieldBuckets[currentField].push('###SUBHEAD###'+subTitle);
        if(restOfBlock) fieldBuckets[currentField].push(convertMarkdownListLines(restOfBlock));
        anyImported = true;
      }
      i++; continue;
    }

    if(currentMode==='ROUTES' && subBuffer){
      if(subBuffer.currentDay) subBuffer.currentDay.lines.push(block);
      else subBuffer.descLines.push(block);
      i++; continue;
    }

    if(currentMode==='FAQ'){
      const qaMatch = block.match(/^\*\*F:?\s*(.+?)\*\*\s*\n\*\*A:?\*\*\s*([\s\S]*)$/i);
      if(qaMatch){ faqItems.push({id:genId(), question:qaMatch[1].trim(), answer:qaMatch[2].trim()}); anyImported = true; }
      i++; continue;
    }

    if(currentMode==='RECIPES' && !inRecipeSection){
      const text = convertMarkdownListLines(block);
      if(text){ fieldBuckets.foodDrink.push(text); anyImported = true; }
      i++; continue;
    }

    if(currentMode==='field'){
      const tableRows = parseMarkdownTable(block);
      if(tableRows){ fieldBuckets[currentField].push('###TABLE###'+JSON.stringify(tableRows)); anyImported = true; i++; continue; }
      const calloutM = block.match(/^>\s*\*\*[^*A-Za-zÄÖÜäöü]*(Tipp|Geheimtipp|Achtung)\s*:?\s*\*\*\s*:?\s*([\s\S]*)$/i);
      const text = calloutM ? (calloutM[1] + ': ' + calloutM[2].trim()) : convertMarkdownListLines(block);
      if(text){ fieldBuckets[currentField].push(text); anyImported = true; }
      i++; continue;
    }

    if(currentMode==='PACKING' || currentMode==='CHECKLIST_CH16'){
      const calloutM = block.match(/^>\s*\*\*[^*A-Za-zÄÖÜäöü]*(Tipp|Geheimtipp|Achtung)\s*:?\s*\*\*\s*:?\s*([\s\S]*)$/i);
      if(calloutM){
        const noteText = calloutM[1] + ': ' + calloutM[2].trim();
        if(inBucketPart) bucketlistNotes += (bucketlistNotes?'\n\n':'')+noteText;
        else if(currentMode==='PACKING') packingNotes += (packingNotes?'\n\n':'')+noteText;
        else checklistNotes += (checklistNotes?'\n\n':'')+noteText;
        anyImported = true;
        i++; continue;
      }
      if(!currentGroup && !inBucketPart){
        const introText = block.replace(/\*\*/g,'');
        if(currentMode==='PACKING') packingIntro += (packingIntro?'\n\n':'')+introText;
        else checklistIntro += (checklistIntro?'\n\n':'')+introText;
        i++; continue;
      }
      if(inBucketPart && !/^[-*]\s/.test(block)){
        bucketlistIntro += (bucketlistIntro?'\n\n':'')+block.replace(/\*\*/g,'');
        i++; continue;
      }
      const bulletLines = block.split('\n').map(l=>l.replace(/^[-*]\s+/,'').replace(/\*\*/g,'').trim()).filter(Boolean);
      bulletLines.forEach(lineText=>{
        const item = {id:genId(), text:lineText, checked:false};
        if(inBucketPart){ bucketlistItems.push(item); }
        else { item.group = currentGroup; (currentMode==='PACKING'?packingItems:checklistItems).push(item); }
      });
      anyImported = true;
      i++; continue;
    }
    i++;
  }
  if(currentMode==='ROUTES') flushRouteSub();

  const guideFields = {};
  for(const key in fieldBuckets){ guideFields[key] = fieldBuckets[key].join('\n\n'); }
  return {guideFields, packingItems, checklistItems, bucketlistItems, faqItems, newRecipes, newRoutes, packingIntro, checklistIntro, bucketlistIntro, packingNotes, checklistNotes, bucketlistNotes, anyImported};
}
/* ---------- v2.0: Markdown-Import nach Regelwerk v3 ----------
   Erkennt Guides mit Kapitel-Kennungen ({#regionen} usw.), verteilt Texte auf die Reiseführer-Felder
   und übernimmt Orte (Karte), Wanderungen, Routen, Rezepte, Sprachführer, Listen und FAQ.
   Beim erneuten Einlesen werden die aus dem Guide stammenden Einträge ersetzt (src:'guide'),
   selbst angelegte Einträge und Häkchen bleiben erhalten. */
const V3_FIELD = {ueberblick:'atAGlance', verstehen:'understanding', reisezeit:'bestTime', einreise:'entryHealth', anreise:'arrival',
  unterwegs:'gettingAround', unterkunft:'accommodation', regionen:'regions', erlebnisse:'highlights', wandern:'hiking',
  essen:'foodDrink', budget:'budgetInfo', praktisch:'tips', natur:'natureSafety'};
const V3_KREIS = '①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';
function isMarkdownV3(text){ return /^##\s.+\{#(ueberblick|regionen|routen|listen)\}\s*$/m.test(text); }

function tokenizeMarkdownV3(text){
  if(text.startsWith('---')){
    const end = text.indexOf('\n---', 3);
    if(end > 0) text = text.slice(end + 4);
  }
  const lines = text.replace(/\r/g,'').split('\n');
  const blocks = [];
  let i = 0;
  const isStart = (t) => /^(#{2,4}\s|\||>|`{3,}|📷|([-*]|\d+\.)\s)/.test(t);
  while(i < lines.length){
    const s = lines[i].trim();
    if(!s){ i++; continue; }
    let m = s.match(/^(`{3,})\s*(\w*)\s*$/);
    if(m){
      const fence = m[1], typ = m[2], data = {};
      i++;
      while(i < lines.length && !lines[i].trim().startsWith(fence)){
        const ln = lines[i]; const k = ln.indexOf(':');
        if(k > 0) data[ln.slice(0,k).trim()] = ln.slice(k+1).trim();
        i++;
      }
      i++;
      blocks.push({t:'daten', typ, d:data});
      continue;
    }
    m = s.match(/^(#{2,4})\s+(.*?)\s*(?:\{#([\w-]+)\})?\s*$/);
    if(m){ blocks.push({t:'h', lvl:m[1].length, text:m[2], id:m[3]||''}); i++; continue; }
    if(s.startsWith('|')){
      const rows = [];
      while(i < lines.length && lines[i].trim().startsWith('|')){
        const r = lines[i].trim();
        if(!/^\|[\s:|-]+\|$/.test(r)) rows.push(r.replace(/^\||\|$/g,'').split('|').map(c=>c.trim()));
        i++;
      }
      blocks.push({t:'tabelle', rows}); continue;
    }
    if(s.startsWith('>')){
      const q = [];
      while(i < lines.length && lines[i].trim().startsWith('>')){ q.push(lines[i].trim().slice(1).trim()); i++; }
      const bm = (q[0]||'').match(/^\*\*(💡 TIPP|🤫 GEHEIMTIPP|⚠ ACHTUNG|⭐ BEST OF[^*:]*):?\*\*:?\s*(.*)$/);
      blocks.push({t:'box', label: bm ? bm[1].trim() : 'HINWEIS', lines: (bm ? [bm[2]].concat(q.slice(1)) : q).filter(x=>x)});
      continue;
    }
    if(s.startsWith('📷')){ i++; continue; }
    if(/^([-*]|\d+\.)\s+/.test(s)){
      const ordered = /^\d+\./.test(s), items = [];
      while(i < lines.length){
        const t = lines[i];
        if(/^\s*([-*]|\d+\.)\s+/.test(t)) items.push(t.replace(/^\s*([-*]|\d+\.)\s+/,'').trim());
        else if(/^  /.test(t) && t.trim() && items.length) items[items.length-1] += ' ' + t.trim();
        else break;
        i++;
      }
      blocks.push({t:'liste', ordered, items}); continue;
    }
    const para = [s]; i++;
    while(i < lines.length && lines[i].trim() && !isStart(lines[i].trim())){ para.push(lines[i].trim()); i++; }
    blocks.push({t:'absatz', text: para.join(' ')});
  }
  return blocks;
}

function parseMarkdownV3(text, destId){
  const blocks = tokenizeMarkdownV3(text);
  // Kapitel bilden
  const chapters = [];
  let cur = null;
  blocks.forEach(b=>{
    if(b.t==='h' && b.lvl===2){ cur = {id:b.id, title:b.text, blocks:[]}; chapters.push(cur); return; }
    if(cur) cur.blocks.push(b);
  });
  // Namen aller Datensätze (für Routentage)
  const names = {};
  blocks.forEach(b=>{ if(b.t==='daten' && b.d.id) names[b.d.id] = b.d.name || b.d.id; });

  const linkText = (s) => (s||'').replace(/\[([^\]]+)\]\(([^)]+)\)/g, '$1 ($2)');
  const plain = (s) => linkText(s).replace(/\*\*/g,'');
  function blockToText(b){
    if(b.t==='h') return b.lvl===3 ? '###SUBHEAD###'+plain(b.text) : '**'+plain(b.text)+'**';
    if(b.t==='absatz') return linkText(b.text);
    if(b.t==='liste') return b.items.map((it,ix)=> b.ordered ? `${ix+1}. ${linkText(it)}` : `• ${linkText(it)}`).join('\n');
    if(b.t==='tabelle') return '###TABLE###'+JSON.stringify(b.rows.map(r=>r.map(plain)));
    if(b.t==='box'){
      const body = b.lines.map(l=>linkText(l.replace(/^([-*]|\d+\.)\s+/,''))).join(' · ');
      if(/GEHEIMTIPP/.test(b.label)) return 'Geheimtipp: '+body;
      if(/TIPP/.test(b.label)) return 'Tipp: '+body;
      if(/ACHTUNG/.test(b.label)) return 'Achtung: '+body;
      return `**${b.label.replace('BEST OF','Best of')}:** ${body}`;
    }
    if(b.t==='daten'){
      const d = b.d;
      if(b.typ==='ort'){
        const nr = parseInt(d.nr,10);
        const head = `**${nr>0&&nr<=20 ? V3_KREIS[nr-1]+' ' : ''}${d.name||''}** ${'★'.repeat(parseInt(d.sterne,10)||0)}${(d.geheimtipp||'').toLowerCase()==='ja'?' 🤫':''}`;
        const info = [d.dauer && 'Dauer '+d.dauer, d.eintritt && 'Eintritt '+d.eintritt, d.saison].filter(Boolean).join(' · ');
        return [head, d.text||'', info].filter(Boolean).join('\n');
      }
      if(b.typ==='region'){
        return [`**Basisorte:** ${d.basisorte||''} · **Empfohlen:** ${d.tage||''} Tage`, `**Ideal für:** ${d.ideal_fuer||''}`, `**Anreise:** ${d.anreise||''}`].join('\n');
      }
      if(b.typ==='wanderung'){
        return `**${d.name||''}** · ${d.schwierigkeit||''}\n${d.laenge_km||'?'} km · ↑ ${d.hoehenmeter_auf||0} m · ↓ ${d.hoehenmeter_ab||0} m · ${d.dauer||''} · ${d.saison||''}`;
      }
      if(b.typ==='tag'){
        const orte = (d.orte||'').split(',').map(x=>x.trim()).filter(Boolean).map(x=>names[x]||x).join(', ');
        return `Übernachtung: ${d.uebernachtung||''}${orte ? ' · Stationen: '+orte : ''}`;
      }
    }
    return '';
  }
  const join = (arr) => arr.map(blockToText).filter(Boolean).join('\n\n');

  const out = {guideFields:{}, pois:[], hikes:[], routes:[], recipes:[], phrases:[], faq:[],
    packing:[], checklist:[], bucketlist:[], packingIntro:'', checklistIntro:'', bucketlistIntro:'', counts:{}};

  // Abschnitte (###) eines Kapitels
  function sections(ch){
    const secs = [{title:'', blocks:[]}];
    ch.blocks.forEach(b=>{
      if(b.t==='h' && b.lvl===3) secs.push({title:b.text, head:b, blocks:[]});
      else secs[secs.length-1].blocks.push(b);
    });
    return secs;
  }

  chapters.forEach(ch=>{
    const field = V3_FIELD[ch.id];
    if(ch.id==='ueberblick'){
      const rest = [];
      sections(ch).forEach(sec=>{
        if(/bucket/i.test(sec.title)){
          sec.blocks.forEach(b=>{
            if(b.t==='liste') b.items.forEach(t=>out.bucketlist.push({id:genId(), text:plain(t), checked:false, src:'guide'}));
            else if(b.t==='absatz') out.bucketlistIntro += (out.bucketlistIntro?'\n\n':'') + plain(b.text);
          });
        } else {
          if(sec.head) rest.push(sec.head);
          rest.push(...sec.blocks);
        }
      });
      out.guideFields.atAGlance = join(rest);
      return;
    }
    if(ch.id==='regionen'){
      let regionName = '';
      ch.blocks.forEach(b=>{
        if(b.t==='h' && b.lvl===3) regionName = b.text.split(' — ')[0].trim();
        if(b.t==='daten' && b.typ==='ort'){
          const d = b.d, lat = parseFloat(d.lat), lng = parseFloat(d.lng);
          if(!isNaN(lat) && !isNaN(lng)){
            out.pois.push({id:genId(), name:d.name||'', lat, lng, region:regionName, desc:d.text||'',
              geheimtipp:(d.geheimtipp||'').toLowerCase()==='ja', stars:parseInt(d.sterne,10)||0, nr:parseInt(d.nr,10)||0,
              typ:d.typ||'', dauer:d.dauer||'', eintritt:d.eintritt||'', saison:d.saison||'', guideId:d.id||'', src:'guide'});
          }
        }
      });
      out.guideFields.regions = join(ch.blocks);
      return;
    }
    if(ch.id==='routen'){
      sections(ch).forEach(sec=>{
        if(!sec.title) return;
        const route = {id:genId(), title:plain(sec.title), text:'', days:[], src:'guide'};
        const intro = [];
        let day = null;
        sec.blocks.forEach(b=>{
          if(b.t==='h' && b.lvl===4){ day = {label:plain(b.text), text:''}; route.days.push(day); return; }
          const t = plain(blockToText(b)).replace(/^###SUBHEAD###/,'');
          if(!t) return;
          if(day) day.text += (day.text?'\n\n':'') + t; else intro.push(t);
        });
        route.text = intro.join('\n\n');
        if(route.days.length) out.routes.push(route);
        else if(out.routes.length && route.text){
          const last = out.routes[out.routes.length-1];
          last.text = (last.text ? last.text + '\n\n' : '') + route.title + ':\n' + route.text;
        }
      });
      return;
    }
    if(ch.id==='wandern'){
      const secs = sections(ch);
      secs.forEach(sec=>{
        const w = sec.blocks.find(b=>b.t==='daten' && b.typ==='wanderung');
        if(!w) return;
        const d = w.d;
        const desc = sec.blocks.filter(b=>b.t==='absatz').map(b=>plain(b.text)).join('\n\n');
        out.hikes.push({id:genId(), title:d.name||plain(sec.title), distanceKm:d.laenge_km||'', durationText:d.dauer||'',
          difficulty:d.schwierigkeit||'', description:desc, gpxTrack:null, elevationGain:parseInt(d.hoehenmeter_auf,10)||null,
          elevationLoss:parseInt(d.hoehenmeter_ab,10)||null, startLat:parseFloat(d.start_lat)||null, startLng:parseFloat(d.start_lng)||null,
          endName:d.ende||'', loop:(d.rundweg||'')==='ja', season:d.saison||'', fee:d.gebuehr||'', komootUrl:normalizeKomootUrl(d.komoot||''), guideId:d.id||'', src:'guide'});
      });
      out.guideFields.hiking = join(ch.blocks);
      return;
    }
    if(ch.id==='essen'){
      const rest = [];
      sections(ch).forEach(sec=>{
        if(/rezept/i.test(sec.title)){
          rest.push(sec.head);
          let rz = null;
          const finish = () => {
            if(!rz) return;
            const r = rz;
            const ingredients = r.groups.length===1 ? r.groups[0].items.join('\n') : r.groups.map(g=>g.name+':\n'+g.items.join('\n')).join('\n\n');
            out.recipes.push({id:genId(), destId, category:'Sonstiges', nameNative:r.name, nameGerman:r.sub,
              servings:(r.meta.split('·')[0]||'').trim(), time:r.meta.split('·').slice(1).join('·').trim(),
              ingredients, steps:r.steps.join('\n'), src:'guide'});
          };
          sec.blocks.forEach(b=>{
            if(b.t==='h' && b.lvl===4){ finish(); rz = {name:plain(b.text), sub:'', meta:'', groups:[], steps:[], mode:null}; return; }
            if(!rz){ const t = blockToText(b); if(t) rest.push(b); return; }
            if(b.t==='absatz'){
              const hm = b.text.match(/^\*\*(.+)\*\*$/);
              if(hm){ if(/zubereitung/i.test(hm[1])) rz.mode = 'steps'; else { rz.groups.push({name:hm[1], items:[]}); rz.mode = 'ing'; } }
              else if(!rz.sub && /^\*[^*].*\*$/.test(b.text)) rz.sub = b.text.replace(/^\*|\*$/g,'');
              else if(!rz.meta) rz.meta = plain(b.text);
            } else if(b.t==='liste'){
              if(rz.mode==='steps') rz.steps.push(...b.items.map(plain));
              else if(rz.groups.length) rz.groups[rz.groups.length-1].items.push(...b.items.map(plain));
            }
          });
          finish();
        } else {
          if(sec.head) rest.push(sec.head);
          rest.push(...sec.blocks);
        }
      });
      out.guideFields.foodDrink = join(rest);
      return;
    }
    if(ch.id==='praktisch'){
      const rest = [];
      sections(ch).forEach(sec=>{
        if(/sprachf/i.test(sec.title)){
          const tab = sec.blocks.find(b=>b.t==='tabelle');
          if(tab){
            const head = tab.rows[0].map(c=>plain(c).toLowerCase());
            const iDe = head.findIndex(c=>c.startsWith('deutsch'));
            const iAus = head.findIndex(c=>c.startsWith('aussprache'));
            const iKat = head.findIndex(c=>c.startsWith('kategorie'));
            const iLoc = head.findIndex((c,ix)=>ix!==iDe && ix!==iAus && ix!==iKat);
            tab.rows.slice(1).forEach(r=>{
              const local = plain(r[iLoc]||''), german = plain(r[iDe]||'');
              if(!local || !german) return;
              out.phrases.push({id:genId(), local: iAus>=0 && r[iAus] ? `${local} (${plain(r[iAus])})` : local, german,
                category: iKat>=0 ? plain(r[iKat]||'') : '', src:'guide'});
            });
          }
        } else {
          if(sec.head) rest.push(sec.head);
          rest.push(...sec.blocks);
        }
      });
      out.guideFields.tips = join(rest);
      return;
    }
    if(ch.id==='listen'){
      sections(ch).forEach(sec=>{
        const target = /pack/i.test(sec.title) ? 'packing' : (/check/i.test(sec.title) ? 'checklist' : null);
        if(!target) return;
        let group = '';
        sec.blocks.forEach(b=>{
          if(b.t==='h' && b.lvl===4){ group = plain(b.text); return; }
          if(b.t==='liste') b.items.forEach(t=>out[target].push({id:genId(), text:plain(t), checked:false, group, src:'guide'}));
          if(b.t==='absatz' && !group) out[target+'Intro'] += (out[target+'Intro']?'\n\n':'') + plain(b.text);
        });
      });
      return;
    }
    if(ch.id==='faq'){
      let q = null;
      ch.blocks.forEach(b=>{
        if(b.t==='h' && b.lvl===3){ q = {id:genId(), question:plain(b.text), answer:'', src:'guide'}; out.faq.push(q); return; }
        if(q && b.t==='absatz') q.answer += (q.answer?'\n\n':'') + plain(b.text);
      });
      return;
    }
    if(field) out.guideFields[field] = join(ch.blocks);
  });
  out.counts = {Orte:out.pois.length, Wanderungen:out.hikes.length, Routen:out.routes.length, Rezepte:out.recipes.length,
    Vokabeln:out.phrases.length, FAQ:out.faq.length};
  return out;
}

async function applyMarkdownV3(text, fileName){
  const dd = destDataCache[state.destId];
  const r = parseMarkdownV3(text, state.destId);
  // Texte: Felder aus dem Guide ersetzen
  Object.keys(r.guideFields).forEach(f=>{ if(r.guideFields[f]) dd.guide[f] = r.guideFields[f]; });
  // Einträge aus dem Guide ersetzen, eigene behalten; Häkchen nach Text übernehmen
  const keepChecks = (oldArr, newArr) => {
    const checked = new Set(oldArr.filter(x=>x.checked).map(x=>x.text.trim().toLowerCase()));
    newArr.forEach(x=>{ if(checked.has(x.text.trim().toLowerCase())) x.checked = true; });
  };
  const norm = (x) => String(x.text || x.local || x.name || x.question || '').trim().toLowerCase();
  const replace = (key, arr) => {
    const own = (dd[key]||[]).filter(x=>x.src!=='guide');
    const ownKeys = new Set(own.map(norm));
    dd[key] = own.concat(arr.filter(x=>!ownKeys.has(norm(x))));
  };
  ['packing','checklist','bucketlist'].forEach(k=>{ keepChecks(dd[k]||[], r[k]); replace(k, r[k]); });
  replace('pois', r.pois);
  replace('routes', r.routes);
  replace('faq', r.faq);
  replace('phrases', r.phrases);
  dedupePhrases(dd);
  // Wanderungen: Protokolle bereits gelaufener Touren behalten
  const oldHikes = dd.hikingRoutes || [];
  r.hikes.forEach(h=>{
    const old = oldHikes.find(o=>o.src==='guide' && o.guideId && o.guideId===h.guideId);
    if(old){ h.hikeLogs = old.hikeLogs || []; if(old.gpxTrack){ h.gpxTrack = old.gpxTrack; if(old.elevationGain && !h.elevationGain) h.elevationGain = old.elevationGain; } if(old.komootUrl && !h.komootUrl) h.komootUrl = old.komootUrl; }
  });
  replace('hikingRoutes', r.hikes);
  if(r.packingIntro) dd.packingIntro = r.packingIntro;
  if(r.checklistIntro) dd.checklistIntro = r.checklistIntro;
  if(r.bucketlistIntro) dd.bucketlistIntro = r.bucketlistIntro;
  // Rezepte dieses Ziels aus dem Guide ersetzen
  for(let i = recipes.length-1; i>=0; i--){ if(recipes[i].destId===state.destId && recipes[i].src==='guide') recipes.splice(i,1); }
  recipes.push(...r.recipes);
  dd.guide.imported = false;
  dd.guide.importedFileName = fileName;
  dd.guide.importFormat = 'v3';
  dd.guide.importedAt = new Date().toISOString();
  await saveDestData(state.destId);
  await sSet('recipes', recipes);
  render();
  const summary = Object.entries(r.counts).filter(([,n])=>n).map(([k,n])=>`${n} ${k}`).join(', ');
  showToast('Reiseführer eingelesen' + (summary ? ': ' + summary : '') + '.');
}

async function onGuideMarkdownSelected(file){
  try{
    const text = await file.text();
    if(!text.trim()){ showToast('Aus dieser Datei konnte kein Text extrahiert werden.'); return; }
    if(isMarkdownV3(text)){ await applyMarkdownV3(text, file.name); return; }
    const dd = destDataCache[state.destId];
    const result = parseMarkdownGuide(text, state.destId);

    Object.keys(result.guideFields).forEach(field=>{
      if(result.guideFields[field]){
        dd.guide[field] = dd.guide[field] ? dd.guide[field]+'\n\n'+result.guideFields[field] : result.guideFields[field];
      }
    });
    result.bucketlistItems.forEach(it=>{ if(pushIfNew(dd.bucketlist, it, x=>x.text.trim().toLowerCase())) result.anyImported = true; });
    result.packingItems.forEach(it=>{ if(pushIfNew(dd.packing, it, x=>x.text.trim().toLowerCase())) result.anyImported = true; });
    result.checklistItems.forEach(it=>{ if(pushIfNew(dd.checklist, it, x=>x.text.trim().toLowerCase())) result.anyImported = true; });
    if(result.packingIntro && !dd.packingIntro.includes(result.packingIntro)) dd.packingIntro = dd.packingIntro ? dd.packingIntro+'\n\n'+result.packingIntro : result.packingIntro;
    if(result.checklistIntro && !dd.checklistIntro.includes(result.checklistIntro)) dd.checklistIntro = dd.checklistIntro ? dd.checklistIntro+'\n\n'+result.checklistIntro : result.checklistIntro;
    if(result.bucketlistIntro && !dd.bucketlistIntro.includes(result.bucketlistIntro)) dd.bucketlistIntro = dd.bucketlistIntro ? dd.bucketlistIntro+'\n\n'+result.bucketlistIntro : result.bucketlistIntro;
    if(result.packingNotes && !dd.packingNotes.includes(result.packingNotes)) dd.packingNotes = dd.packingNotes ? dd.packingNotes+'\n\n'+result.packingNotes : result.packingNotes;
    if(result.checklistNotes && !dd.checklistNotes.includes(result.checklistNotes)) dd.checklistNotes = dd.checklistNotes ? dd.checklistNotes+'\n\n'+result.checklistNotes : result.checklistNotes;
    if(result.bucketlistNotes && !dd.bucketlistNotes.includes(result.bucketlistNotes)) dd.bucketlistNotes = dd.bucketlistNotes ? dd.bucketlistNotes+'\n\n'+result.bucketlistNotes : result.bucketlistNotes;
    result.faqItems.forEach(it=>{ if(pushIfNew(dd.faq, it, x=>x.question.trim().toLowerCase())) result.anyImported = true; });
    result.newRoutes.forEach(r=>{ if(pushIfNew(dd.routes, r, x=>x.title.trim().toLowerCase())) result.anyImported = true; });
    result.newRecipes.forEach(r=>{ if(pushIfNew(recipes, r, x=>x.destId+'|'+x.nameNative.trim().toLowerCase())) result.anyImported = true; });

    dd.guide.imported = false;
    dd.guide.importedFileName = file.name;
    await saveDestData(state.destId);
    await sSet('recipes', recipes);
    render();
    showToast(result.anyImported ? 'Reiseführer eingelesen und auf die Reiter verteilt – bitte prüfen.' : 'Es konnte nichts eindeutig zugeordnet werden – bitte manuell prüfen.');
  }catch(e){
    showToast('Datei konnte nicht gelesen werden. Bitte eine .md-Datei im vereinbarten Format verwenden.');
  }
}

function renderWetterTab(){
  return `
    <div class="map-tools-row">
      <button type="button" class="btn" data-action="locate-me-weather">${ICON.locationDot} Mein Standort</button>

async function loadWeather(lat, lng, locationName){
  const el = document.getElementById('weather-content');
  if(!el) return;
  el.innerHTML = 'Lade Wetterdaten…';
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=5`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('bad response');
    const data = await res.json();
    const cur = data.current;
    const [curEmoji,curLabel] = weatherInfo(cur.weather_code);
    let localTime = '';
    try{ localTime = new Date().toLocaleTimeString('de-DE',{timeZone:data.timezone, hour:'2-digit', minute:'2-digit'}); }catch(e){}
    let daysHtml = '';
    for(let i=0;i<data.daily.time.length;i++){
      const [emoji] = weatherInfo(data.daily.weather_code[i]);
      const dow = new Date(data.daily.time[i]+'T12:00:00').toLocaleDateString('de-DE',{weekday:'short'});
      daysHtml += `<div class="weather-day">
        <div class="wd-day">${dow}</div>
        <div class="wd-emoji">${emoji}</div>
        <div>${Math.round(data.daily.temperature_2m_max[i])}° / ${Math.round(data.daily.temperature_2m_min[i])}°</div>
      </div>`;
    }
    el.innerHTML = `
      <div class="weather-location-row">
        <span>${ICON.locationDot} ${escapeHtml(locationName)}</span>
        ${localTime? `<span>🕐 ${localTime} Uhr Ortszeit</span>`:''}
      </div>
      <div class="weather-now">
        <div class="wn-emoji">${curEmoji}</div>
        <div>
          <div class="wn-temp">${Math.round(cur.temperature_2m)}°C</div>
          <div class="wn-label">${curLabel}</div>
          <div class="wn-meta"><span>Wind ${Math.round(cur.wind_speed_10m)} km/h</span><span>Feuchte ${cur.relative_humidity_2m}%</span></div>
        </div>
      </div>
      <div class="weather-forecast">${daysHtml}</div>
    `;
  }catch(err){
    el.innerHTML = `<p class="empty-state">Wetterdaten konnten nicht geladen werden. Prüfe deine Internetverbindung.</p>`;
  }
}
async function locateMeForWeather(){
  if(!navigator.geolocation){
    showToast('Standortbestimmung wird von diesem Browser nicht unterstützt.');
    return;
  }
  showToast('Suche deinen Standort…');
  try{
    const pos = await new Promise((resolve,reject)=>{
      navigator.geolocation.getCurrentPosition(resolve, reject, {enableHighAccuracy:true, timeout:10000});
    });
    const lat = pos.coords.latitude, lng = pos.coords.longitude;
    let name = 'Mein Standort';
    try{
      const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
      if(res.ok){
        const data = await res.json();
        const a = data.address || {};
        name = a.city || a.town || a.village || a.municipality || (data.display_name? data.display_name.split(',')[0] : name);
      }
    }catch(e){}
    await loadWeather(lat, lng, name);
  }catch(err){
    showToast('Standort nicht verfügbar (Berechtigung verweigert oder in dieser Umgebung nicht unterstützt).');
  }
}

/* Gemeinsame Listen-Ansicht: Fortschritt, Gruppen als Karten, Bearbeiten-Modus, Schnell-Hinzufügen */
function renderListPanel(o){
  // o = {items, key, intro, notes, addLabel, toggleAction, deleteAction, addAction, attrs}
  const items = o.items || [];
  const done = items.filter(i=>i.checked).length;
  const edit = !!state.listEdit;
  const attrs = o.attrs || '';
  const row = (it)=>`
    <div class="lrow ${it.checked?'checked':''}">
      <div class="checkbox ${it.checked?'checked':''}" data-action="${o.toggleAction}" data-list="${o.key}" data-id="${it.id}" ${attrs}>${it.checked?'✓':''}</div>
      <div class="lrow-text" data-action="${o.toggleAction}" data-list="${o.key}" data-id="${it.id}" ${attrs}>${escapeHtml(it.text)}</div>
      ${edit ? `<button type="button" class="lrow-del" data-action="${o.deleteAction}" data-list="${o.key}" data-id="${it.id}" ${attrs} aria-label="Löschen">${ICON.trash}</button>` : ''}
    </div>`;
  let body = '';
  if(!items.length){
    body = '<p class="empty-state">Noch nichts eingetragen.</p>';
  } else if(!items.some(i=>i.group)){
    body = `<div class="pg-card lgroup-body">${items.map(row).join('')}</div>`;
  } else {
    const groups = [];
    items.forEach(it=>{ const g = it.group || ''; let x = groups.find(y=>y.name===g); if(!x){ x = {name:g, items:[]}; groups.push(x); } x.items.push(it); });
    const openSet = state.listOpenGroups || [];
    body = groups.map(g=>{
      const gk = o.key+':'+g.name;
      const gDone = g.items.filter(i=>i.checked).length;
      const isOpen = openSet.includes(gk);
      const complete = gDone===g.items.length;
      return `<div class="pg-card lgroup ${isOpen?'open':''}">
        <button type="button" class="lgroup-head" data-action="toggle-list-group" data-key="${escapeHtml(gk)}">
          <span class="lgroup-title">${escapeHtml(g.name || 'Eigene Einträge')}</span>
          <span class="lgroup-count ${complete?'complete':''}">${complete ? '✓ ' : ''}${gDone}/${g.items.length}</span>
          <span class="gch-caret">${isOpen?'▾':'▸'}</span>
        </button>
        <div class="lgroup-bar"><span style="width:${gDone/g.items.length*100}%"></span></div>
        ${isOpen ? `<div class="lgroup-body">${g.items.map(row).join('')}</div>` : ''}
      </div>`;
    }).join('');
  }
  const pct = items.length ? Math.round(done/items.length*100) : 0;
  return `
    ${items.length ? `<div class="lprog">
      <div class="lprog-top"><span><b>${done}</b> von ${items.length} erledigt</span>
        <span class="lprog-tools">
          ${items.some(i=>i.group) ? `<button type="button" class="gch-link" data-action="list-open-all" data-list="${o.key}">${(state.listOpenGroups||[]).some(k=>k.startsWith(o.key+':')) ? 'Alle zu' : 'Alle auf'}</button>` : ''}
          <button type="button" class="gch-link" data-action="toggle-list-edit">${edit ? 'Fertig' : 'Bearbeiten'}</button>
        </span></div>
      <div class="bk-bar" style="margin:8px 0 0;"><span style="width:${pct}%;background:var(--green);"></span></div>
    </div>` : ''}
    ${o.intro ? `<p class="pg-intro">${escapeHtml(o.intro)}</p>` : ''}
    ${body}
    <div class="ladd">
      <input class="input" id="quick-add-${o.key}" placeholder="${escapeHtml(o.addLabel)} …" autocomplete="off">
      <button type="button" class="btn btn-add" data-action="${o.addAction}" data-list="${o.key}" ${attrs} aria-label="Hinzufügen">${PLUS_SVG}</button>
    </div>
    ${o.notes ? `<div style="margin-top:14px;">${renderGuideCalloutText(o.notes)}</div>` : ''}`;
}

/* ---------- Budget tab (v2.0: Reisebudget, Tagesbudget, Abrechnung) ---------- */
const BUDGET_CATS = ['Flug','Unterkunft','Mietwagen','Transport','Essen','Aktivitäten','Einkaufen','Versicherung','Sonstiges'];
const CVE_EUR_FIX = 110.265;
let RATE_CACHE = (()=>{ try{ return JSON.parse(localStorage.getItem('rb-rates')||'{}'); }catch(e){ return {}; } })();
let rateFetchPending = false;
function eurPerUnit(cur){
  if(cur==='EUR') return 1;
  if(cur==='CVE') return 1/CVE_EUR_FIX;
  return RATE_CACHE[cur] || null;
}
function toEur(amount, cur){ const r = eurPerUnit(cur); return r==null ? null : Number(amount)*r; }
async function ensureRates(curs){
  const today = todayIso();
  const missing = [...new Set(curs)].filter(c=>c!=='EUR' && c!=='CVE' && (!RATE_CACHE[c] || RATE_CACHE._date!==today));
  if(!missing.length || rateFetchPending) return false;
  rateFetchPending = true;
  try{
    const r = await fetch(`https://api.frankfurter.dev/v1/latest?base=EUR&symbols=${missing.join(',')}`);
    if(!r.ok) throw new Error('rates');
    const j = await r.json();
    let added = false;
    Object.entries(j.rates||{}).forEach(([c,v])=>{ if(v){ if(!RATE_CACHE[c]) added = true; RATE_CACHE[c] = 1/v; } });
    RATE_CACHE._date = today;
    try{ localStorage.setItem('rb-rates', JSON.stringify(RATE_CACHE)); }catch(e){}
    return added;
  }catch(e){ return false; }
  finally{ rateFetchPending = false; }
}
function todayIso(){ const d = new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function tripDayList(trip){
  if(!trip.dateFrom) return [];
  const out = [];
  const start = new Date(trip.dateFrom+'T00:00:00'), end = new Date((trip.dateTo||trip.dateFrom)+'T00:00:00');
  for(let d = new Date(start); d<=end && out.length<120; d.setDate(d.getDate()+1)){
    out.push(new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10));
  }
  return out;
}
function tripTravelers(trip){
  if(Array.isArray(trip.travelers) && trip.travelers.length) return trip.travelers;
  const extra = (trip.companions||'').split(/,|\bund\b|&/).map(s=>s.trim()).filter(Boolean);
  return ['Ich', ...(extra.length ? extra : ['Begleitung'])];
}
function fmtEur(v){ return (v==null||isNaN(v)) ? '–' : v.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'; }
function fmtMoney(v, cur){ if(cur==='EUR') return fmtEur(Number(v)); return Number(v).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+cur; }
function shortDateDe(iso){ const d = new Date(iso+'T00:00:00'); return d.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'}); }

function computeSettlement(trip){
  const people = tripTravelers(trip);
  const bal = Object.fromEntries(people.map(p=>[p,0]));
  let skipped = 0, unknownRate = 0;
  trip.budget.forEach(b=>{
    if(!b.paidBy || !(b.paidBy in bal)){ skipped++; return; }
    const eur = toEur(b.amount, b.currency);
    if(eur==null){ unknownRate++; return; }
    const forWhom = (!b.forWhom || b.forWhom==='alle' || !(b.forWhom in bal)) ? people : [b.forWhom];
    bal[b.paidBy] += eur;
    forWhom.forEach(p=>{ bal[p] -= eur/forWhom.length; });
  });
  const debtors = people.filter(p=>bal[p]<-0.005).map(p=>({p, v:-bal[p]})).sort((a,b)=>b.v-a.v);
  const creditors = people.filter(p=>bal[p]>0.005).map(p=>({p, v:bal[p]})).sort((a,b)=>b.v-a.v);
  const transfers = [];
  let i=0, j=0;
  while(i<debtors.length && j<creditors.length){
    const x = Math.min(debtors[i].v, creditors[j].v);
    if(x>0.005) transfers.push({from:debtors[i].p, to:creditors[j].p, amount:x});
    debtors[i].v -= x; creditors[j].v -= x;
    if(debtors[i].v<0.005) i++;
    if(creditors[j].v<0.005) j++;
  }
  return {people, bal, transfers, skipped, unknownRate};
}

async function computeBudgetGrandTotal(trip){
  if(!trip) return;
  const added = await ensureRates(trip.budget.map(b=>b.currency));
  if(added && state.view==='trip' && state.tripTab==='budget') render();
}
async function fetchRate(base, symbol){
  const r = await fetch(`https://api.frankfurter.dev/v1/latest?base=${base}&symbols=${symbol}`);
  if(!r.ok) throw new Error('rate fetch failed');
  const j = await r.json();
  return j.rates[symbol];
}
async function doConvertCurrency(){
  const amount = parseFloat(document.getElementById('conv-amount').value);
  const from = document.getElementById('conv-from').value;
  const to = document.getElementById('conv-to').value;
  const resultEl = document.getElementById('conv-result');
  if(isNaN(amount)){ resultEl.textContent='Bitte einen Betrag eingeben.'; return; }
  if(from===to){ resultEl.textContent = `${amount.toFixed(2)} ${from} = ${amount.toFixed(2)} ${to}`; return; }
  resultEl.textContent = 'Rechne um…';
  const CVE_PER_EUR = 110.265;
  try{
    let eurAmount;
    if(from==='CVE') eurAmount = amount/CVE_PER_EUR;
    else if(from==='EUR') eurAmount = amount;
    else { const rate = await fetchRate(from,'EUR'); eurAmount = amount*rate; }

    let result;
    if(to==='CVE') result = eurAmount*CVE_PER_EUR;
    else if(to==='EUR') result = eurAmount;
    else { const rate2 = await fetchRate('EUR',to); result = eurAmount*rate2; }

    resultEl.textContent = `${amount.toFixed(2)} ${from} = ${result.toFixed(2)} ${to}`;
  }catch(err){
    resultEl.textContent = 'Umrechnung nicht verfügbar (keine Verbindung zum Kursdienst).';
  }
}

async function saveBudgetPlan(){
  const trip = trips.find(t=>t.id===state.tripId);
  const total = parseFloat(String(document.getElementById('budget-plan-total').value).replace(',','.'));
  const names = document.getElementById('budget-travelers').value.split(',').map(x=>x.trim()).filter(Boolean);
  trip.budgetPlan = Object.assign({}, trip.budgetPlan, {total: isNaN(total) ? 0 : total});
  const old = tripTravelers(trip);
  if(names.length){
    // umbenannte Personen in bestehenden Ausgaben nachziehen (gleiche Position)
    trip.budget.forEach(b=>{
      const i = old.indexOf(b.paidBy); if(i>=0 && names[i] && names[i]!==b.paidBy) b.paidBy = names[i];
      const k = old.indexOf(b.forWhom); if(k>=0 && names[k] && names[k]!==b.forWhom) b.forWhom = names[k];
    });
    trip.travelers = names;
  }
  await saveTrips();
  state.editingBudgetPlan = false;
  render();
}
async function toggleBudgetPaid(id){
  const trip = trips.find(t=>t.id===state.tripId);
  const item = trip.budget.find(b=>b.id===id);
  if(item){ item.paid = !item.paid; await saveTrips(); render(); }
}
async function deleteBudget(id){
  const trip = trips.find(t=>t.id===state.tripId);
  trip.budget = trip.budget.filter(b=>b.id!==id);
  await saveTrips();
  render();
}

      </div>
    </div>` : `<button type="button" class="btn pg-add-btn" data-action="show-add-doc" data-kind="docs">+ Info hinzufügen</button>`;

  const emergencyForm = state.addingDoc==='emergency' ? `
    <div class="inline-form">
      <input class="input" id="new-doc-label" placeholder="Bezeichnung (z.B. Botschaft)" style="margin-bottom:8px;">

  return `

async function confirmAddDoc(kind){
  const label = document.getElementById('new-doc-label').value.trim();
  const value = document.getElementById('new-doc-value').value.trim();
  if(!label || !value) return;
  const dd = destDataCache[state.destId];
  const item = kind==='emergency' ? {id:genId(), label, number:value} : {id:genId(), label, value};
  dd[kind].push(item);
  await saveDestData(state.destId);
  state.addingDoc = null;
  render();
}
async function deleteDoc(kind,id){
  const dd = destDataCache[state.destId];
  dd[kind] = dd[kind].filter(d=>d.id!==id);
  await saveDestData(state.destId);
  render();
}

/* ---------- Add / delete destination ---------- */
async function confirmAddDest(){
  const name = document.getElementById('new-dest-name').value.trim();
  const flag = document.getElementById('new-dest-flag').value.trim() || ICON.locationDot;
  const continent = document.getElementById('new-dest-continent').value;
  const lat = parseFloat(document.getElementById('new-dest-lat').value);
  const lng = parseFloat(document.getElementById('new-dest-lng').value);
  if(!name || isNaN(lat) || isNaN(lng)){ showToast('Bitte Name sowie Breiten- und Längengrad angeben.'); return; }
  const id = genId();
  destinations.push({id,name,flag,lat,lng,currency:'EUR',continent});
  await sSet('destinations', destinations);
  destDataCache[id] = {guide:{...EMPTY_GUIDE}, pois:[], routes:[], hikingRoutes:[], packing:[], checklist:[], packingIntro:'', checklistIntro:'', bucketlistIntro:'', packingNotes:'', checklistNotes:'', bucketlistNotes:'', todos:[], diary:[], photoIds:[], budget:[], docs:[], emergency:[], bucketlist:[], faq:[], phrases:[]};
  await saveDestData(id);
  state.showAddDest = false;
  render();
}
async function deleteDestination(id){
  destinations = destinations.filter(d=>d.id!==id);
  await sSet('destinations', destinations);
  await sDelete('dest-data:'+id);
  delete destDataCache[id];
  state.confirmingDelete = null;
  render();
}

  if(e.target.dataset && e.target.dataset.vacTrip){
    const t = trips.find(x=>x.id===e.target.dataset.vacTrip);
    if(t){ t.vacationDays = t.vacationDays || {}; t.vacationDays[e.target.dataset.year] = e.target.value===''? null : parseFloat(e.target.value); await saveTrips(); render(); }
  }
  if(e.target.dataset && e.target.dataset.recipeField){
    const recipe = recipes.find(r=>r.id===e.target.dataset.recipeId);
    if(recipe){
      recipe[e.target.dataset.recipeField] = e.target.value;
      await sSet('recipes', recipes);
    }
  }
});

document.getElementById('app').addEventListener('input', function(e){
  if(e.target.id==='faq-search' || e.target.id==='phrase-search' || e.target.id==='poi-search'){
    const q = e.target.value.trim().toLowerCase();
    const sel = {'faq-search':'.faq-item','phrase-search':'.vocab-row','poi-search':'.poi2-row'}[e.target.id];
    let hits = 0;
    document.querySelectorAll(sel).forEach(el=>{ const ok = !q || (el.dataset.searchText||el.dataset.faqText||'').includes(q); el.style.display = ok ? '' : 'none'; if(ok) hits++; });
    document.querySelectorAll('[data-search-group]').forEach(g=>{ const any = [...g.querySelectorAll(sel)].some(x=>x.style.display!=='none'); g.style.display = any ? '' : 'none'; if(q && any) g.classList.add('force-open'); else g.classList.remove('force-open'); });
    const nh = document.getElementById(e.target.id.replace('-search','-nohit')); if(nh) nh.style.display = hits ? 'none' : '';
  }
});
document.getElementById('app').addEventListener('focusout', async function(e){
  if(e.target.dataset && e.target.dataset.guideField){
    const dd = destDataCache[state.destId];
    dd.guide[e.target.dataset.guideField] = e.target.value;
    await saveDestData(state.destId);
  }
  if(e.target.dataset && e.target.dataset.photoCaption){
    const pid = e.target.dataset.photoCaption;
    if(photoCache[pid]){
      photoCache[pid].caption = e.target.value;
      await sSet('photo:'+pid, photoCache[pid]);
    }
  }
  if(e.target.id==='lightbox-day-assign'){
    const trip = trips.find(t=>t.id===state.tripId);
    if(trip){
      if(!trip.photoDayAssignments) trip.photoDayAssignments = {};
      const val = e.target.value;
      if(val==='') delete trip.photoDayAssignments[state.lightboxPhotoId];
      else trip.photoDayAssignments[state.lightboxPhotoId] = parseInt(val,10);
      await saveTrips();
    }
  }
});

setInterval(()=>{
  if(state.view==='home'){
    const mood = Math.random()<0.65 ? 'wave' : 'thinking';
    triggerMascotAnim(mood, mood==='thinking'?2600:1500);
  }
}, 20000);
init();
</script>
</body>
</html>
