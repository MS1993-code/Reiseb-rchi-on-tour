<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reisebärchi">
<meta name="theme-color" content="#3E5142">
<link rel="manifest" id="app-manifest">
<link rel="apple-touch-icon" id="app-touch-icon">
<link rel="icon" id="app-favicon">
<title>Reisebärchi on Tour</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<style>
  :root{
    --bg:#F7F1E3;
    --surface:#FBF7EE;
    --surface-alt:#EDE3CC;
    --ink:#332C22;
    --ink-muted:#7A7060;
    --navy:#3E5142;
    --teal:#74886A;
    --brass:#C99A3E;
    --green:#6B8F6E;
    --brick:#B5544A;
    --border:rgba(51,44,34,0.14);
    --on-navy:#F5F0E3;
    --radius:16px;
    --shadow:0 4px 14px rgba(51,44,34,0.14);
    color-scheme: light;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:#E4D6B0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;}
  h1,h2,h3{margin:0;}
  p{margin:0;}
  button{font-family:inherit;}
  :focus-visible{outline:2px solid var(--teal);outline-offset:2px;}
  @media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important;} }

  /* Home */
  .header-home{background:var(--navy);color:var(--on-navy);padding:26px 20px 22px;display:flex;align-items:center;gap:14px;}
  .logo-badge{width:50px;height:50px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:26px;border:2px solid var(--brass);flex:0 0 auto;overflow:hidden;cursor:pointer;}
  .logo-badge-sm{width:38px;height:38px;}
  .mascot-svg{width:100%;height:100%;transform-origin:50% 85%;animation:mascotWobble 3.2s ease-in-out infinite;}
  @keyframes mascotWobble{
    0%,100%{transform:rotate(0deg) translateY(0);}
    25%{transform:rotate(-4deg) translateY(-1px);}
    75%{transform:rotate(4deg) translateY(-1px);}
  }
  .mascot-svg.mood-wave{animation:mascotWaveHead 1.4s ease-in-out;}
  @keyframes mascotWaveHead{
    0%,100%{transform:rotate(0deg);}
    20%{transform:rotate(-6deg);} 40%{transform:rotate(5deg);}
    60%{transform:rotate(-5deg);} 80%{transform:rotate(4deg);}
  }
  .mascot-svg.mood-happy{animation:mascotHappyBounce 0.7s ease-in-out 2;}
  @keyframes mascotHappyBounce{
    0%,100%{transform:translateY(0) scale(1);}
    50%{transform:translateY(-10px) scale(1.06);}
  }
  .mascot-svg.mood-giggle{animation:mascotGiggle 0.5s ease-in-out 3;}
  @keyframes mascotGiggle{
    0%,100%{transform:rotate(0deg) translateX(0);}
    25%{transform:rotate(-6deg) translateX(-2px);}
    75%{transform:rotate(6deg) translateX(2px);}
  }
  .mascot-mouth{transform-origin:190px 214px;}
  .mascot-svg.mood-nom .mascot-mouth{animation:mascotNom 0.35s ease-in-out 4;}
  @keyframes mascotNom{
    0%,100%{transform:scaleY(1);}
    50%{transform:scaleY(0.55) translateY(2px);}
  }
  .mascot-eyes-happy, .mascot-eyes-squint{opacity:0;}
  .mascot-svg.mood-happy .mascot-eyes-normal{opacity:0;}
  .mascot-svg.mood-happy .mascot-eyes-happy{opacity:1;}
  .mascot-svg.mood-giggle .mascot-eyes-normal{opacity:0;}
  .mascot-svg.mood-giggle .mascot-eyes-squint{opacity:1;}
  .mascot-paw{opacity:0;transform-origin:308px 66px;}
  .mascot-svg.mood-wave .mascot-paw{animation:mascotPawSwing 1.4s ease-in-out;}
  @keyframes mascotPawSwing{
    0%{transform:rotate(0deg);opacity:0;}
    10%{opacity:1;} 20%{transform:rotate(-18deg);} 40%{transform:rotate(14deg);}
    60%{transform:rotate(-14deg);} 80%{transform:rotate(10deg);}
    95%{opacity:1;} 100%{transform:rotate(0deg);opacity:0;}
  }
  .logo-badge img{width:100%;height:100%;object-fit:cover;}
  .app-title{font-size:22px;font-weight:700;line-height:1.25;letter-spacing:-0.01em;}
  .countdown-card{margin:18px 16px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);overflow:hidden;transition:opacity 0.15s ease;}
  .countdown-card:active{opacity:0.88;}
  .countdown-image{height:150px;background-size:cover;background-position:center;}
  .countdown-image-fallback{display:flex;align-items:center;justify-content:center;font-size:42px;background:var(--surface-alt);}
  .countdown-info{padding:18px;}
  .countdown-place{font-size:19px;font-weight:700;margin-bottom:6px;letter-spacing:-0.01em;}
  .countdown-meta{display:flex;gap:14px;font-size:13px;color:var(--ink-muted);margin-bottom:8px;}
  .countdown-days{font-size:15px;font-weight:700;color:var(--brass);}
  .countdown-weather{font-size:13px;color:var(--ink-muted);margin-top:8px;}
  .countdown-empty{display:flex;align-items:center;gap:14px;padding:20px 18px;color:var(--ink-muted);font-size:14px;}
  .countdown-empty-icon{font-size:36px;}
  .home-actions{padding:0 16px;display:flex;flex-direction:column;gap:10px;margin-bottom:8px;}
  .btn-link-subtle{background:none;border:none;color:var(--ink-muted);font-size:13px;text-decoration:underline;cursor:pointer;padding:8px;display:block;margin:2px auto 4px;text-align:center;}
  .backup-group{display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap;margin-top:4px;}
  .backup-group-label{font-size:12px;color:var(--ink-muted);font-weight:600;width:100%;text-align:center;margin-bottom:-2px;}
  .btn-block{width:100%;padding:14px 16px;font-size:15px;}
  .trip-row{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;margin:0 16px 10px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);cursor:pointer;}
  .trip-row-title{font-weight:600;font-size:14px;}
  .trip-row-meta{font-size:12px;color:var(--ink-muted);margin-top:2px;}
  .dest-checkbox-row{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px;cursor:pointer;}
  .dest-checkbox-row input{width:18px;height:18px;flex:0 0 auto;}
  .dest-list{padding:18px 0 30px;}
  .dest-card{
    position:relative;display:flex;align-items:center;gap:14px;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:16px;margin:0 16px 12px;
    box-shadow:var(--shadow);cursor:pointer;transition:opacity 0.15s ease;
  }
  .dest-card:active{opacity:0.85;}
  .dest-flag{font-size:28px;flex:0 0 auto;}
  .dest-name{font-size:17px;font-weight:700;letter-spacing:-0.01em;}
  .dest-meta{font-size:13px;color:var(--ink-muted);margin-top:2px;}
  .dest-countdown{font-size:12px;color:var(--brass);font-weight:700;margin-top:5px;}
  .dest-delete{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--ink-muted);font-size:14px;cursor:pointer;padding:5px;line-height:1;}
  .dest-card-add{border-style:dashed;box-shadow:none;color:var(--ink-muted);}
  .dest-card-add .dest-name{color:var(--ink-muted);font-weight:600;font-size:15px;}

  /* Destination view */
  .dest-header{background:var(--navy);color:var(--on-navy);padding:18px 20px 16px;}
  .dest-header-top{font-size:13px;color:rgba(245,240,227,0.7);margin-bottom:9px;cursor:pointer;}
  .dest-header-title{font-size:21px;font-weight:700;letter-spacing:-0.01em;}
  .dest-header-coords{font-size:12px;color:rgba(245,240,227,0.55);margin-top:2px;}
  .countdown-banner{display:flex;align-items:center;justify-content:space-between;background:var(--surface-alt);padding:12px 20px;font-size:13px;gap:10px;flex-wrap:wrap;}
  .draft-banner{display:flex;align-items:center;justify-content:space-between;background:var(--surface-alt);padding:12px 20px;font-size:13px;gap:10px;flex-wrap:wrap;border-bottom:2px dashed var(--brass);}
  .countdown-banner input[type=date]{border:1px solid var(--border);border-radius:8px;padding:5px 8px;font-size:13px;background:var(--surface);color:var(--ink);font-family:inherit;}

  .tabbar{display:flex;overflow-x:auto;gap:2px;padding:0 10px;background:var(--navy);position:sticky;top:0;z-index:20;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .tabbar::-webkit-scrollbar{display:none;}
  .tab{flex:0 0 auto;padding:12px 11px;font-size:13px;color:rgba(245,240,227,0.6);border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer;}
  .tab.active{color:var(--on-navy);border-bottom-color:var(--brass);font-weight:700;}

  .panel{padding:18px 16px 60px;}
  .section-title{font-size:16px;font-weight:700;margin:0 0 12px;letter-spacing:-0.01em;}
  .field-group{margin-bottom:16px;}
  .field-label{display:block;font-size:13px;color:var(--ink-muted);margin-bottom:6px;font-weight:600;}
  .hint-text{font-size:12px;color:var(--ink-muted);margin:10px 0 16px;}
  .empty-state{font-size:14px;color:var(--ink-muted);padding:14px 0;}

  .input,.textarea,select.input{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:12px;font-family:inherit;font-size:14px;background:var(--surface-alt);color:var(--ink);}
  .textarea{min-height:90px;resize:vertical;}

  .btn{font-size:14px;font-weight:600;padding:10px 18px;border-radius:22px;border:1px solid var(--border);background:var(--surface);color:var(--ink);cursor:pointer;transition:all 0.15s ease;box-shadow:0 2px 5px rgba(51,44,34,0.10);}
  .btn:active{opacity:0.85;box-shadow:0 1px 2px rgba(51,44,34,0.10);transform:translateY(1px);}
  .btn-primary{background:var(--teal);color:#fff;border-color:var(--teal);box-shadow:0 3px 8px rgba(116,136,106,0.35);}
  .btn-add{background:var(--brass);color:var(--navy);border-color:var(--brass);box-shadow:0 3px 8px rgba(201,154,62,0.3);}
  .btn-danger{background:transparent;color:var(--brick);border-color:transparent;padding:6px 10px;font-size:13px;box-shadow:none;}
  .btn-home{
    width:100%;display:flex;align-items:center;gap:12px;text-align:left;
    padding:15px 18px;font-size:15px;font-weight:600;font-family:inherit;
    border-radius:var(--radius);border:1px solid var(--border);
    background:var(--surface);color:var(--ink);cursor:pointer;
    box-shadow:var(--shadow);transition:all 0.15s ease;
  }
  .btn-home:active{opacity:0.85;box-shadow:0 2px 6px rgba(51,44,34,0.12);transform:translateY(1px);}

  .inline-form{background:var(--surface-alt);border-radius:var(--radius);padding:16px;margin:10px 0;}
  .form-actions{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap;}

  .list-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);}
  .list-item-text{flex:1;font-size:14px;}
  .list-item.checked .list-item-text{text-decoration:line-through;color:var(--ink-muted);}
  .checkbox{width:20px;height:20px;border:2px solid var(--teal);border-radius:6px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;cursor:pointer;font-size:13px;color:#fff;}
  .checkbox.checked{background:var(--teal);}

  .map-container{height:300px;width:100%;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);background:var(--surface-alt);}
  .poi-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);gap:10px;}
  .poi-name{font-weight:600;font-size:14px;}
  .poi-region{font-size:11px;color:var(--brass);font-weight:700;margin-top:2px;}
  .poi-geheimtipp-toggle{opacity:0.28;cursor:pointer;margin-right:2px;font-size:13px;}
  .poi-geheimtipp-toggle.active{opacity:1;}
  .poi-desc{font-size:12px;color:var(--ink-muted);margin-top:2px;}

  .weather-loading{font-size:14px;color:var(--ink-muted);padding:20px 0;}
  .weather-now{display:flex;align-items:center;gap:14px;padding:6px 0 16px;}
  .wn-emoji{font-size:44px;}
  .wn-temp{font-size:28px;font-weight:700;letter-spacing:-0.01em;}
  .wn-label{font-size:14px;color:var(--ink-muted);}
  .wn-meta{display:flex;gap:14px;font-size:12px;color:var(--ink-muted);margin-top:4px;}
  .weather-forecast{display:flex;justify-content:space-between;border-top:1px solid var(--border);padding-top:14px;}
  .weather-day{text-align:center;font-size:12px;}
  .wd-day{color:var(--ink-muted);margin-bottom:4px;}
  .wd-emoji{font-size:20px;margin-bottom:4px;}

  .diary-entry{border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;background:var(--surface);}
  .diary-date{font-size:12px;color:var(--brass);font-weight:700;margin-bottom:6px;}
  .diary-text{font-size:14px;line-height:1.5;white-space:pre-wrap;margin-bottom:8px;}

  .photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
  .photo-thumb{aspect-ratio:1;border-radius:10px;background-size:cover;background-position:center;cursor:pointer;border:1px solid var(--border);}
  .lightbox-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);display:flex;align-items:center;justify-content:center;padding:20px;z-index:1000;}
  .lightbox-content{background:var(--surface);border-radius:var(--radius);padding:16px;max-width:420px;width:100%;max-height:88vh;overflow-y:auto;}
  .lightbox-img{width:100%;border-radius:10px;display:block;}

  .converter{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;align-items:center;}
  .converter .input{flex:1;min-width:76px;}
  .conv-arrow{color:var(--ink-muted);}
  .conv-result{margin-top:10px;font-size:15px;font-weight:700;color:var(--teal);min-height:20px;}
  .budget-totals{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .budget-grand-total{display:flex;align-items:center;gap:8px;background:var(--surface-alt);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:13px;flex-wrap:wrap;}
  .budget-grand-total select{max-width:90px;}
  #budget-grand-total-value{margin-left:auto;font-weight:700;color:var(--brass);}
  .budget-total-row{background:var(--surface-alt);padding:8px 14px;border-radius:10px;font-size:13px;display:flex;gap:8px;font-weight:600;}
  .budget-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);}
  .budget-row.paid .budget-cat{text-decoration:line-through;color:var(--ink-muted);}
  .budget-cat{font-weight:600;font-size:14px;}
  .budget-amount{font-size:13px;color:var(--ink-muted);margin-top:2px;}

  .doc-row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--border);}
  .doc-label{font-size:12px;color:var(--ink-muted);}
  .doc-value{font-size:15px;font-weight:600;}
  .doc-tel{color:var(--teal);text-decoration:none;}

  .duration-stats{display:flex;gap:12px;margin:10px 0 4px;}
  .duration-stat{flex:1;background:var(--surface-alt);border-radius:var(--radius);padding:14px;text-align:center;}
  .duration-stat-num{font-size:22px;font-weight:700;color:var(--brass);}
  .duration-stat-label{font-size:11px;color:var(--ink-muted);margin-top:2px;}

  .ticket-card{display:flex;background:var(--navy);color:var(--on-navy);border-radius:var(--radius);border:1px solid rgba(201,154,62,0.3);overflow:hidden;margin-bottom:12px;position:relative;}
  .ticket-main{flex:1;padding:14px 16px;}
  .ticket-route{font-size:16px;font-weight:700;letter-spacing:-0.01em;}
  .ticket-sub{font-size:12px;color:rgba(245,240,227,0.68);margin-top:3px;}
  .ticket-times{display:flex;gap:10px;font-size:12px;color:rgba(245,240,227,0.68);margin-top:3px;}
  .ticket-stub{width:74px;border-left:2px dashed rgba(245,240,227,0.3);padding:12px 8px;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center;word-break:break-word;color:var(--brass);}
  .ticket-delete{position:absolute;top:6px;right:6px;background:none;border:none;color:rgba(245,240,227,0.65);font-size:13px;cursor:pointer;padding:4px;}

  .diary-place{font-size:12px;color:var(--ink-muted);font-weight:600;margin-bottom:6px;}
  .route-meta{display:flex;gap:14px;font-size:12px;color:var(--ink-muted);margin-bottom:8px;flex-wrap:wrap;}

  .guide-picker-row{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
  .distance-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;flex-wrap:wrap;}
  .distance-arrow{color:var(--ink-muted);}
  .distance-value{margin-left:auto;font-weight:700;color:var(--brass);}
  .day-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
  .day-card-title{font-weight:700;font-size:14px;color:var(--brass);margin-bottom:12px;}
  .day-import-line{border-bottom:1px solid var(--border);padding:10px 0;}
  .day-import-text{font-size:13px;margin-bottom:8px;}
  .guide-picker-row select{flex:1;}
  .btn-jump{white-space:nowrap;flex:0 0 auto;padding:9px 14px;}
  .ticket-photo-link{font-size:11px;color:rgba(245,240,227,0.8);text-decoration:underline;margin-top:8px;cursor:pointer;}
  .csv-upload-row{margin:14px 0 4px;}
  .map-tools-row{display:flex;align-items:center;gap:10px;margin:12px 0 10px;flex-wrap:wrap;}
  .route-info-banner{display:flex;justify-content:space-between;align-items:center;background:var(--surface-alt);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:13px;gap:10px;flex-wrap:wrap;}
  .route-info-banner>span{display:flex;gap:12px;}
  .poi-search-row{display:flex;gap:8px;margin-bottom:10px;}
  .poi-search-row .input{flex:1;}
  .poi-search-result{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
  .poi-search-name{font-size:13px;flex:1;}
  .bucket-group{margin-bottom:22px;}
  .bucket-group-title{font-weight:700;font-size:13px;color:var(--ink-muted);margin-bottom:6px;}

  .imported-guide-meta{font-size:12px;color:var(--ink-muted);background:var(--surface-alt);border-radius:10px;padding:10px 12px;margin-bottom:14px;}
  .imported-guide-text{font-size:14px;line-height:1.6;white-space:pre-wrap;color:var(--ink);}

  .continent-group{margin-bottom:6px;}
  .continent-header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer;background:var(--surface-alt);margin:0 16px 10px;border-radius:12px;}
  .continent-caret{color:var(--ink-muted);font-size:13px;}
  .continent-items{margin-bottom:6px;}

  .dest-card-confirm{flex-direction:column;align-items:stretch;gap:10px;padding:16px;}
  .confirm-message{font-size:14px;color:var(--ink);}
  .confirm-inline-block{background:var(--surface-alt);border-radius:var(--radius);padding:16px;margin-top:14px;}
  .trip-row-confirm{flex-direction:column;align-items:stretch;gap:10px;}

  .app-toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--surface);color:var(--ink);padding:12px 20px;border-radius:22px;font-size:14px;max-width:88%;text-align:center;opacity:0;pointer-events:none;transition:opacity 0.25s,transform 0.25s;z-index:2000;box-shadow:var(--shadow);border:1px solid var(--border);}
  .app-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .recipe-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin:0 16px 12px;overflow:hidden;}
  .recipe-card-header{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;}
  .recipe-flag{font-size:26px;flex:0 0 auto;}
  .recipe-name{font-size:16px;font-weight:700;letter-spacing:-0.01em;}
  .recipe-subname{font-size:12px;color:var(--ink-muted);margin-top:2px;}
  .recipe-dest-tag{font-size:11px;color:var(--brass);font-weight:700;margin-top:4px;}
  .recipe-details{padding:0 16px 16px;border-top:1px solid var(--border);}
  .recipe-meta{display:flex;gap:14px;font-size:13px;color:var(--ink-muted);margin:12px 0;}
  .recipe-section-title{font-size:14px;font-weight:700;margin:14px 0 8px;}
  .recipe-list{margin:0 0 6px;padding-left:20px;font-size:14px;line-height:1.6;}
  .recipe-list li{margin-bottom:4px;}
  .recipe-photo{height:180px;border-radius:var(--radius);background-size:cover;background-position:center;cursor:pointer;border:1px solid var(--border);}

/* ---------- Storage helpers (IndexedDB, geräteeigen) ---------- */
const IDB_NAME = 'reisebaerchi-db';
const IDB_STORE = 'kv';
let idbPromise = null;
function openIdb(){
  if(idbPromise) return idbPromise;
  idbPromise = new Promise((resolve, reject)=>{
    if(!('indexedDB' in window)){ reject(new Error('IndexedDB nicht verfügbar')); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
  return idbPromise;
}
async function sGet(key, fallback){
  try{
    const db = await openIdb();
    return await new Promise((resolve)=>{
      const tx = db.transaction(IDB_STORE,'readonly');
      const req = tx.objectStore(IDB_STORE).get(key);
      req.onsuccess = ()=>resolve(req.result!==undefined ? req.result : fallback);
      req.onerror = ()=>resolve(fallback);
    });
  }catch(e){ return fallback; }
}
async function sSet(key, value){
  try{
    const db = await openIdb();
    await new Promise((resolve,reject)=>{
      const tx = db.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).put(value, key);
      tx.oncomplete = ()=>resolve();
      tx.onerror = ()=>reject(tx.error);
    });
  }catch(e){ console.error('Speichern fehlgeschlagen:', key, e); }
}
async function sDelete(key){
  try{
    const db = await openIdb();
    await new Promise((resolve,reject)=>{
      const tx = db.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).delete(key);
      tx.oncomplete = ()=>resolve();
      tx.onerror = ()=>reject(tx.error);
    });
  }catch(e){}
}

function genId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function showToast(message){
  let toastEl = document.getElementById('app-toast');
  if(!toastEl){
    toastEl = document.createElement('div');
    toastEl.id = 'app-toast';
    toastEl.className = 'app-toast';
    document.body.appendChild(toastEl);
  }
  toastEl.textContent = message;
  toastEl.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(()=>{ toastEl.classList.remove('show'); }, 3000);
}
function escapeHtml(str){
  if(str==null) return '';
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function daysUntil(dateStr){
  if(!dateStr) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(dateStr+'T00:00:00');
  return Math.round((target-today)/86400000);
}
function formatDateDe(dateStr){
  const d = new Date(dateStr+'T00:00:00');

async function loadQuickWeather(dest){
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${dest.lat}&longitude=${dest.lng}&current=temperature_2m,weather_code&timezone=auto`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('fail');
    const data = await res.json();
    const [emoji] = weatherInfo(data.current.weather_code);
    return {temp: Math.round(data.current.temperature_2m), emoji};
  }catch(e){
    return null;
  }
}

/* ---------- Data loading ---------- */
async function loadDestData(id){
  if(destDataCache[id]) return destDataCache[id];
  const fallback = {guide:{...EMPTY_GUIDE}, pois:[], routes:[], hikingRoutes:[], packing:[], todos:[], diary:[], photoIds:[], budget:[], docs:[], emergency:[], bucketlist:[], faq:[], phrases:[]};
  const data = await sGet('dest-data:'+id, fallback);
  if(!data.bucketlist) data.bucketlist = [];
  if(!data.routes) data.routes = [];
  if(!data.hikingRoutes) data.hikingRoutes = [];
  if(!data.faq) data.faq = [];
  if(!data.phrases) data.phrases = [];
  if(data.pois) data.pois.forEach(p=>{ if(p.region===undefined) p.region = ''; if(p.geheimtipp===undefined) p.geheimtipp=false; });
  data.guide = Object.assign({}, EMPTY_GUIDE, data.guide||{});
  destDataCache[id] = data;
  return data;
}
async function saveDestData(id){ await sSet('dest-data:'+id, destDataCache[id]); }
async function saveTrips(){
  if(state.isDraftTrip) return;
  await sSet('trips', trips);
}
function getListContainer(){
  return state.view==='trip' ? trips.find(t=>t.id===state.tripId) : destDataCache[state.destId];
}
async function saveListContainer(){
  if(state.view==='trip'){ await saveTrips(); }
  else { await saveDestData(state.destId); }
}
async function ensurePhotosLoaded(photoIds){
  for(const id of photoIds){
    if(!photoCache[id]){
      const p = await sGet('photo:'+id, null);
      if(p) photoCache[id] = p;
    }
  }
}
function getCurrentDest(){ return destinations.find(d=>d.id===state.destId); }

async function init(){
  let loaded = await sGet('destinations', null);
  if(!loaded){
    loaded = SEED_DESTINATIONS;
    await sSet('destinations', loaded);
    for(const d of loaded){ await sSet('dest-data:'+d.id, SEED_DEST_DATA[d.id]); }
  }
  destinations = loaded;
  let destChanged = false;
  destinations.forEach(d=>{
    if(!d.continent){ d.continent = 'Rest der Welt'; destChanged = true; }
    if('tripDate' in d){ delete d.tripDate; destChanged = true; }
    if(d.id==='kanaren' && d.continent!=='Europa'){ d.continent = 'Europa'; destChanged = true; }
  });
  trips = await sGet('trips', []);
  trips.forEach(t=>{
    if(!t.destIds) t.destIds = [];
    if(!t.documents) t.documents = [];
    if(!t.tickets) t.tickets = [];
    if(!t.activityTickets) t.activityTickets = [];
    if(!t.diary) t.diary = [];
    if(!t.photoIds) t.photoIds = [];
    if(!t.dayPlan) t.dayPlan = [];
    if(!t.budget) t.budget = [];
  });

  const migrationDone = await sGet('migration-v2', false);
  if(!migrationDone){
    const existingIds = new Set(destinations.map(d=>d.id));
    for(const d of SEED_DESTINATIONS){
      if(!existingIds.has(d.id)){
        destinations.push(d);
        await sSet('dest-data:'+d.id, SEED_DEST_DATA[d.id]);
        destChanged = true;
      }
    }
    const hasCruiseTrip = trips.some(t=> t.destIds.includes('madeira') && t.destIds.includes('kanaren'));
    if(!hasCruiseTrip){
      trips.push({id:genId(), dateFrom:'2027-01-16', dateTo:'2027-01-23', type:'Schiffsreise', companions:'', destIds:['madeira','kanaren'], documents:[], tickets:[], activityTickets:[], diary:[], photoIds:[], dayPlan:[], budget:[]});
      await saveTrips();
    }
    await sSet('migration-v2', true);
  }
  if(destChanged) await sSet('destinations', destinations);

  recipes = await sGet('recipes', []);
  const migrationV3Done = await sGet('migration-v3', false);
  if(!migrationV3Done){
    const hasDakos = recipes.some(r=>r.nameNative==='Dakos');
    if(!hasDakos){
      recipes.push({
        id:genId(), destId:'kreta', category:'Vegetarisch',
        nameNative:'Dakos', nameGerman:'Kretischer Gerstenzwieback-Salat',
        servings:'2 Personen', time:'10 Minuten, keine Kochzeit',
        ingredients:'2 kretische Gerstenzwiebäcke (Paximadia; ersatzweise trockenes, kräftiges Vollkornbrot)\n2 reife Tomaten\n100 g Feta oder Mizithra (ersatzweise Ricotta salata)\n4 EL natives Olivenöl extra\n1 TL getrockneter Oregano\nSalz, nach Geschmack\nein paar schwarze Oliven oder Kapern',
        steps:'Die Zwiebäcke leicht mit etwas Wasser oder Olivenöl beträufeln, bis sie gerade weich werden — sie sollen nicht durchweichen.\nTomaten grob reiben oder sehr fein würfeln, mit Salz und der Hälfte des Olivenöls vermengen.\nTomatenmasse auf die Zwiebäcke geben, den Käse darüber bröckeln.\nMit Oregano bestreuen, restliches Olivenöl darüber träufeln und sofort servieren. Optional noch mit Oliven und Kapern verfeinern.'
      });
      await sSet('recipes', recipes);
    }
    await sSet('migration-v3', true);
  }
  render();
}

function downloadJson(obj, filename){
  const json = JSON.stringify(obj, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
async function exportGuidesBackup(){
  showToast('Sammle Reiseführer & Rezepte…');
  try{
    const backup = {app:'Reisebärchi on Tour', kind:'guides', exportedAt:new Date().toISOString(), version:1,
      destinations:destinations, destData:{}, recipes:recipes, photos:{}};
    await Promise.all(destinations.map(async d=>{ backup.destData[d.id] = await loadDestData(d.id); }));
    const photoIds = new Set();
    recipes.forEach(r=>{ if(r.photoId) photoIds.add(r.photoId); });
    Object.values(backup.destData).forEach(dd=>{ (dd.photoIds||[]).forEach(id=>photoIds.add(id)); });
    await Promise.all([...photoIds].map(async pid=>{
      if(!photoCache[pid]){ const p = await sGet('photo:'+pid, null); if(p) photoCache[pid] = p; }
      if(photoCache[pid]) backup.photos[pid] = photoCache[pid];
    }));
    downloadJson(backup, `reisebaerchi-reisefuehrer-${todayStr()}.json`);
    showToast('Reiseführer & Rezepte-Backup heruntergeladen.');
  }catch(e){
    showToast('Backup konnte nicht erstellt werden.');
  }
}
async function exportTripsBackup(){
  showToast('Sammle deine Reisen…');
  try{
    const backup = {app:'Reisebärchi on Tour', kind:'trips', exportedAt:new Date().toISOString(), version:1,
      trips:trips, photos:{}};
    const photoIds = new Set();
    trips.forEach(t=>{
      (t.photoIds||[]).forEach(id=>photoIds.add(id));
      (t.tickets||[]).forEach(tk=>{ if(tk.photoId) photoIds.add(tk.photoId); });
      (t.activityTickets||[]).forEach(tk=>{ if(tk.photoId) photoIds.add(tk.photoId); });
    });
    await Promise.all([...photoIds].map(async pid=>{
      if(!photoCache[pid]){ const p = await sGet('photo:'+pid, null); if(p) photoCache[pid] = p; }
      if(photoCache[pid]) backup.photos[pid] = photoCache[pid];
    }));
    downloadJson(backup, `reisebaerchi-meine-reisen-${todayStr()}.json`);
    showToast('Reisen-Backup heruntergeladen.');
  }catch(e){
    showToast('Backup konnte nicht erstellt werden.');
  }
}
async function importGuidesBackup(file){
  showToast('Lese Reiseführer & Rezepte…');
  try{
    const text = await file.text();
    const backup = JSON.parse(text);
    if(!backup || !Array.isArray(backup.destinations) || !Array.isArray(backup.recipes)){
      showToast('Diese Datei sieht nicht wie ein Reiseführer-Backup aus.');
      return;
    }
    destinations = backup.destinations;
    recipes = backup.recipes;
    await sSet('destinations', destinations);
    await sSet('recipes', recipes);
    for(const [id, dd] of Object.entries(backup.destData || {})){
      destDataCache[id] = dd;
      await sSet('dest-data:'+id, dd);
    }
    for(const [id, p] of Object.entries(backup.photos || {})){
      photoCache[id] = p;

async function importTripsBackup(file){
  showToast('Lese Reisen…');
  try{
    const text = await file.text();
    const backup = JSON.parse(text);
    if(!backup || !Array.isArray(backup.trips)){
      showToast('Diese Datei sieht nicht wie ein Reisen-Backup aus.');
      return;
    }
    trips = backup.trips;
    await sSet('trips', trips);
    for(const [id, p] of Object.entries(backup.photos || {})){
      photoCache[id] = p;
      await sSet('photo:'+id, p);
    }
    state.view = 'home';
    showToast(`Eingelesen: ${trips.length} Reisen. Reiseführer & Rezepte bleiben unverändert.`);
    render();
  }catch(e){
    showToast('Datei konnte nicht gelesen werden (beschädigt oder falscher Typ?).');
  }
}

function tripTypeIcon(type){
  const map = {'Städtetrip':'🏙️','Rundreise':'🚗','Strandurlaub':'🏖️','Schiffsreise':'🚢'};
  return map[type] || '🧳';
}
function getNextTrip(){
  const today = new Date(); today.setHours(0,0,0,0);
  const upcoming = trips.filter(t=>t.dateFrom && new Date(t.dateFrom+'T00:00:00') >= today);
  upcoming.sort((a,b)=> a.dateFrom.localeCompare(b.dateFrom));
  return upcoming[0] || null;
}
function getNextTripForDest(destId){
  const today = new Date(); today.setHours(0,0,0,0);
  const upcoming = trips.filter(t=> t.destIds.includes(destId) && t.dateFrom && new Date(t.dateFrom+'T00:00:00') >= today);
  upcoming.sort((a,b)=> a.dateFrom.localeCompare(b.dateFrom));
  return upcoming[0] || null;
}
function isTripPast(t){
  const today = new Date(); today.setHours(0,0,0,0);
  const refDate = t.dateTo || t.dateFrom;
  if(!refDate) return false;
  return new Date(refDate+'T00:00:00') < today;
}
function getPastTrips(){
  return trips.filter(isTripPast).sort((a,b)=> (b.dateTo||b.dateFrom).localeCompare(a.dateTo||a.dateFrom));
}
function getOtherTrips(nextTrip){
  const rest = trips.filter(t=> (!nextTrip || t.id!==nextTrip.id) && !isTripPast(t));
  const withDate = rest.filter(t=>t.dateFrom).sort((a,b)=>a.dateFrom.localeCompare(b.dateFrom));
  const withoutDate = rest.filter(t=>!t.dateFrom);
  return [...withDate, ...withoutDate];
}
function calcDurationDays(dateFrom, dateTo){
  if(!dateFrom || !dateTo) return null;
  const a = new Date(dateFrom+'T00:00:00');
  const b = new Date(dateTo+'T00:00:00');
  const diff = Math.round((b-a)/86400000);
  return diff>=0 ? diff+1 : null;
}
function calcVacationDays(dateFrom, dateTo){
  if(!dateFrom || !dateTo) return null;
  const a = new Date(dateFrom+'T00:00:00');
  const b = new Date(dateTo+'T00:00:00');
  if(b<a) return null;
  let count=0;
  const cur = new Date(a);
  while(cur<=b){
    const day = cur.getDay();
    if(day!==0 && day!==6) count++;
    cur.setDate(cur.getDate()+1);
  }
  return count;
}
function formatDateRangeDe(dateFrom, dateTo){
  if(!dateFrom && !dateTo) return 'Datum offen';
  if(dateFrom && !dateTo) return formatDateDe(dateFrom);
  if(!dateFrom && dateTo) return formatDateDe(dateTo);
  return formatDateDe(dateFrom)+' – '+formatDateDe(dateTo);
}
function renderTripDurationInfo(trip){
  const days = calcDurationDays(trip.dateFrom, trip.dateTo);
  const vacation = calcVacationDays(trip.dateFrom, trip.dateTo);
  if(days===null) return '<p class="hint-text">Bitte Von- und Bis-Datum angeben.</p>';
  return `
    <div class="duration-stats">
      <div class="duration-stat"><div class="duration-stat-num">${days}</div><div class="duration-stat-label">Reisetage</div></div>
      <div class="duration-stat"><div class="duration-stat-num">${vacation}</div><div class="duration-stat-label">Urlaubstage (Mo–Fr)</div></div>
    </div>`;
}

  if(!trip || !trip.photoIds || !trip.photoIds.length) return null;

}

function parseRecipeText(text){
  const lines = text.split('\n').map(l=>l.trim()).filter(l=>l.length);
  let nameNative='', nameGerman='', servings='', time='';
  const ingredients=[], steps=[];
  let section = null;
  lines.forEach(line=>{
    const lower = line.toLowerCase();
    if(!nameNative && !section && !/^für\s+\d/i.test(line) && !lower.includes('zutaten') && !lower.includes('zubereitung')){
      const cleaned = line.replace(/^[^\p{L}\p{N}]+/u,'').trim();
      const parts = cleaned.split(/✦+/).map(p=>p.trim()).filter(Boolean);
      if(parts.length>=2){ nameNative=parts[0]; nameGerman=parts[1]; }
      else { nameNative = cleaned; }
      return;
    }
    if(!section && (/^für\s+\d/i.test(line) || lower.includes('minuten') || lower.includes('person'))){
      const parts = line.split(/·/);
      const m = parts[0].match(/für\s+(.+)/i);
      servings = m ? m[1].trim() : parts[0].trim();
      if(parts[1]) time = parts[1].trim();
      return;
    }
    if(lower.includes('zutaten')){
      section='ingredients';
      const rest = line.replace(/^.*?zutaten/i,'').trim();
      if(rest) ingredients.push(rest);
      return;
    }
    if(lower.includes('zubereitung')){
      section='steps';
      const rest = line.replace(/^.*?zubereitung/i,'').trim();
      if(rest) steps.push(rest.replace(/^\d+\.\s*/,''));
      return;
    }
    if(section==='ingredients') ingredients.push(line);
    else if(section==='steps') steps.push(line.replace(/^\d+\.\s*/,''));
  });
  return {nameNative, nameGerman, servings, time, ingredients: ingredients.join('\n'), steps: steps.join('\n')};
}

const DEST_KEYWORDS = {
  kapverde: ['Kap Verde','Kapverde','Cabo Verde','Sal','Praia','Santiago','Boa Vista','Mindelo'],
  azoren: ['Azoren','Azores','Ponta Delgada','São Miguel','Sao Miguel','Terceira','Pico','Faial'],

  norwegen: ['Norwegen','Norway','Oslo','Bergen','Norwegian'],

  island: ['Island','Iceland','Reykjavik','Reykjavík'],
  kanaren: ['Kanaren','Canary','Gran Canaria','Teneriffa','Tenerife','Lanzarote','Fuerteventura','Las Palmas'],
  sardinien: ['Sardinien','Sardinia','Cagliari','Alghero','Olbia'],
  kreta: ['Kreta','Crete','Heraklion','Chania']
};
const KNOWN_AIRLINES = ['Lufthansa','TAP Portugal','TAP Air','TAP','AIDA','Condor','Eurowings','Ryanair','easyJet','SAS','Norwegian Air','Icelandair','Swiss','Austrian Airlines','KLM','Air France','Vueling','Binter Canarias'];
async function extractPdfText(file){
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data:arrayBuffer}).promise;
  let text = '';
  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it=>it.str).join(' ') + '\n';
  }
  return text;
}
function parseBookingText(text){
  const result = {dateFrom:null, dateTo:null, matchedDestIds:[], ticket:null};
  const dateMatches = [];
  let m;
  const reDMY = /\b(\d{1,2})\.(\d{1,2})\.(\d{4})\b/g;
  while((m = reDMY.exec(text))){ dateMatches.push(`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`); }
  const reISO = /\b(\d{4})-(\d{2})-(\d{2})\b/g;
  while((m = reISO.exec(text))){ dateMatches.push(`${m[1]}-${m[2]}-${m[3]}`); }
  if(dateMatches.length){
    dateMatches.sort();
    result.dateFrom = dateMatches[0];
    result.dateTo = dateMatches[dateMatches.length-1];
  }
  Object.keys(DEST_KEYWORDS).forEach(id=>{
    if(DEST_KEYWORDS[id].some(kw=>text.toLowerCase().includes(kw.toLowerCase())) && destinations.find(d=>d.id===id)){
      result.matchedDestIds.push(id);
    }
  });
  result.matchedDestIds = result.matchedDestIds.slice(0,3);
  const flightMatch = text.match(/\b([A-Z]{2})\s?(\d{2,4})\b/);
  const airlineMatch = KNOWN_AIRLINES.find(a=>text.toLowerCase().includes(a.toLowerCase()));
  const codeMatch = text.match(/(?:Buchungscode|Booking\s*(?:reference|code)|PNR|Bestätigungsnummer|Confirmation(?:\s*number)?)[:\s]+([A-Z0-9]{5,8})/i);
  const timeMatches = [...text.matchAll(/\b([01]?\d|2[0-3]):([0-5]\d)\b/g)].map(mm=>mm[0]);
  if(flightMatch || airlineMatch || codeMatch){
    result.ticket = {
      id: genId(), airline: airlineMatch||'', flightNumber: flightMatch? flightMatch[1]+flightMatch[2] : '',
      date: result.dateFrom||'', from:'', to:'',
      departTime: timeMatches[0]||'', arriveTime: timeMatches[1]||'', bookingCode: codeMatch? codeMatch[1] : ''
    };
  }
  return result;
}
async function onBookingFileSelected(file){
  const trip = trips.find(t=>t.id===state.tripId);
  if(!trip){ showToast('Keine aktive Reise gefunden.'); return; }
  showToast('Lese Buchungsunterlagen…');
  try{
    const name = file.name.toLowerCase();
    let text = '';
    if(name.endsWith('.pdf')){
      if(typeof pdfjsLib==='undefined'){ showToast('PDF-Dienst nicht verfügbar (keine Internetverbindung).'); return; }
      text = await extractPdfText(file);
    } else {
      if(typeof mammoth==='undefined'){ showToast('Datei-Import-Dienst nicht verfügbar.'); return; }
      const arrayBuffer = await file.arrayBuffer();
      const res = await mammoth.extractRawText({arrayBuffer});
      text = res.value;
    }
    const parsed = parseBookingText(text);
    if(parsed.dateFrom && !trip.dateFrom) trip.dateFrom = parsed.dateFrom;
    if(parsed.dateTo && !trip.dateTo) trip.dateTo = parsed.dateTo;
    parsed.matchedDestIds.forEach(id=>{
      if(trip.destIds.length<3 && !trip.destIds.includes(id)) trip.destIds.push(id);
    });
    if(parsed.ticket) trip.tickets.push(parsed.ticket);
    await saveTrips();
    await ensureLinkedGuidesLoaded(trip);
    showToast(parsed.dateFrom || parsed.ticket ? 'Buchungsunterlagen eingelesen – bitte prüfen.' : 'Es wurde wenig erkannt – bitte manuell ergänzen.');
    render();
  }catch(e){
    showToast('Datei konnte nicht gelesen werden.');
  }
}

function haversineKm(lat1,lng1,lat2,lng2){
  const R = 6371;
  const dLat = (lat2-lat1)*Math.PI/180;
  const dLng = (lng2-lng1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return Math.round(R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}
function renderDestDistances(trip){
  const linked = trip.destIds.map(id=>destinations.find(d=>d.id===id)).filter(Boolean);
  if(linked.length<2) return '';
  let rows = '';
  for(let i=0;i<linked.length-1;i++){
    for(let j=i+1;j<linked.length;j++){
      const km = haversineKm(linked[i].lat,linked[i].lng,linked[j].lat,linked[j].lng);
      rows += `<div class="distance-row">
        <span>${linked[i].flag} ${escapeHtml(linked[i].name)}</span>
        <span class="distance-arrow">↔</span>
        <span>${linked[j].flag} ${escapeHtml(linked[j].name)}</span>
        <span class="distance-value">${km.toLocaleString('de-DE')} km</span>
      </div>`;
    }
  }
  return `<div class="field-group"><label class="field-label">Entfernung zwischen den Zielen</label>${rows}</div>`;
}

function syncDayPlan(trip){
  if(!trip.dayPlan) trip.dayPlan = [];
  const days = calcDurationDays(trip.dateFrom, trip.dateTo);
  if(!days) return;
  while(trip.dayPlan.length < days){ trip.dayPlan.push({id:genId(), ort:'', plan:''}); }
  if(trip.dayPlan.length > days){ trip.dayPlan = trip.dayPlan.slice(0, days); }
}

async function importWholeRoute(destId, routeId){
  const trip = trips.find(t=>t.id===state.tripId);
  const dd = destDataCache[destId];
  const route = dd.routes.find(r=>r.id===routeId);
  if(!route) return;
  const lines = route.text.split('\n').map(l=>l.trim()).filter(Boolean);
  syncDayPlan(trip);
  lines.forEach((line,i)=>{
    if(trip.dayPlan[i]){
      trip.dayPlan[i].plan = trip.dayPlan[i].plan ? trip.dayPlan[i].plan+'\n'+line : line;
      if(!trip.dayPlan[i].ort) trip.dayPlan[i].ort = route.title;
    }
  });
  await saveTrips();
  showToast('Route übernommen.');
  render();
}
async function importSingleLine(destId, routeId, lineIndex){
  const trip = trips.find(t=>t.id===state.tripId);
  const dd = destDataCache[destId];
  const route = dd.routes.find(r=>r.id===routeId);
  if(!route) return;
  const lines = route.text.split('\n').map(l=>l.trim()).filter(Boolean);
  const line = lines[lineIndex];
  if(line===undefined) return;
  const selectEl = document.querySelector(`.day-import-target[data-line-index="${lineIndex}"]`);
  const targetIdx = selectEl ? parseInt(selectEl.value,10) : 0;
  syncDayPlan(trip);
  if(trip.dayPlan[targetIdx]){
    trip.dayPlan[targetIdx].plan = trip.dayPlan[targetIdx].plan ? trip.dayPlan[targetIdx].plan+'\n'+line : line;
  }
  await saveTrips();
  showToast('Tag übernommen.');
  render();
}

function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = function(e){
      const img = new Image();
      img.onload = function(){
        const maxDim = 1024;
        let w=img.width, h=img.height;
        if(w>maxDim || h>maxDim){
          if(w>h){ h=Math.round(h*maxDim/w); w=maxDim; } else { w=Math.round(w*maxDim/h); h=maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.72));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function parseCsvLine(line){
  const result = [];
  let cur = '', inQuotes = false;
  for(let i=0;i<line.length;i++){
    const ch = line[i];
    if(inQuotes){
      if(ch==='"'){
        if(line[i+1]==='"'){ cur+='"'; i++; } else { inQuotes=false; }
      } else { cur+=ch; }
    } else {
      if(ch==='"'){ inQuotes=true; }
      else if(ch===','){ result.push(cur); cur=''; }
      else { cur+=ch; }
    }
  }
  result.push(cur);
  return result.map(s=>s.trim());
}
async function onPoiCsvSelected(file){
  try{
    const text = await file.text();
    const lines = text.split(/\r\n|\n|\r/).filter(l=>l.trim().length);
    if(!lines.length){ showToast('Die Datei enthält keine Zeilen.'); return; }
    const firstRow = parseCsvLine(lines[0]);
    const looksLikeHeader = firstRow.length<2 || isNaN(parseFloat(firstRow[1])) || isNaN(parseFloat(firstRow[2]));
    const startIdx = looksLikeHeader ? 1 : 0;
    const dd = destDataCache[state.destId];
    let added = 0, skipped = 0;
    for(let i=startIdx;i<lines.length;i++){
      const cols = parseCsvLine(lines[i]);
      if(cols.length<3){ skipped++; continue; }
      const name = cols[0];
      const lat = parseFloat(cols[1]);
      const lng = parseFloat(cols[2]);
      const region = cols[3] || '';
      const desc = cols[4] || '';
      const geheimtipp = cols[5] ? /^(ja|true|1|yes)$/i.test(cols[5].trim()) : false;
      if(!name || isNaN(lat) || isNaN(lng)){ skipped++; continue; }
      dd.pois.push({id:genId(), name, lat, lng, region, desc, geheimtipp});
      added++;
    }
    await saveDestData(state.destId);
    render();
    showToast(`${added} Orte hinzugefügt${skipped? ', '+skipped+' Zeile(n) übersprungen':''}.`);
  }catch(e){ showToast('CSV-Datei konnte nicht gelesen werden.'); }
}

      iconRetinaUrl:'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-icon-2x.png',

let hikingMapInstances = [];
function haversineKmSimple(lat1,lng1,lat2,lng2){ return haversineKm(lat1,lng1,lat2,lng2); }
function parseGpxPoints(xmlText){
  const doc = new DOMParser().parseFromString(xmlText, 'application/xml');
  let pts = [...doc.getElementsByTagName('trkpt')];
  if(!pts.length) pts = [...doc.getElementsByTagName('rtept')];
  return pts.map(pt=>{
    const lat = parseFloat(pt.getAttribute('lat'));
    const lng = parseFloat(pt.getAttribute('lon'));
    const eleEl = pt.getElementsByTagName('ele')[0];
    const ele = eleEl ? parseFloat(eleEl.textContent) : null;
    return {lat, lng, ele};
  }).filter(p=>!isNaN(p.lat) && !isNaN(p.lng));
}
function calcTrackDistanceKm(points){
  let total = 0;
  for(let i=1;i<points.length;i++){ total += haversineKmSimple(points[i-1].lat,points[i-1].lng,points[i].lat,points[i].lng); }
  return Math.round(total*10)/10;
}
function calcElevationGain(points){
  let gain = 0;
  for(let i=1;i<points.length;i++){
    if(points[i].ele!=null && points[i-1].ele!=null){
      const diff = points[i].ele - points[i-1].ele;
      if(diff>0) gain += diff;
    }
  }
  return Math.round(gain);
}

  showToast('Lese GPX-Datei…');

    const text = await file.text();
    const points = parseGpxPoints(text);
    if(!points.length){ showToast('Keine Track-Punkte in der Datei gefunden.'); return; }
    const distanceKm = calcTrackDistanceKm(points);
    const elevationGain = calcElevationGain(points);
    const gpxTrack = points.map(p=>[p.lat,p.lng]);
    const dd = destDataCache[state.destId];
    const title = file.name.replace(/\.gpx$/i,'');
    dd.hikingRoutes.push({id:genId(), title, distanceKm:String(distanceKm), durationText:'', difficulty:'', description:'', gpxTrack, elevationGain});
    await saveDestData(state.destId);
    showToast(`Route importiert: ${distanceKm} km${elevationGain?', ca. '+elevationGain+' Hm Anstieg':''}.`);
    render();
  }catch(e){
    showToast('GPX-Datei konnte nicht gelesen werden.');
  }
}

async function loadWeather(dest){
  const el = document.getElementById('weather-content');
  if(!el) return;
  try{
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${dest.lat}&longitude=${dest.lng}&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=5`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('bad response');
    const data = await res.json();
    const cur = data.current;
    const [curEmoji,curLabel] = weatherInfo(cur.weather_code);
    let daysHtml = '';
    for(let i=0;i<data.daily.time.length;i++){
      const [emoji] = weatherInfo(data.daily.weather_code[i]);
      const dow = new Date(data.daily.time[i]+'T12:00:00').toLocaleDateString('de-DE',{weekday:'short'});
      daysHtml += `<div class="weather-day">
        <div class="wd-day">${dow}</div>
        <div class="wd-emoji">${emoji}</div>
        <div>${Math.round(data.daily.temperature_2m_max[i])}° / ${Math.round(data.daily.temperature_2m_min[i])}°</div>
      </div>`;
    }
    el.innerHTML = `
      <div class="weather-now">
        <div class="wn-emoji">${curEmoji}</div>
        <div>
          <div class="wn-temp">${Math.round(cur.temperature_2m)}°C</div>
          <div class="wn-label">${curLabel}</div>
          <div class="wn-meta"><span>Wind ${Math.round(cur.wind_speed_10m)} km/h</span><span>Feuchte ${cur.relative_humidity_2m}%</span></div>
        </div>
      </div>
      <div class="weather-forecast">${daysHtml}</div>
    `;
  }catch(err){
    el.innerHTML = `<p class="empty-state">Wetterdaten konnten nicht geladen werden. Prüfe deine Internetverbindung.</p>`;
  }
}

async function computeBudgetGrandTotal(trip){
  const el = document.getElementById('budget-grand-total-value');
  if(!el) return;
  const targetSel = document.getElementById('budget-total-currency');
  const target = targetSel ? targetSel.value : 'EUR';
  const CVE_PER_EUR = 110.265;
  el.textContent = 'Rechne…';
  try{
    const totals = {};
    trip.budget.forEach(b=>{ totals[b.currency]=(totals[b.currency]||0)+Number(b.amount); });
    let grandTotalEur = 0;
    for(const [cur,sum] of Object.entries(totals)){
      if(cur==='EUR') grandTotalEur += sum;
      else if(cur==='CVE') grandTotalEur += sum/CVE_PER_EUR;
      else { const rate = await fetchRate(cur,'EUR'); grandTotalEur += sum*rate; }
    }
    let result = grandTotalEur;
    if(target==='CVE') result = grandTotalEur*CVE_PER_EUR;
    else if(target!=='EUR'){ const rate2 = await fetchRate('EUR', target); result = grandTotalEur*rate2; }
    el.textContent = `${result.toFixed(2)} ${target}`;
  }catch(e){
    el.textContent = 'nicht verfügbar';
  }
}
async function fetchRate(base, symbol){
  const r = await fetch(`https://api.frankfurter.app/latest?base=${base}&symbols=${symbol}`);
  if(!r.ok) throw new Error('rate fetch failed');
  const j = await r.json();
  return j.rates[symbol];
}
async function doConvertCurrency(){
  const amount = parseFloat(document.getElementById('conv-amount').value);
  const from = document.getElementById('conv-from').value;
  const to = document.getElementById('conv-to').value;
  const resultEl = document.getElementById('conv-result');
  if(isNaN(amount)){ resultEl.textContent='Bitte einen Betrag eingeben.'; return; }
  if(from===to){ resultEl.textContent = `${amount.toFixed(2)} ${from} = ${amount.toFixed(2)} ${to}`; return; }
  resultEl.textContent = 'Rechne um…';
  const CVE_PER_EUR = 110.265;
  try{
    let eurAmount;
    if(from==='CVE') eurAmount = amount/CVE_PER_EUR;
    else if(from==='EUR') eurAmount = amount;
    else { const rate = await fetchRate(from,'EUR'); eurAmount = amount*rate; }

    let result;
    if(to==='CVE') result = eurAmount*CVE_PER_EUR;
    else if(to==='EUR') result = eurAmount;
    else { const rate2 = await fetchRate('EUR',to); result = eurAmount*rate2; }

    resultEl.textContent = `${amount.toFixed(2)} ${from} = ${result.toFixed(2)} ${to}`;
  }catch(err){
    resultEl.textContent = 'Umrechnung nicht verfügbar (keine Verbindung zum Kursdienst).';
  }
}

    if(file) await onBookingFileSelected(file);
    e.target.value='';
  }
  if(e.target.id==='poi-csv-input'){
    const file = e.target.files[0];
    if(file) await onPoiCsvSelected(file);
    e.target.value='';
  }
  if(e.target.id==='gpx-file-input'){
    const file = e.target.files[0];
    if(file) await onGpxFileSelected(file);
    e.target.value='';
  }
  if(e.target.id==='guides-import-input'){
    const file = e.target.files[0];
    if(file) await importGuidesBackup(file);
    e.target.value='';
  }
  if(e.target.id==='trips-import-input'){
    const file = e.target.files[0];
    if(file) await importTripsBackup(file);
    e.target.value='';
  }
  if(e.target.id==='guide-file-input'){
    const file = e.target.files[0];
    if(file) await onGuideFileSelected(file);
    e.target.value='';
  }
  if(e.target.classList && e.target.classList.contains('trip-guide-select')){
    const slot = parseInt(e.target.dataset.slot,10);
    const newId = e.target.value;
    const trip = trips.find(t=>t.id===state.tripId);
    if(trip){
      if(newId){
        trip.destIds[slot] = newId;
        trip.destIds = trip.destIds.filter((id,idx)=> trip.destIds.indexOf(id)===idx);
        await loadDestData(newId);
      } else {
        trip.destIds = trip.destIds.slice(0, slot);
      }
      await saveTrips();
      render();
    }
  }
  if(e.target.dataset && e.target.dataset.tripField){
    const trip = trips.find(t=>t.id===state.tripId);
    if(trip){
      trip[e.target.dataset.tripField] = e.target.value;
      await saveTrips();
      if(e.target.dataset.tripField==='dateFrom' || e.target.dataset.tripField==='dateTo'){
        const el = document.getElementById('trip-duration-display');
        if(el) el.innerHTML = renderTripDurationInfo(trip);
      }
    }
  }
  if(e.target.dataset && e.target.dataset.dayField){
    const trip = trips.find(t=>t.id===state.tripId);
    const day = trip && trip.dayPlan.find(d=>d.id===e.target.dataset.dayId);
    if(day){
      day[e.target.dataset.dayField] = e.target.value;
      await saveTrips();
    }
  }
  if(e.target.id==='day-import-dest'){
    state.dayImportDestId = e.target.value; state.dayImportRouteId = null; render();
  }
  if(e.target.id==='day-import-route'){
    state.dayImportRouteId = e.target.value; render();
  }
  if(e.target.id==='budget-total-currency'){
    await computeBudgetGrandTotal(trips.find(t=>t.id===state.tripId));
  }
  if(e.target.dataset && e.target.dataset.recipeField){
    const recipe = recipes.find(r=>r.id===e.target.dataset.recipeId);
    if(recipe){
      recipe[e.target.dataset.recipeField] = e.target.value;
      await sSet('recipes', recipes);
    }
  }
});

document.getElementById('app').addEventListener('focusout', async function(e){
  if(e.target.dataset && e.target.dataset.guideField){
    const dd = destDataCache[state.destId];
    dd.guide[e.target.dataset.guideField] = e.target.value;
    await saveDestData(state.destId);
  }
  if(e.target.dataset && e.target.dataset.photoCaption){
    const pid = e.target.dataset.photoCaption;
    if(photoCache[pid]){
      photoCache[pid].caption = e.target.value;
      await sSet('photo:'+pid, photoCache[pid]);
    }
  }
});

setInterval(()=>{
  if(state.view==='home'){ triggerMascotAnim('wave', 1500); }
}, 20000);
init();
</script>
</body>
</html>
