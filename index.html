/* ---------- Storage helpers (IndexedDB, geräteeigen) ---------- */
const IDB_NAME = 'reisebaerchi-db';
const IDB_STORE = 'kv';
let idbPromise = null;
function openIdb(){
  if(idbPromise) return idbPromise;
  idbPromise = new Promise((resolve, reject)=>{
    if(!('indexedDB' in window)){ reject(new Error('IndexedDB nicht verfügbar')); return; }
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
  return idbPromise;
}
async function sGet(key, fallback){
  try{
    const db = await openIdb();
    return await new Promise((resolve)=>{
      const tx = db.transaction(IDB_STORE,'readonly');
      const req = tx.objectStore(IDB_STORE).get(key);
      req.onsuccess = ()=>resolve(req.result!==undefined ? req.result : fallback);
      req.onerror = ()=>resolve(fallback);
    });
  }catch(e){ return fallback; }
}
async function sSet(key, value){
  try{
    const db = await openIdb();
    await new Promise((resolve,reject)=>{
      const tx = db.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).put(value, key);
      tx.oncomplete = ()=>resolve();
      tx.onerror = ()=>reject(tx.error);
    });
  }catch(e){ console.error('Speichern fehlgeschlagen:', key, e); }
}
async function sDelete(key){
  try{
    const db = await openIdb();
    await new Promise((resolve,reject)=>{
      const tx = db.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).delete(key);
      tx.oncomplete = ()=>resolve();
      tx.onerror = ()=>reject(tx.error);
    });
  }catch(e){}
}

/* ---------- Utilities ---------- */
function genId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function pushIfNew(arr, item, keyFn){
  const key = keyFn(item);
  if(!key) { arr.push(item); return true; }
  const exists = arr.some(x=>keyFn(x)===key);
  if(!exists){ arr.push(item); return true; }
  return false;
}
function showToast(message){
  let toastEl = document.getElementById('app-toast');
  if(!toastEl){
    toastEl = document.createElement('div');
    toastEl.id = 'app-toast';
    toastEl.className = 'app-toast';
    document.body.appendChild(toastEl);
  }
  toastEl.textContent = message;
  toastEl.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(()=>{ toastEl.classList.remove('show'); }, 3000);
}
function escapeHtml(str){
  if(str==null) return '';
  return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function daysUntil(dateStr){
  if(!dateStr) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(dateStr+'T00:00:00');
  return Math.round((target-today)/86400000);
}

async function init(){
  let loaded = await sGet('destinations', null);
  if(!loaded){
    loaded = SEED_DESTINATIONS;
    await sSet('destinations', loaded);
    for(const d of loaded){ await sSet('dest-data:'+d.id, SEED_DEST_DATA[d.id]); }
  }
  destinations = loaded;
  let destChanged = false;
  destinations.forEach(d=>{
    if(!d.continent){ d.continent = 'Rest der Welt'; destChanged = true; }
    if('tripDate' in d){ delete d.tripDate; destChanged = true; }
    if(d.id==='kanaren' && d.continent!=='Europa'){ d.continent = 'Europa'; destChanged = true; }
  });
  trips = await sGet('trips', []);
  world = Object.assign({countries:{}, wishes:[], deadlines:[], vacation:{}, bundesland:''}, await sGet('world', {}));
  trips.forEach(t=>{
    if(!t.destIds) t.destIds = [];
    if(!t.documents) t.documents = [];
    if(!t.tickets) t.tickets = [];
    if(!t.activityTickets) t.activityTickets = [];
    if(!t.diary) t.diary = [];
    if(!t.photoIds) t.photoIds = [];
    if(!t.dayPlan) t.dayPlan = [];
    if(!t.budget) t.budget = [];
    if(t.buchungsdatum===undefined) t.buchungsdatum = null;
    if(!t.photoDayAssignments) t.photoDayAssignments = {};
    if(t.coverPhotoId===undefined) t.coverPhotoId = null;
    if(!t.travelDocs) t.travelDocs = [];
    if(t.hotelName===undefined) t.hotelName = '';
    if(t.destName===undefined) t.destName = '';
  });

  const migrationDone = await sGet('migration-v2', false);
  if(!migrationDone){
    const existingIds = new Set(destinations.map(d=>d.id));
    for(const d of SEED_DESTINATIONS){
      if(!existingIds.has(d.id)){
        destinations.push(d);
        await sSet('dest-data:'+d.id, SEED_DEST_DATA[d.id]);
        destChanged = true;
      }
    }
    const hasCruiseTrip = trips.some(t=> t.destIds.includes('madeira') && t.destIds.includes('kanaren'));
    if(!hasCruiseTrip){
      trips.push({id:genId(), dateFrom:'2027-01-16', dateTo:'2027-01-23', buchungsdatum:null, hotelName:'', type:'Schiffsreise', companions:'', destIds:['madeira','kanaren'], destName:'', documents:[], travelDocs:[], tickets:[], activityTickets:[], diary:[], photoIds:[], dayPlan:[], budget:[], photoDayAssignments:{}, coverPhotoId:null});
      await saveTrips();
    }
    await sSet('migration-v2', true);
  }
  if(destChanged) await sSet('destinations', destinations);

  recipes = await sGet('recipes', []);
  const migrationV3Done = await sGet('migration-v3', false);
  if(!migrationV3Done){
    const hasDakos = recipes.some(r=>r.nameNative==='Dakos');
    if(!hasDakos){
      recipes.push({
        id:genId(), destId:'kreta', category:'Vegetarisch',

        servings:'2 Personen', time:'10 Minuten, keine Kochzeit',

        steps:'Die Zwiebäcke leicht mit etwas Wasser oder Olivenöl beträufeln, bis sie gerade weich werden — sie sollen nicht durchweichen.\nTomaten grob reiben oder sehr fein würfeln, mit Salz und der Hälfte des Olivenöls vermengen.\nTomatenmasse auf die Zwiebäcke geben, den Käse darüber bröckeln.\nMit Oregano bestreuen, restliches Olivenöl darüber träufeln und sofort servieren. Optional noch mit Oliven und Kapern verfeinern.'

function downloadJson(obj, filename){
  const json = JSON.stringify(obj, null, 2);
  const blob = new Blob([json], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function setupImageZoomPan(img){
  let scale = 1, panX = 0, panY = 0;
  let lastDistance = null;
  let isPanning = false;
  let panStart = null;
  let lastTapTime = 0;

  function applyTransform(){
    img.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
  }
  function getDistance(t1,t2){
    return Math.hypot(t1.clientX-t2.clientX, t1.clientY-t2.clientY);
  }
  function clampPan(){
    const maxPan = Math.max(0, (scale-1)) * (img.clientWidth/2) + 120;
    panX = Math.max(-maxPan, Math.min(maxPan, panX));
    panY = Math.max(-maxPan, Math.min(maxPan, panY));
  }
  function resetZoom(){
    scale = 1; panX = 0; panY = 0;
    img.style.transition = 'transform 0.15s ease';
    applyTransform();
    setTimeout(()=>{ img.style.transition = ''; }, 160);
  }
  function zoomToDefault(){
    scale = 2.5;
    img.style.transition = 'transform 0.15s ease';
    applyTransform();
    setTimeout(()=>{ img.style.transition = ''; }, 160);
  }

  img.style.touchAction = 'none';

  img.addEventListener('touchstart', (e)=>{
    if(e.touches.length===2){
      lastDistance = getDistance(e.touches[0], e.touches[1]);
    } else if(e.touches.length===1){
      const now = Date.now();
      if(now - lastTapTime < 350){
        if(scale>1) resetZoom(); else zoomToDefault();
        lastTapTime = 0;
      } else {
        lastTapTime = now;
      }
      if(scale>1){
        isPanning = true;
        panStart = {x: e.touches[0].clientX - panX, y: e.touches[0].clientY - panY};
      }
    }
  }, {passive:true});

  img.addEventListener('touchmove', (e)=>{
    if(e.touches.length===2 && lastDistance){
      e.preventDefault();
      const dist = getDistance(e.touches[0], e.touches[1]);
      scale = Math.max(1, Math.min(5, scale * (dist/lastDistance)));
      lastDistance = dist;
      clampPan();
      applyTransform();
    } else if(e.touches.length===1 && isPanning && scale>1){
      e.preventDefault();
      panX = e.touches[0].clientX - panStart.x;
      panY = e.touches[0].clientY - panStart.y;
      clampPan();
      applyTransform();
    }
  }, {passive:false});

  img.addEventListener('touchend', (e)=>{
    if(e.touches.length<2) lastDistance = null;
    if(e.touches.length===0) isPanning = false;
  });

  // Mouse fallback for desktop testing: click-drag to pan, double-click to toggle zoom
  let mouseDown = false, mouseStart = null, lastClickTime = 0;
  img.addEventListener('mousedown', (e)=>{
    const now = Date.now();
    if(now - lastClickTime < 350){
      if(scale>1) resetZoom(); else zoomToDefault();
    }
    lastClickTime = now;
    if(scale>1){ mouseDown = true; mouseStart = {x:e.clientX-panX, y:e.clientY-panY}; }
  });
  window.addEventListener('mousemove', (e)=>{
    if(mouseDown && scale>1){
      panX = e.clientX - mouseStart.x;
      panY = e.clientY - mouseStart.y;
      clampPan();
      applyTransform();
    }
  });
  window.addEventListener('mouseup', ()=>{ mouseDown = false; });
}

const BUNDESLAENDER = [['','nur bundesweite Feiertage'],['BW','Baden-Württemberg'],['BY','Bayern'],['BE','Berlin'],['BB','Brandenburg'],['HB','Bremen'],['HH','Hamburg'],['HE','Hessen'],['MV','Mecklenburg-Vorpommern'],['NI','Niedersachsen'],['NW','Nordrhein-Westfalen'],['RP','Rheinland-Pfalz'],['SL','Saarland'],['SN','Sachsen'],['ST','Sachsen-Anhalt'],['SH','Schleswig-Holstein'],['TH','Thüringen']];
function easterSunday(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);
  const month=Math.floor((h+l-7*m+114)/31), day=((h+l-7*m+114)%31)+1; return new Date(y,month-1,day);
}
const isoLocal = (d) => new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
function holidaysOf(y, land){
  const e = easterSunday(y), off = (n)=>{ const d = new Date(e); d.setDate(d.getDate()+n); return isoLocal(d); };
  const set = new Set([`${y}-01-01`, off(-2), off(1), `${y}-05-01`, off(39), off(50), `${y}-10-03`, `${y}-12-25`, `${y}-12-26`]);
  const has = (...l) => l.includes(land);
  if(has('BW','BY','ST')) set.add(`${y}-01-06`);
  if(has('BE') || (has('MV') && y>=2023)) set.add(`${y}-03-08`);
  if(has('BW','BY','HE','NW','RP','SL')) set.add(off(60));
  if(has('SL')) set.add(`${y}-08-15`);
  if(has('TH')) set.add(`${y}-09-20`);
  if(has('BB','HB','HH','MV','NI','SN','ST','SH','TH')) set.add(`${y}-10-31`);
  if(has('BW','BY','NW','RP','SL')) set.add(`${y}-11-01`);
  if(has('SN')){ const d = new Date(y,10,22); while(d.getDay()!==3) d.setDate(d.getDate()-1); set.add(isoLocal(d)); }
  return set;
}
function workdaysInYear(from, to, year){
  if(!from) return 0;
  const hol = holidaysOf(year, world.bundesland||'');
  let n = 0;
  const d = new Date(from+'T00:00:00'), end = new Date((to||from)+'T00:00:00');
  for(; d<=end; d.setDate(d.getDate()+1)){
    if(d.getFullYear()!==year) continue;
    const wd = d.getDay();
    if(wd===0 || wd===6) continue;
    if(hol.has(isoLocal(d))) continue;
    n++;
  }
  return n;
}
function vacationYear(y){
  const v = world.vacation[y] || {entitlement:30, carry:0, extra:[]};
  if(!v.extra) v.extra = [];
  const today = isoLocal(new Date());
  const rows = trips.filter(t=>t.dateFrom && (t.dateFrom.slice(0,4)==String(y) || (t.dateTo||'').slice(0,4)==String(y))).map(t=>{
    const auto = workdaysInYear(t.dateFrom, t.dateTo, y);
    const override = t.vacationDays && t.vacationDays[y]!=null && t.vacationDays[y]!=='' ? Number(t.vacationDays[y]) : null;
    return {trip:t, auto, days: override!=null ? override : auto, override, past:(t.dateTo||t.dateFrom) < today};
  }).sort((a,b)=>a.trip.dateFrom.localeCompare(b.trip.dateFrom));
  const extra = v.extra.reduce((s,x)=>s+(Number(x.days)||0),0);
  const taken = rows.filter(r=>r.past).reduce((s,r)=>s+r.days,0);
  const planned = rows.filter(r=>!r.past).reduce((s,r)=>s+r.days,0);
  const available = (Number(v.entitlement)||0) + (Number(v.carry)||0);
  return {v, rows, extra, taken, planned, available, left: available - taken - planned - extra};
}

const DEADLINE_TYPES = ['Reisepass','Personalausweis','Führerschein','Internationaler Führerschein','Visum / ESTA / eTA','Krankenversicherungskarte','Auslandskrankenversicherung','Kreditkarte','Impfung','Sonstiges'];
function deadlineStatus(dl){
  const today = new Date(); today.setHours(0,0,0,0);
  const d = new Date(dl.date+'T00:00:00');
  const days = Math.round((d-today)/86400000);
  const issues = [];
  getUpcomingTripsSorted().forEach(t=>{
    const end = new Date((t.dateTo||t.dateFrom)+'T00:00:00');
    const need = new Date(end);
    if(dl.type==='Reisepass' && tripNeedsPassportBuffer(t)) need.setMonth(need.getMonth()+6);
    if(d < need) issues.push(`${dl.type==='Reisepass' && d>=end ? 'weniger als 6 Monate gültig nach' : 'läuft ab vor Ende von'} „${getTripDisplayName(t)}“`);
  });
  let level = 'ok';
  if(days < 0) level = 'expired'; else if(issues.length || days <= 90) level = 'warn'; else if(days <= 180) level = 'soon';
  return {days, issues, level};
}
const EU_EFTA = new Set('40 56 100 191 196 203 208 233 246 250 276 300 348 372 380 428 440 442 470 528 616 620 642 703 705 724 752 352 438 578 756 234'.split(' '));
function tripNeedsPassportBuffer(t){
  const cs = (t.destIds||[]).map(id=>DEST_COUNTRY[id] || ((destinations.find(d=>d.id===id)||{}).countryId));
  return !cs.length || cs.some(c=>!c || !EU_EFTA.has(String(c)));
}
function getUpcomingTripsSorted(){
  const today = new Date(); today.setHours(0,0,0,0);
  return trips.filter(t=>t.dateFrom && new Date((t.dateTo||t.dateFrom)+'T00:00:00') >= today).sort((a,b)=>a.dateFrom.localeCompare(b.dateFrom));
}
function deadlineAlerts(){ return world.deadlines.map(dl=>({dl, st:deadlineStatus(dl)})).filter(x=>x.st.level==='expired' || x.st.level==='warn'); }
function renderDeadlineBanner(){

const COUNTRY_FILL = {visited:'--navy', planned:'--green', wish:'--brass'};
function countryStyle(key, auto){
  const s = countryState(key, auto);
  const cs = getComputedStyle(document.documentElement);
  const col = s ? cs.getPropertyValue(COUNTRY_FILL[s]).trim() : cs.getPropertyValue('--surface').trim();
  return {fillColor: col || '#ccc', fillOpacity: s ? 0.9 : 1, color: cs.getPropertyValue('--border').trim() || '#bbb', weight: 0.6};
}
/* Länder über die Datumsgrenze (Russland, Fidschi …) ohne Querstreifen zeichnen */
function unwrapRing(ring){
  if(!ring || ring.length<2) return ring;
  let off = 0, sum = 0;
  const out = ring.map((pt,i)=>{
    if(i>0){ const d = pt[0] - ring[i-1][0]; if(d>180) off -= 360; else if(d<-180) off += 360; }
    const lng = pt[0] + off; sum += lng; return [lng, pt[1]];
  });
  const mean = sum / out.length;
  const shift = mean > 180 ? -360 : mean < -180 ? 360 : 0;
  if(shift) out.forEach(pt=>{ pt[0] += shift; });
  return out;
}
function unwrapGeometry(g){
  if(!g) return;
  if(g.type==='Polygon') g.coordinates = g.coordinates.map(unwrapRing);
  else if(g.type==='MultiPolygon') g.coordinates = g.coordinates.map(poly=>poly.map(unwrapRing));
}
async function initWorldMap(){
  const el = document.getElementById('world-map');
  if(!el) return;
  if(typeof L==='undefined'){ el.innerHTML = '<div class="world-map-loading">Weltkarte braucht beim ersten Öffnen eine Internetverbindung.</div>'; return; }
  try{
    if(!(await ensureLib('topojson'))) throw new Error('lib');
    if(!worldTopo){ const r = await fetch(WORLD_DATA_URL); if(!r.ok) throw new Error('data'); worldTopo = await r.json(); }
  }catch(e){
    el.innerHTML = '<div class="world-map-loading">Weltkarte braucht beim ersten Öffnen eine Internetverbindung.</div>';
    return;
  }
  if(!document.body.contains(el)) return;
  el.innerHTML = '';
  const geo = topojson.feature(worldTopo, worldTopo.objects.countries);
  geo.features.forEach(f=>{ if(countryKey(f)!=='10') unwrapGeometry(f.geometry); });
  if(!world.names){ world.names = {}; }
  geo.features.forEach(f=>{ const k = countryKey(f); if(!world.names[k]) world.names[k] = (f.properties||{}).name || k; });
  if(worldMapInst){ try{ worldMapInst.remove(); }catch(e){} }
  worldMapInst = L.map(el, {attributionControl:false, zoomSnap:0.25, minZoom:0.75, maxZoom:6, worldCopyJump:false, maxBounds:[[-75,-200],[88,215]]});
  worldMapInst.setView([28, 12], 1);
  const auto = autoCountryStates();
  L.geoJSON(geo, {
    filter: (f)=> countryKey(f)!=='10',
    style: (f)=> countryStyle(countryKey(f), auto),
    onEachFeature: (f, layer)=>{
      layer.on('click', async ()=>{
        const k = countryKey(f);
        const next = cycleCountryState(k);
        await saveWorld();
        layer.setStyle(countryStyle(k, autoCountryStates()));
        updateWeltStats();
        showToast(`${countryNameDe(k, world.names[k])}: ${next ? COUNTRY_STATE_LABEL[next] : 'zurückgesetzt'}`);
      });
    }
  }).addTo(worldMapInst);
}
function cycleCountryState(k){
  const auto = autoCountryStates();
  const cur = countryState(k, auto);
  const next = cur==='' ? 'wish' : cur==='wish' ? 'visited' : cur==='planned' ? 'visited' : '';
  if(next==='') world.countries[k] = auto[k] ? 'none' : undefined;
  else world.countries[k] = (auto[k]===next) ? undefined : next;
  if(world.countries[k]===undefined) delete world.countries[k];
  return next;
}
function updateWeltStats(){
  const box = document.getElementById('welt-stats');
  if(!box) return;
  const auto = autoCountryStates();
  const keys = new Set([...Object.keys(world.countries), ...Object.keys(auto)]);
  const c = {visited:0, planned:0, wish:0};
  keys.forEach(k=>{ const s = countryState(k, auto); if(c[s]!=null) c[s]++; });
  const b = box.querySelectorAll('b');
  b[0].textContent = c.visited; b[1].textContent = c.planned; b[2].textContent = c.wish; b[3].textContent = Math.round(c.visited/195*100)+' %';
}

function getNextTrip(){
  const today = new Date(); today.setHours(0,0,0,0);
  const upcoming = trips.filter(t=>t.dateFrom && new Date(t.dateFrom+'T00:00:00') >= today);
  upcoming.sort((a,b)=> a.dateFrom.localeCompare(b.dateFrom));
  return upcoming[0] || null;
}
function getNextTripForDest(destId){
  const today = new Date(); today.setHours(0,0,0,0);
  const upcoming = trips.filter(t=> t.destIds.includes(destId) && t.dateFrom && new Date(t.dateFrom+'T00:00:00') >= today);
  upcoming.sort((a,b)=> a.dateFrom.localeCompare(b.dateFrom));
  return upcoming[0] || null;
}
function isTripPast(t){
  const today = new Date(); today.setHours(0,0,0,0);
  const refDate = t.dateTo || t.dateFrom;
  if(!refDate) return false;
  return new Date(refDate+'T00:00:00') < today;
}
function getPastTrips(){
  return trips.filter(isTripPast).sort((a,b)=> (b.dateTo||b.dateFrom).localeCompare(a.dateTo||a.dateFrom));
}
function getOtherTrips(nextTrip){
  const rest = trips.filter(t=> (!nextTrip || t.id!==nextTrip.id) && !isTripPast(t));
  const withDate = rest.filter(t=>t.dateFrom).sort((a,b)=>a.dateFrom.localeCompare(b.dateFrom));
  const withoutDate = rest.filter(t=>!t.dateFrom);
  return [...withDate, ...withoutDate];
}
function getUpcomingTrips(){
  const upcoming = trips.filter(t=>!isTripPast(t));
  const withDate = upcoming.filter(t=>t.dateFrom).sort((a,b)=>a.dateFrom.localeCompare(b.dateFrom));
  const withoutDate = upcoming.filter(t=>!t.dateFrom);
  return [...withDate, ...withoutDate];
}
function calcDurationDays(dateFrom, dateTo){
  if(!dateFrom || !dateTo) return null;
  const a = new Date(dateFrom+'T00:00:00');
  const b = new Date(dateTo+'T00:00:00');
  const diff = Math.round((b-a)/86400000);
  return diff>=0 ? diff+1 : null;
}
function calcVacationDays(dateFrom, dateTo){
  if(!dateFrom || !dateTo) return null;
  const a = new Date(dateFrom+'T00:00:00');
  const b = new Date(dateTo+'T00:00:00');
  if(b<a) return null;
  let count=0;
  const cur = new Date(a);
  while(cur<=b){
    const day = cur.getDay();
    if(day!==0 && day!==6) count++;
    cur.setDate(cur.getDate()+1);
  }
  return count;
}
function formatDateRangeDe(dateFrom, dateTo){
  if(!dateFrom && !dateTo) return 'Datum offen';
  if(dateFrom && !dateTo) return formatDateDe(dateFrom);
  if(!dateFrom && dateTo) return formatDateDe(dateTo);
  return formatDateDe(dateFrom)+' – '+formatDateDe(dateTo);
}
function renderTripDurationInfo(trip){
  const days = calcDurationDays(trip.dateFrom, trip.dateTo);
  const vacation = calcVacationDays(trip.dateFrom, trip.dateTo);
  if(days===null) return '<p class="hint-text">Bitte Von- und Bis-Datum angeben.</p>';

    </div>`;
}

    document.querySelectorAll('.mascot-svg').forEach(el=>{ el.classList.remove('mood-'+mood); });
  }, duration);
}
function getTripsForFilter(filter, excludeId){
  let list;
  if(filter==='Vergangen'){
    list = getPastTrips();
  } else {
    list = getUpcomingTrips();
    if(filter==='Unterwegs') list = list.filter(t=>getTripStatusBadge(t)==='Unterwegs');
    else if(filter==='Geplant') list = list.filter(t=>getTripStatusBadge(t)==='Geplant');
  }
  if(excludeId) list = list.filter(t=>t.id!==excludeId);
  return list;
}
async function loadHomeWeatherWidget(){
  const el = document.getElementById('home-weather-widget');
  if(!el) return;
  try{
    if(!state.userLocation){
      if(!navigator.geolocation) return;
      const pos = await new Promise((resolve,reject)=>{
        navigator.geolocation.getCurrentPosition(resolve, reject, {enableHighAccuracy:false, timeout:8000});
      });
      state.userLocation = {lat: pos.coords.latitude, lng: pos.coords.longitude};
    }
    const w = await loadQuickWeather(state.userLocation);
    if(w){
      el.innerHTML = `<span>${w.emoji}</span><span>${w.temp}°</span>`;
      el.style.display = 'flex';
    }
  }catch(e){ /* Wetter ist ein Nice-to-have, bei Fehlern einfach ausgeblendet lassen */ }
}

function normalizeForFilename(name){
  return (name||'')
    .replace(/[äÄ]/g,'ae').replace(/[öÖ]/g,'oe').replace(/[üÜ]/g,'ue').replace(/ß/g,'ss')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-zA-Z0-9]+/g,'_')
    .replace(/^_+|_+$/g,'');
}
function findCountryPhotoFile(name){
  const norm = normalizeForFilename(name).toLowerCase();
  if(!norm) return null;
  const match = COUNTRY_PHOTO_FILES.find(f=>f.slice(0,-4).toLowerCase()===norm);
  return match ? './laender-fotos/'+match : null;
}
async function getDestStaticPhotoPath(d){
  const direct = findCountryPhotoFile(d.name);
  if(direct) return direct;
  if(d.country){
    const byCountry = findCountryPhotoFile(d.country);
    if(byCountry) return byCountry;
  }
  if(d._resolvedCountry===undefined){
    try{
      const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${d.lat}&lon=${d.lng}&format=json&accept-language=de`, {headers:{'Accept':'application/json'}});
      const data = await res.json();
      d._resolvedCountry = (data.address && data.address.country) || null;
    }catch(e){ d._resolvedCountry = null; }
  }
  if(d._resolvedCountry) return findCountryPhotoFile(d._resolvedCountry);
  return null;
}
async function getDestCoverPhotoId(destId){
  if(destDataCache[destId] && destDataCache[destId].coverPhotoId){
    return destDataCache[destId].coverPhotoId;

  const linkedTrips = trips.filter(t=>t.destIds.includes(destId) && t.photoIds && t.photoIds.length);
  return linkedTrips.length ? linkedTrips[0].photoIds[0] : null;
}
function getTripStatusBadge(t){
  const today = new Date(); today.setHours(0,0,0,0);
  const from = t.dateFrom ? new Date(t.dateFrom+'T00:00:00') : null;
  const to = t.dateTo ? new Date(t.dateTo+'T00:00:00') : from;
  if(from && to && today>=from && today<=to) return 'Unterwegs';
  if(to && today>to) return 'Vergangen';
  return 'Geplant';
}

function parseRecipeText(text){
  const lines = text.split('\n').map(l=>l.trim()).filter(l=>l.length);
  let nameNative='', nameGerman='', servings='', time='';
  const ingredients=[], steps=[];
  let section = null;
  lines.forEach(line=>{
    const lower = line.toLowerCase();
    if(!nameNative && !section && !/^für\s+\d/i.test(line) && !lower.includes('zutaten') && !lower.includes('zubereitung')){
      const cleaned = line.replace(/^[^\p{L}\p{N}]+/u,'').trim();
      const parts = cleaned.split(/✦+/).map(p=>p.trim()).filter(Boolean);
      if(parts.length>=2){ nameNative=parts[0]; nameGerman=parts[1]; }
      else { nameNative = cleaned; }
      return;
    }
    if(!section && (/^für\s+\d/i.test(line) || lower.includes('minuten') || lower.includes('person'))){
      const parts = line.split(/·/);
      const m = parts[0].match(/für\s+(.+)/i);
      servings = m ? m[1].trim() : parts[0].trim();
      if(parts[1]) time = parts[1].trim();
      return;
    }
    if(lower.includes('zutaten')){
      section='ingredients';
      const rest = line.replace(/^.*?zutaten/i,'').trim();
      if(rest) ingredients.push(rest);
      return;
    }
    if(lower.includes('zubereitung')){
      section='steps';
      const rest = line.replace(/^.*?zubereitung/i,'').trim();
      if(rest) steps.push(rest.replace(/^\d+\.\s*/,''));
      return;
    }
    if(section==='ingredients') ingredients.push(line);
    else if(section==='steps') steps.push(line.replace(/^\d+\.\s*/,''));
  });
  return {nameNative, nameGerman, servings, time, ingredients: ingredients.join('\n'), steps: steps.join('\n')};
}

const DEST_KEYWORDS = {
  kapverde: ['Kap Verde','Kapverde','Cabo Verde','Sal','Praia','Santiago','Boa Vista','Mindelo'],
  azoren: ['Azoren','Azores','Ponta Delgada','São Miguel','Sao Miguel','Terceira','Pico','Faial'],
  madeira: ['Madeira','Funchal'],
  norwegen: ['Norwegen','Norway','Oslo','Bergen','Norwegian'],
  faeroeer: ['Färöer','Faröer','Faroe','Tórshavn','Torshavn'],
  island: ['Island','Iceland','Reykjavik','Reykjavík'],
  kanaren: ['Kanaren','Canary','Gran Canaria','Teneriffa','Tenerife','Lanzarote','Fuerteventura','Las Palmas'],
  sardinien: ['Sardinien','Sardinia','Cagliari','Alghero','Olbia'],
  kreta: ['Kreta','Crete','Heraklion','Chania']
};
const KNOWN_AIRLINES = ['Lufthansa','TAP Portugal','TAP Air','TAP','AIDA','Condor','Eurowings','Ryanair','easyJet','SAS','Norwegian Air','Icelandair','Swiss','Austrian Airlines','KLM','Air France','Vueling','Binter Canarias'];
const MONTH_ABBR = {jan:1,feb:2,mar:3,mär:3,maer:3,apr:4,may:5,mai:5,jun:6,jul:7,aug:8,sep:9,oct:10,okt:10,nov:11,dec:12,dez:12};
function findMatchingDestination(text){
  if(!text) return null;
  const t = text.trim().toLowerCase();
  if(!t) return null;
  let match = destinations.find(d=> d.name.toLowerCase()===t);
  if(match) return match;
  match = destinations.find(d=> d.name.toLowerCase().includes(t) || t.includes(d.name.toLowerCase()));
  if(match) return match;
  for(const id of Object.keys(DEST_KEYWORDS)){
    if(DEST_KEYWORDS[id].some(kw=> kw.toLowerCase()===t || t.includes(kw.toLowerCase()))){
      const d = destinations.find(d=>d.id===id);
      if(d) return d;
    }
  }
  return null;
}
function getTripDisplayName(trip){
  const linkedDests = (trip.destIds||[]).map(id=>destinations.find(d=>d.id===id)).filter(Boolean);
  if(linkedDests.length) return linkedDests.map(d=>d.name).join(' & ');
  if(trip.destName && trip.destName.trim()) return trip.destName.trim();
  return 'Neue Reise';
}
function parseFlexibleDate(text){
  let m = text.match(/\b(\d{1,2})([A-Z]{3})(\d{2,4})\b/);
  if(m && MONTH_ABBR[m[2].toLowerCase()]){
    const mon = MONTH_ABBR[m[2].toLowerCase()];
    let year = m[3];
    if(year.length===2) year = (parseInt(year,10)<50?'20':'19')+year;
    return `${year}-${String(mon).padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  }
  m = text.match(/\b(\d{1,2})\.\s*([A-Za-zäÄ]{3,12})\.?\s*(\d{4})\b/);
  if(m){
    const mon = MONTH_ABBR[m[2].toLowerCase().slice(0,3)];
    if(mon) return `${m[3]}-${String(mon).padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  }
  m = text.match(/\b(\d{1,2})\.(\d{1,2})\.(\d{4})\b/);
  if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  m = text.match(/\b(\d{4})-(\d{2})-(\d{2})\b/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  return '';
}
function parseFlightTicketText(text){
  const result = {airline:'', flightNumber:'', date:'', from:'', to:'', departTime:'', arriveTime:'', passengerName:'', seat:'', bookingCode:''};
  result.date = parseFlexibleDate(text);
  const airlineMatch = KNOWN_AIRLINES.find(a=>text.toLowerCase().includes(a.toLowerCase()));
  if(airlineMatch) result.airline = airlineMatch;
  const flightMatch = text.match(/\b([A-Z]{2})\s?(\d{2,4})\b/);
  if(flightMatch) result.flightNumber = flightMatch[1]+flightMatch[2];
  const routeMatch = text.match(/\b([A-Z]{3})\s*[-–]\s*([A-Z]{3})\b/);
  if(routeMatch){ result.from = routeMatch[1]; result.to = routeMatch[2]; }
  const seatMatch = text.match(/Seat[:\s]+(\d{1,3}\s?[A-Za-z])/i) || text.match(/Sitz(?:platz)?[:\s]+(\d{1,3}\s?[A-Za-z])/i);
  if(seatMatch) result.seat = seatMatch[1].replace(/\s/g,'');
  const passengerMatch = text.match(/Passenger[:\s]+([A-Za-z]+\/[A-Za-z\s]+)/i)
    || text.match(/Passagier[:\s]+([A-Za-zÄÖÜäöüß\s]+)/i)
    || text.match(/\b([A-Z][a-z]+\/[A-Z][a-z]+(?:\s[A-Za-z]+)?)\b/);
  if(passengerMatch) result.passengerName = passengerMatch[1].trim().replace(/\s{2,}/g,' ');
  const codeMatch = text.match(/(?:Buchungscode|Booking\s*ref(?:erence)?|PNR|Bestätigungsnummer|Confirmation(?:\s*number)?)[:\s]+([A-Z0-9]{4,8})/i);
  if(codeMatch) result.bookingCode = codeMatch[1];
  const timeMatches = [...text.matchAll(/\b([01]?\d|2[0-3]):([0-5]\d)\b/g)].map(mm=>mm[0]);
  if(timeMatches[0]) result.departTime = timeMatches[0];
  if(timeMatches[1]) result.arriveTime = timeMatches[1];
  return result;
}
function parseActivityTicketText(text){
  const result = {date:'', time:'', bookingCode:''};
  result.date = parseFlexibleDate(text);
  const timeMatches = [...text.matchAll(/\b([01]?\d|2[0-3]):([0-5]\d)\b/g)].map(mm=>mm[0]);
  if(timeMatches[0]) result.time = timeMatches[0];
  const gygMatch = text.match(/\bGYG[A-Z0-9]{6,10}\b/);
  const genericCodeMatch = text.match(/(?:Voucher|Ticket-?(?:Nr\.?|Nummer|ID)|Referenz|Booking\s*ID)[:\s]+([A-Z0-9]{4,12})/i);
  result.bookingCode = gygMatch ? gygMatch[0] : (genericCodeMatch ? genericCodeMatch[1] : '');
  return result;
}
async function extractPdfText(file){
  const arrayBuffer = await file.arrayBuffer();
  if(!(await ensureLib('pdf'))) throw new Error('PDF-Dienst nicht verfügbar');
  const pdf = await pdfjsLib.getDocument({data:arrayBuffer}).promise;
  let text = '';
  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it=>it.str).join(' ') + '\n';
  }
  return text;
}
let tesseractLoadPromise = null;
function loadTesseract(){
  if(typeof Tesseract !== 'undefined') return Promise.resolve();
  if(tesseractLoadPromise) return tesseractLoadPromise;
  tesseractLoadPromise = new Promise((resolve, reject)=>{
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    script.onload = () => resolve();
    script.onerror = () => reject(new Error('Tesseract.js konnte nicht geladen werden'));
    document.head.appendChild(script);
  });
  return tesseractLoadPromise;
}
function preprocessImageForOcr(file){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e => { img.src = e.target.result; };
    reader.onerror = reject;
    img.onload = () => {
      try{
        const minWidth = 1600;
        const scale = img.width < minWidth ? minWidth / img.width : 1;
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imageData.data;
        const contrast = 1.35;
        const intercept = 128 * (1 - contrast);
        for(let i=0; i<data.length; i+=4){
          const gray = 0.299*data[i] + 0.587*data[i+1] + 0.114*data[i+2];
          let v = gray*contrast + intercept;
          v = Math.max(0, Math.min(255, v));
          data[i] = data[i+1] = data[i+2] = v;
        }
        ctx.putImageData(imageData, 0, 0);
        canvas.toBlob(blob=> blob ? resolve(blob) : reject(new Error('toBlob failed')), 'image/png');
      }catch(e){ reject(e); }
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function extractImageText(file){
  await loadTesseract();
  const worker = await Tesseract.createWorker('deu+eng');
  try{
    try{ await worker.setParameters({ tessedit_pageseg_mode: '6' }); }catch(e){}
    let input = file;
    try{ input = await preprocessImageForOcr(file); }catch(e){ input = file; }
    const { data:{ text } } = await worker.recognize(input);
    return text;
  } finally {
    await worker.terminate();
  }
}
function normalizeDateStr(raw){
  const dmy = raw.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  if(dmy) return `${dmy[3]}-${dmy[2].padStart(2,'0')}-${dmy[1].padStart(2,'0')}`;
  return raw;
}
function parseBookingText(text){
  const result = {dateFrom:null, dateTo:null, buchungsdatum:null, hotelName:'', matchedDestIds:[], ticket:null};

  let textForRangeDates = text;
  const bookingDateMatch = text.match(/(?:Buchungsdatum|Rechnungsdatum|Bestelldatum|Booking date|Order date|Gebucht am|Purchase date)[:\s]*(\d{1,2}\.\d{1,2}\.\d{4}|\d{4}-\d{2}-\d{2})/i);
  if(bookingDateMatch){
    result.buchungsdatum = normalizeDateStr(bookingDateMatch[1]);
    textForRangeDates = textForRangeDates.replace(bookingDateMatch[0], '');
  }
  const hotelMatch = text.match(/(?:Hotel|Unterkunft|Apartment|Ferienwohnung|Resort)[:\s]+([A-ZÄÖÜ][^\n,;]{2,50})/);
  if(hotelMatch){ result.hotelName = hotelMatch[1].trim(); }

  const dateMatches = [];
  let m;
  const reDMY = /\b(\d{1,2})\.(\d{1,2})\.(\d{4})\b/g;
  while((m = reDMY.exec(textForRangeDates))){ dateMatches.push(`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`); }
  const reISO = /\b(\d{4})-(\d{2})-(\d{2})\b/g;
  while((m = reISO.exec(textForRangeDates))){ dateMatches.push(`${m[1]}-${m[2]}-${m[3]}`); }
  if(dateMatches.length){
    dateMatches.sort();
    result.dateFrom = dateMatches[0];
    result.dateTo = dateMatches[dateMatches.length-1];
  }
  Object.keys(DEST_KEYWORDS).forEach(id=>{
    if(DEST_KEYWORDS[id].some(kw=>text.toLowerCase().includes(kw.toLowerCase())) && destinations.find(d=>d.id===id)){
      result.matchedDestIds.push(id);
    }
  });
  result.matchedDestIds = result.matchedDestIds.slice(0,3);
  const flightMatch = text.match(/\b([A-Z]{2})\s?(\d{2,4})\b/);
  const airlineMatch = KNOWN_AIRLINES.find(a=>text.toLowerCase().includes(a.toLowerCase()));
  const codeMatch = text.match(/(?:Buchungscode|Booking\s*(?:reference|code)|PNR|Bestätigungsnummer|Confirmation(?:\s*number)?)[:\s]+([A-Z0-9]{5,8})/i);
  const passengerMatch = text.match(/(?:Passenger|Passagier|Fluggast|Fahrgast|Name)[:\s]+([A-ZÄÖÜ][A-ZÄÖÜa-zäöüß\s\/]{2,40})/i);
  const seatMatch = text.match(/(?:Seat|Sitz(?:platz)?)[:\s]+([0-9]{1,3}\s?[A-Za-z])/i);
  const timeMatches = [...text.matchAll(/\b([01]?\d|2[0-3]):([0-5]\d)\b/g)].map(mm=>mm[0]);
  if(flightMatch || airlineMatch || codeMatch){
    result.ticket = {
      id: genId(), airline: airlineMatch||'', flightNumber: flightMatch? flightMatch[1]+flightMatch[2] : '',
      date: result.dateFrom||'', from:'', to:'',
      departTime: timeMatches[0]||'', arriveTime: timeMatches[1]||'', bookingCode: codeMatch? codeMatch[1] : '',
      passengerName: passengerMatch? passengerMatch[1].trim() : '', seat: seatMatch? seatMatch[1].replace(/\s/g,'') : ''
    };
  }
  return result;
}
async function onBookingFileSelected(file){
  const trip = trips.find(t=>t.id===state.tripId);
  if(!trip){ showToast('Keine aktive Reise gefunden.'); return; }
  try{
    const name = file.name.toLowerCase();
    let text = '';
    if(name.endsWith('.pdf')){
      showToast('Lese Buchungsunterlagen…');
      if(!(await ensureLib('pdf'))){ showToast('PDF-Dienst nicht verfügbar (keine Internetverbindung).'); return; }
      text = await extractPdfText(file);
    } else if(file.type.startsWith('image/')){
      showToast('Erkenne Text im Screenshot… das kann einen Moment dauern.');
      try{
        text = await extractImageText(file);
      }catch(e){
        showToast('Texterkennung nicht verfügbar (keine Internetverbindung beim ersten Mal nötig).');
        return;
      }
    } else {
      showToast('Lese Buchungsunterlagen…');
      if(!(await ensureLib('mammoth'))){ showToast('Datei-Import-Dienst nicht verfügbar.'); return; }
      const arrayBuffer = await file.arrayBuffer();
      const res = await mammoth.extractRawText({arrayBuffer});
      text = res.value;
    }
    const parsed = parseBookingText(text);
    if(parsed.dateFrom && !trip.dateFrom) trip.dateFrom = parsed.dateFrom;
    if(parsed.dateTo && !trip.dateTo) trip.dateTo = parsed.dateTo;
    if(parsed.buchungsdatum && !trip.buchungsdatum) trip.buchungsdatum = parsed.buchungsdatum;
    if(parsed.hotelName && !trip.hotelName) trip.hotelName = parsed.hotelName;
    parsed.matchedDestIds.forEach(id=>{
      if(trip.destIds.length<3 && !trip.destIds.includes(id)) trip.destIds.push(id);
    });
    if(parsed.ticket) trip.tickets.push(parsed.ticket);
    await saveTrips();
    await ensureLinkedGuidesLoaded(trip);
    showToast(parsed.dateFrom || parsed.ticket ? 'Buchungsunterlagen eingelesen – bitte prüfen.' : 'Es wurde wenig erkannt – bitte manuell ergänzen.');
    render();
  }catch(e){
    showToast('Datei konnte nicht gelesen werden.');
  }
}

function haversineKm(lat1,lng1,lat2,lng2){
  const R = 6371;
  const dLat = (lat2-lat1)*Math.PI/180;
  const dLng = (lng2-lng1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return Math.round(R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}
function renderDestDistances(trip){

    for(let j=i+1;j<linked.length;j++){
      const km = haversineKm(linked[i].lat,linked[i].lng,linked[j].lat,linked[j].lng);
      rows += `<div class="distance-row">
        <span>${linked[i].flag} ${escapeHtml(linked[i].name)}</span>
        <span class="distance-arrow">↔</span>
        <span>${linked[j].flag} ${escapeHtml(linked[j].name)}</span>
        <span class="distance-value">${km.toLocaleString('de-DE')} km</span>
      </div>`;
    }
  }
  return `<div class="field-group"><label class="field-label">Entfernung zwischen den Zielen</label>${rows}</div>`;
}

function syncDayPlan(trip){
  if(!trip.dayPlan) trip.dayPlan = [];
  const days = calcDurationDays(trip.dateFrom, trip.dateTo);
  if(!days) return;
  while(trip.dayPlan.length < days){ trip.dayPlan.push({id:genId(), ort:'', plan:''}); }
  if(trip.dayPlan.length > days){ trip.dayPlan = trip.dayPlan.slice(0, days); }
}
function getRouteDays(route){
  if(route.days && route.days.length) return route.days;
  return route.text.split('\n').map(l=>l.trim()).filter(Boolean).map((line,i)=>({label:'Zeile '+(i+1), place:'', text:line}));
}

async function importWholeRoute(destId, routeId){
  const trip = trips.find(t=>t.id===state.tripId);
  const dd = destDataCache[destId];
  const route = dd.routes.find(r=>r.id===routeId);
  if(!route) return;
  const days = getRouteDays(route);
  syncDayPlan(trip);
  let count = 0;
  document.querySelectorAll('.day-import-whole-target').forEach(sel=>{
    const dayIdx = parseInt(sel.dataset.dayIndex,10);
    const targetIdx = parseInt(sel.value,10);
    const day = days[dayIdx];
    if(day && trip.dayPlan[targetIdx]){
      trip.dayPlan[targetIdx].plan = trip.dayPlan[targetIdx].plan ? trip.dayPlan[targetIdx].plan+'\n'+day.text : day.text;
      if(!trip.dayPlan[targetIdx].ort) trip.dayPlan[targetIdx].ort = day.place || route.title;
      count++;
    }
  });
  await saveTrips();
  showToast(count ? `${count} Tag(e) übernommen.` : 'Nichts übernommen.');
  render();
}
async function importSingleDay(destId, routeId, dayIndex, globalIndex){
  const trip = trips.find(t=>t.id===state.tripId);
  const dd = destDataCache[destId];
  const route = dd.routes.find(r=>r.id===routeId);
  if(!route) return;
  const days = getRouteDays(route);
  const day = days[dayIndex];
  if(!day) return;
  const selectEl = document.querySelector(`.day-import-target[data-global-index="${globalIndex}"]`);
  const targetIdx = selectEl ? parseInt(selectEl.value,10) : 0;
  syncDayPlan(trip);
  if(trip.dayPlan[targetIdx]){
    trip.dayPlan[targetIdx].plan = trip.dayPlan[targetIdx].plan ? trip.dayPlan[targetIdx].plan+'\n'+day.text : day.text;
    if(!trip.dayPlan[targetIdx].ort && day.place) trip.dayPlan[targetIdx].ort = day.place;
  }
  await saveTrips();
  showToast('Tag übernommen.');
  render();
}

async function renderPdfFirstPageToImage(file){
  const arrayBuffer = await file.arrayBuffer();
  if(!(await ensureLib('pdf'))) throw new Error('PDF-Dienst nicht verfügbar');
  const pdf = await pdfjsLib.getDocument({data:arrayBuffer}).promise;
  const page = await pdf.getPage(1);
  const baseViewport = page.getViewport({scale:1});
  const targetWidth = 1400;
  const scale = Math.max(1, targetWidth / baseViewport.width);
  const viewport = page.getViewport({scale});
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  const ctx = canvas.getContext('2d');
  await page.render({canvasContext:ctx, viewport}).promise;
  return canvas.toDataURL('image/png');
}
async function storeAttachedFile(file){
  const isImage = file.type.startsWith('image/');
  const isPdf = file.type==='application/pdf' || file.name.toLowerCase().endsWith('.pdf');
  let dataUrl;
  if(isImage){ dataUrl = await compressImage(file); }
  else if(isPdf && (await ensureLib('pdf'))){
    try{ dataUrl = await renderPdfFirstPageToImage(file); }
    catch(e){ dataUrl = await readFileAsDataUrl(file); }
  }
  else { dataUrl = await readFileAsDataUrl(file); }
  const fileId = genId();
  const fileObj = {dataUrl, filename:file.name, caption:''};
  await sSet('photo:'+fileId, fileObj);
  photoCache[fileId] = fileObj;
  return fileId;
}
async function extractTextFromAnyFile(file){
  const name = file.name.toLowerCase();
  if(name.endsWith('.pdf')){
    if(!(await ensureLib('pdf'))) return '';
    return await extractPdfText(file);
  }
  if(file.type.startsWith('image/')){
    return await extractImageText(file);
  }
  if(!(await ensureLib('mammoth'))) return '';
  const arrayBuffer = await file.arrayBuffer();
  const res = await mammoth.extractRawText({arrayBuffer});
  return res.value;
}

function syncActivityToDayPlan(trip, activity){
  if(!activity.date || !trip.dateFrom || !trip.dateTo) return;
  syncDayPlan(trip);
  const startDate = new Date(trip.dateFrom+'T00:00:00');
  const activityDate = new Date(activity.date+'T00:00:00');
  const dayIndex = Math.round((activityDate - startDate) / 86400000);
  if(dayIndex<0 || dayIndex>=trip.dayPlan.length) return;
  const day = trip.dayPlan[dayIndex];
  const parts = [activity.title];
  if(activity.time) parts.push('um '+activity.time+' Uhr');
  const line = parts.join(' ');
  day.plan = day.plan ? day.plan+'\n'+line : line;
  if(!day.ort && activity.location) day.ort = activity.location;
}

const MOODS = [[1,'😞','mies'],[2,'😕','durchwachsen'],[3,'🙂','okay'],[4,'😊','schön'],[5,'🤩','grandios']];
const moodEmoji = (m) => (MOODS.find(x=>x[0]===Number(m))||[])[1] || '';
function tripDayIndex(trip, date){
  if(!trip.dateFrom || !date) return -1;
  return Math.round((new Date(date+'T00:00:00') - new Date(trip.dateFrom+'T00:00:00'))/86400000);
}
function renderMoodCurve(trip, opts){
  const pts = [...trip.diary].filter(e=>e.mood).sort((a,b)=>a.date.localeCompare(b.date));
  if(pts.length < 2) return '';
  const W = 320, H = (opts&&opts.h) || 120, padL = 26, padR = 20, padT = 12, padB = 22;
  const iw = W-padL-padR, ih = H-padT-padB;
  const x = (i) => padL + (pts.length===1 ? iw/2 : i*iw/(pts.length-1));
  const y = (m) => padT + (5-m)*ih/4;
  let d = `M${x(0)},${y(pts[0].mood)}`;
  for(let i=1;i<pts.length;i++){
    const x0 = x(i-1), y0 = y(pts[i-1].mood), x1 = x(i), y1 = y(pts[i].mood), cx = (x0+x1)/2;
    d += ` C${cx},${y0} ${cx},${y1} ${x1},${y1}`;
  }
  const area = d + ` L${x(pts.length-1)},${padT+ih} L${x(0)},${padT+ih} Z`;
  const step = Math.ceil(pts.length/7);
  const labels = pts.map((e,i)=> (i%step===0 || i===pts.length-1) ? `<text x="${x(i)}" y="${H-6}" text-anchor="middle" class="mc-lbl">${(()=>{ const n = tripDayIndex(trip,e.date); return n>=0 ? 'Tag '+(n+1) : e.date.slice(8,10)+'.'+e.date.slice(5,7)+'.'; })()}</text>` : '').join('');
  return `<svg class="mood-curve" viewBox="0 0 ${W} ${H}" role="img" aria-label="Stimmungskurve der Reise">
    <defs><linearGradient id="mcg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--brass)" stop-opacity=".35"/><stop offset="1" stop-color="var(--brass)" stop-opacity="0"/></linearGradient></defs>
    ${[5,3,1].map(m=>`<line x1="${padL}" x2="${W-padR}" y1="${y(m)}" y2="${y(m)}" class="mc-grid"/><text x="${padL-6}" y="${y(m)+4}" text-anchor="end" class="mc-emo">${moodEmoji(m)}</text>`).join('')}
    <path d="${area}" fill="url(#mcg)"/>
    <path d="${d}" fill="none" stroke="var(--brass)" stroke-width="2.5" stroke-linecap="round"/>
    ${pts.map((e,i)=>`<circle cx="${x(i)}" cy="${y(e.mood)}" r="3.5" fill="var(--surface)" stroke="var(--brass)" stroke-width="2"/>`).join('')}
    ${labels}
  </svg>`;
}

function printMagazin(){
  const mag = document.getElementById('magazine');
  if(!mag) return;
  let root = document.getElementById('print-root');
  if(root) root.remove();
  root = document.createElement('div'); root.id = 'print-root';
  root.innerHTML = mag.outerHTML.replace('id="magazine"','id="magazine-print"');
  root.querySelectorAll('.no-print').forEach(n=>n.remove());
  root.querySelectorAll('.no-print-section').forEach(n=>{ const sec = n.closest('section'); if(sec){ const sign = sec.querySelector('.mag-sign'); sec.innerHTML = ''; if(sign) sec.appendChild(sign); } });
  document.body.appendChild(root);
  document.documentElement.classList.add('printing-magazin');
  const done = () => { document.documentElement.classList.remove('printing-magazin'); const r = document.getElementById('print-root'); if(r) r.remove(); window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  setTimeout(()=>{ window.print(); setTimeout(done, 1500); }, 80);
}

/* ----- Kalender (.ics) ----- */
function icsEsc(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n'); }
function icsFold(line){
  const out = []; let cur = line;
  while(cur.length > 74){ out.push(cur.slice(0,74)); cur = ' ' + cur.slice(74); }
  out.push(cur); return out.join('\r\n');
}
const icsDate = (iso) => iso.replace(/-/g,'');
function icsAddDays(iso, n){ const d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n); return isoLocal(d); }
function icsDateTime(iso, hhmm){ return icsDate(iso)+'T'+hhmm.replace(':','').padEnd(4,'0')+'00'; }
function addMinutes(iso, hhmm, mins){
  const [h,m] = hhmm.split(':').map(Number); const d = new Date(iso+'T00:00:00'); d.setMinutes(h*60+m+mins);
  return [isoLocal(d), String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')];
}
function buildTripIcs(trip, opt){
  const title = getTripDisplayName(trip);
  const stamp = new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const ev = [];
  const add = (uid, props) => {
    ev.push(['BEGIN:VEVENT', `UID:${uid}@reisebaerchi`, `DTSTAMP:${stamp}`, ...props, 'END:VEVENT']);
  };
  if(opt.trip && trip.dateFrom){
    add(trip.id+'-reise', [`DTSTART;VALUE=DATE:${icsDate(trip.dateFrom)}`, `DTEND;VALUE=DATE:${icsDate(icsAddDays(trip.dateTo||trip.dateFrom,1))}`,
      `SUMMARY:${icsEsc('🧳 '+title)}`, ...(trip.hotelName ? [`LOCATION:${icsEsc(trip.hotelName)}`] : []),
      `DESCRIPTION:${icsEsc([trip.type, trip.companions ? 'mit '+trip.companions : ''].filter(Boolean).join(' · '))}`, 'TRANSP:TRANSPARENT']);
  }
  if(opt.flights) (trip.tickets||[]).forEach(t=>{
    if(!t.date) return;
    const name = ['✈', t.flightNumber || t.airline, t.from && t.to ? `${t.from} → ${t.to}` : ''].filter(Boolean).join(' ');
    const desc = [t.airline, t.bookingCode ? 'Buchungscode '+t.bookingCode : '', t.seat ? 'Sitz '+t.seat : '', t.passengerName].filter(Boolean).join('\n');
    if(t.departTime){
      let end = t.arriveTime ? [t.date, t.arriveTime] : addMinutes(t.date, t.departTime, 120);
      if(t.arriveTime && t.arriveTime < t.departTime) end = [icsAddDays(t.date,1), t.arriveTime];
      add(t.id, [`DTSTART:${icsDateTime(t.date,t.departTime)}`, `DTEND:${icsDateTime(end[0],end[1])}`, `SUMMARY:${icsEsc(name)}`,
        ...(t.from ? [`LOCATION:${icsEsc(t.from)}`] : []), `DESCRIPTION:${icsEsc(desc)}`,
        'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEsc(name)}`,'TRIGGER:-PT3H','END:VALARM']);
    } else {
      add(t.id, [`DTSTART;VALUE=DATE:${icsDate(t.date)}`, `DTEND;VALUE=DATE:${icsDate(icsAddDays(t.date,1))}`, `SUMMARY:${icsEsc(name)}`, `DESCRIPTION:${icsEsc(desc)}`]);
    }
  });
  if(opt.activities) (trip.activityTickets||[]).forEach(a=>{
    if(!a.date) return;
    const name = '🎟 '+(a.title||'Aktivität');
    const desc = a.bookingCode ? 'Buchungscode '+a.bookingCode : '';
    if(a.time){
      const end = addMinutes(a.date, a.time, 120);
      add(a.id, [`DTSTART:${icsDateTime(a.date,a.time)}`, `DTEND:${icsDateTime(end[0],end[1])}`, `SUMMARY:${icsEsc(name)}`,
        ...(a.location ? [`LOCATION:${icsEsc(a.location)}`] : []), `DESCRIPTION:${icsEsc(desc)}`]);
    } else {
      add(a.id, [`DTSTART;VALUE=DATE:${icsDate(a.date)}`, `DTEND;VALUE=DATE:${icsDate(icsAddDays(a.date,1))}`, `SUMMARY:${icsEsc(name)}`,
        ...(a.location ? [`LOCATION:${icsEsc(a.location)}`] : []), `DESCRIPTION:${icsEsc(desc)}`]);
    }
  });
  if(opt.days && trip.dateFrom) (trip.dayPlan||[]).forEach((d,i)=>{
    if(!d.plan && !d.ort) return;
    const date = icsAddDays(trip.dateFrom, i);
    add(trip.id+'-tag'+(i+1), [`DTSTART;VALUE=DATE:${icsDate(date)}`, `DTEND;VALUE=DATE:${icsDate(icsAddDays(date,1))}`,
      `SUMMARY:${icsEsc(`Tag ${i+1}${d.ort ? ': '+d.ort : ''}`)}`, `DESCRIPTION:${icsEsc(d.plan||'')}`, 'TRANSP:TRANSPARENT']);
  });
  if(opt.deadlines) world.deadlines.forEach(dl=>{
    add('frist-'+dl.id, [`DTSTART;VALUE=DATE:${icsDate(dl.date)}`, `DTEND;VALUE=DATE:${icsDate(icsAddDays(dl.date,1))}`,
      `SUMMARY:${icsEsc(`⚠ ${dl.type}${dl.person ? ' ('+dl.person+')' : ''} läuft ab`)}`, 'TRANSP:TRANSPARENT',
      'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEsc(dl.type+' läuft ab')}`,'TRIGGER:-P90D','END:VALARM']);
  });
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Reisebaerchi on Tour//DE','CALSCALE:GREGORIAN','METHOD:PUBLISH', `X-WR-CALNAME:${icsEsc(title)}`];
  ev.forEach(e=>lines.push(...e));
  lines.push('END:VCALENDAR');
  return {text: lines.map(icsFold).join('\r\n')+'\r\n', count: ev.length};
}
function renderIcsCard(trip){
  const o = state.icsOpt || {trip:true, flights:true, activities:true, days:false, deadlines:false};
  const n = {flights:(trip.tickets||[]).filter(t=>t.date).length, activities:(trip.activityTickets||[]).filter(a=>a.date).length,
    days:(trip.dayPlan||[]).filter(d=>d.plan||d.ort).length, deadlines:world.deadlines.length};
  const opt = (k, label, count) => `<label class="ics-opt"><input type="checkbox" data-ics-opt="${k}" ${o[k]?'checked':''} ${count===0?'disabled':''}> ${label}${count!=null ? ` <span class="hint-text" style="margin:0;">(${count})</span>` : ''}</label>`;
  return `
    <div class="field-group bk-card" style="margin-top:14px;">
      <div class="bk-kicker" style="margin-bottom:8px;">In den Kalender übernehmen</div>
      ${opt('trip','Reisezeitraum')}
      ${opt('flights','Flüge mit Uhrzeit', n.flights)}
      ${opt('activities','Gebuchte Aktivitäten', n.activities)}
      ${opt('days','Tagesplan (ganztägig)', n.days)}
      ${opt('deadlines','Fristen aus „Welt“', n.deadlines)}
      <button type="button" class="btn btn-add" data-action="export-ics" style="width:100%;margin-top:10px;">${ICON.calendar} Kalenderdatei (.ics) erstellen</button>
      <p class="hint-text" style="margin:8px 0 0;">Öffnen importiert die Termine in Apple-, Google- oder Outlook-Kalender. Flüge erinnern 3 Stunden vorher.</p>
    </div>`;
}
async function exportTripIcs(){
  const trip = trips.find(t=>t.id===state.tripId);
  const o = state.icsOpt || {trip:true, flights:true, activities:true, days:false, deadlines:false};
  const {text, count} = buildTripIcs(trip, o);
  if(!count){ showToast('Keine Termine ausgewählt.'); return; }
  const name = (getTripDisplayName(trip).replace(/[^\wäöüÄÖÜß -]/g,'').trim().replace(/\s+/g,'-') || 'reise') + '.ics';
  const file = new File([text], name, {type:'text/calendar'});
  if(navigator.canShare && navigator.canShare({files:[file]}) && /iPhone|iPad|Android/i.test(navigator.userAgent)){
    try{ await navigator.share({files:[file], title:getTripDisplayName(trip)}); return; }catch(e){ if(e && e.name==='AbortError') return; }
  }
  const url = URL.createObjectURL(file);
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 500);
  showToast(`${count} Termin${count>1?'e':''} exportiert.`);
}

/* ---------- v2.0: Ideen & Planung – Moodboard, Angebote, Outfits, Mitbringsel ---------- */
const OFFER_KINDS = ['Unterkunft','Flug','Mietwagen','Pauschalreise','Aktivität','Sonstiges'];
const OFFER_BUDGET_CAT = {Unterkunft:'Unterkunft', Flug:'Flug', Mietwagen:'Mietwagen', Pauschalreise:'Unterkunft', 'Aktivität':'Aktivitäten', Sonstiges:'Sonstiges'};
const OUTFIT_OCCASIONS = ['Anreise','Strand','Wandern','Stadt','Abendessen','Ausflug','Rückreise'];
const NOTE_COLORS = ['var(--tip-bg)','var(--gt-bg)','var(--warn-bg)','var(--surface-alt)'];
function ensurePlanningFields(trip){
  ['moodboard','offers','outfits','souvenirs'].forEach(k=>{ if(!Array.isArray(trip[k])) trip[k] = []; });
  if(!trip.outfitPacked) trip.outfitPacked = {};
}
function splitOutfitItems(s){ return String(s||'').split(/[,\n;]+/).map(x=>x.trim()).filter(Boolean); }
function outfitAggregate(trip){
  const map = new Map();
  trip.outfits.forEach(o=>{
    const seen = new Set();
    splitOutfitItems(o.items).forEach(it=>{
      const k = it.toLowerCase();
      if(seen.has(k)) return; seen.add(k);
      const cur = map.get(k) || {text:it, count:0, people:new Set()};
      cur.count++; if(o.person) cur.people.add(o.person);
      map.set(k, cur);
    });
  });
  return [...map.entries()].map(([k,v])=>({key:k, text:v.text, count:v.count, people:[...v.people]})).sort((a,b)=>b.count-a.count || a.text.localeCompare(b.text,'de'));
}

function renderPlanungTab(trip){
  ensurePlanningFields(trip);
  const tab = state.planTab || 'moodboard';
  const tabs = [['moodboard','Moodboard',trip.moodboard.length],['angebote','Angebote',trip.offers.length],['outfits','Outfits',trip.outfits.length],['mitbringsel','Mitbringsel',trip.souvenirs.length]];
  let body = '';
  if(tab==='moodboard') body = renderMoodboard(trip);
  else if(tab==='angebote') body = renderOffers(trip);
  else if(tab==='outfits') body = renderOutfits(trip);
  else body = renderSouvenirs(trip);
  return `
    <div class="seg-tabs">${tabs.map(([k,l,n])=>`<button type="button" class="seg-tab ${tab===k?'active':''}" data-action="plan-tab" data-tab="${k}">${l}${n ? ` <span class="seg-n">${n}</span>` : ''}</button>`).join('')}</div>
    ${body}`;
}

async function onMoodboardFiles(files){

function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = function(e){
      const img = new Image();
      img.onload = function(){
        const maxDim = 1024;
        let w=img.width, h=img.height;
        if(w>maxDim || h>maxDim){
          if(w>h){ h=Math.round(h*maxDim/w); w=maxDim; } else { w=Math.round(w*maxDim/h); h=maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.72));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function onPhotoSelected(file){
  try{

    const photoId = genId();

async function deleteLightboxPhoto(){
  const id = state.lightboxPhotoId;
  const ctx = state.lightboxContext || {type:'gallery'};
  if(ctx.type==='ticket'){
    const trip = trips.find(t=>t.id===state.tripId);
    const ticket = trip[ctx.listKey].find(x=>x.id===ctx.ticketId);
    if(ticket) ticket.photoId = null;
    await saveTrips();
  } else if(ctx.type==='recipe'){
    const recipe = recipes.find(r=>r.id===ctx.recipeId);
    if(recipe) recipe.photoId = null;
    await sSet('recipes', recipes);
  } else if(ctx.type==='tripdoc'){
    const trip = trips.find(t=>t.id===state.tripId);
    const doc = trip.documents.find(d=>d.id===ctx.docId);
    if(doc) doc.fileId = null;
    await saveTrips();
  } else {
    const trip = trips.find(t=>t.id===state.tripId);
    trip.photoIds = trip.photoIds.filter(pid=>pid!==id);
    if(trip.photoDayAssignments) delete trip.photoDayAssignments[id];
    await saveTrips();

  await sDelete('photo:'+id);
  delete photoCache[id];
  state.lightboxPhotoId=null;

/* ---------- Guide tab ---------- */
function renderGuideCalloutText(text){
  if(!text) return '<span class="hint-text">Noch nichts eingetragen.</span>';
  const CALLOUT_META = {
    tipp: {cls:'callout-tipp', icon:'💡', label:'Tipp'},
    geheimtipp: {cls:'callout-geheimtipp', icon:'🤫', label:'Geheimtipp'},
    achtung: {cls:'callout-achtung', icon:'⚠️', label:'Achtung'}
  };
  const blocks = text.split(/\n\s*\n/);
  const out = [];
  let i = 0;
  while(i < blocks.length){
    const block = blocks[i];
    const trimmedBlock = block.trim();
    if(!trimmedBlock){ i++; continue; }
    if(trimmedBlock.startsWith('###SUBHEAD###')){
      out.push(`<div class="guide-subhead">${escapeHtml(trimmedBlock.slice('###SUBHEAD###'.length))}</div>`);
      i++; continue;
    }
    if(trimmedBlock.startsWith('###TABLE###')){
      try{
        const rows = JSON.parse(trimmedBlock.slice('###TABLE###'.length));
        const rowsHtml = rows.map((row,ri)=>
          `<tr>${row.map(cell=>`<${ri===0?'th':'td'}>${escapeHtml(cell)}</${ri===0?'th':'td'}>`).join('')}</tr>`
        ).join('');
        out.push(`<div class="guide-table-wrap"><table class="guide-table">${rowsHtml}</table></div>`);
      }catch(e){}
      i++; continue;
    }
    // Standalone label paragraph, e.g. "💡 TIPP" alone, with the text following in the next paragraph
    const bareLabel = trimmedBlock.replace(/[^\p{L}]/gu,'').toLowerCase();
    if(CALLOUT_META[bareLabel]){
      const meta = CALLOUT_META[bareLabel];
      const nextText = blocks[i+1] ? blocks[i+1].trim() : '';
      out.push(`<div class="callout ${meta.cls}"><strong>${meta.icon} ${meta.label}</strong><br>${renderBoldMarkers(escapeHtml(nextText)).replace(/\n/g,'<br>')}</div>`);
      i += nextText ? 2 : 1;
      continue;
    }
    // Backward-compatible inline form: "Tipp: text" on one line
    let m = trimmedBlock.match(/^(geheimtipp|tipp|achtung)\s*:\s*([\s\S]*)/i);
    if(m){
      const meta = CALLOUT_META[m[1].toLowerCase()];
      out.push(`<div class="callout ${meta.cls}"><strong>${meta.icon} ${meta.label}</strong><br>${renderBoldMarkers(escapeHtml(m[2]))}</div>`);
      i++; continue;
    }
    const h4 = trimmedBlock.match(/^\*\*([^*\n]{1,60})\*\*$/);
    if(h4){ out.push(`<div class="guide-subhead2">${escapeHtml(h4[1].replace(/:$/,''))}</div>`); i++; continue; }
    const lines = block.split('\n');
    const rendered = [];
    let listBuf = [];
    let listType = null;
    function flushList(){
      if(listBuf.length){
        const tag = listType==='ol' ? 'ol' : 'ul';
        const cls = listType==='ol' ? 'recipe-list recipe-list-numbered' : 'recipe-list';
        rendered.push(`<${tag} class="${cls}">${listBuf.map(t=>`<li>${renderBoldMarkers(escapeHtml(t))}</li>`).join('')}</${tag}>`);
      }
      listBuf = []; listType = null;
    }
    lines.forEach(line=>{
      const t = line.trim();
      if(!t){ flushList(); rendered.push('<br>'); return; }
      let bm = t.match(/^•\s*(.*)$/);
      if(bm){
        if(listType!=='ul'){ flushList(); listType='ul'; }
        listBuf.push(bm[1]);
        return;
      }
      bm = t.match(/^\d+\.\s+(.*)$/);
      if(bm){
        if(listType!=='ol'){ flushList(); listType='ol'; }
        listBuf.push(bm[1]);
        return;
      }
      flushList();
      rendered.push(`<div>${renderBoldMarkers(escapeHtml(line))}</div>`);
    });
    flushList();
    out.push(`<div class="gp">${rendered.join('')}</div>`);
    i++;
  }
  return out.join('');
}
function renderBoldMarkers(escapedText){
  return escapedText.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

const GUIDE_ICONS = {atAGlance:'lightbulb', understanding:'city', bestTime:'cloudSun', entryHealth:'idCard', arrival:'ship',
  gettingAround:'car', accommodation:'suitcase', regions:'map', highlights:'camera', hiking:'hiking', foodDrink:'utensils',
  budgetInfo:'wallet', natureSafety:'umbrellaBeach', tips:'listCheck', overview:'file'};
function guideChapters(dd){
  return GUIDE_FIELDS.filter(([k])=>{
    const v = (dd.guide[k]||'').trim();
    if((k==='atAGlance' || k==='hiking' || k==='overview') && !v && state.editingGuideField!==k) return false;
    return true;
  });
}
function splitGuideSections(text){
  const intro = [], secs = [];
  (text||'').split(/\n\s*\n/).forEach(bl=>{
    const t = bl.trim(); if(!t) return;
    if(t.startsWith('###SUBHEAD###')){ secs.push({title:t.slice(13).trim(), blocks:[]}); return; }
    if(secs.length) secs[secs.length-1].blocks.push(bl); else intro.push(bl);
  });
  return {intro:intro.join('\n\n'), secs:secs.map(x=>({title:x.title, text:x.blocks.join('\n\n')}))};
}
function guideReadMinutes(text){
  const words = (text||'').replace(/###\w+###/g,' ').replace(/[{}\[\]",]/g,' ').split(/\s+/).filter(Boolean).length;
  return Math.max(1, Math.round(words/200));
}
function guideChapterInfo(dd, key, value){
  if(!value.trim()) return 'noch leer';
  if(key==='regions'){
    const n = splitGuideSections(value).secs.filter(x=>!/kombinieren/i.test(x.title)).length;
    const p = (dd.pois||[]).length;
    return `${n} Region${n===1?'':'en'}${p ? ` · ${p} Orte` : ''}`;
  }
  return `${guideReadMinutes(value)} Min. Lesezeit`;
}
const POI_TYP_LABEL = {sehenswuerdigkeit:'Sehenswürdigkeit', strand:'Strand', kloster:'Kloster', ort:'Ort', natur:'Natur', museum:'Museum', aussicht:'Aussichtspunkt', wanderung:'Wanderung', hoehle:'Höhle', schlucht:'Schlucht', kirche:'Kirche', burg:'Burg', festung:'Festung', markt:'Markt', restaurant:'Restaurant', lokal:'Lokal', insel:'Insel', see:'See', wasserfall:'Wasserfall', park:'Park'};
function poiTypLabel(t){ const k = (t||'').toLowerCase(); return POI_TYP_LABEL[k] || (k ? k.charAt(0).toUpperCase()+k.slice(1) : ''); }
function guideMapsUrl(p){ return `https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}`; }
function renderGuidePoiCard(p){
  const meta = [p.dauer, p.eintritt, p.saison].filter(Boolean).map(escapeHtml).join(' · ');
  return `<div class="gpoi">
    <div class="gpoi-head">

        ${p.typ ? `<div class="gpoi-typ">${escapeHtml(poiTypLabel(p.typ))}${p.geheimtipp ? ' · <span class="gpoi-gt">🤫 Geheimtipp</span>' : ''}</div>` : (p.geheimtipp ? `<div class="gpoi-typ"><span class="gpoi-gt">🤫 Geheimtipp</span></div>` : '')}
      </div>
    </div>
    ${meta ? `<div class="gpoi-meta">${meta}</div>` : ''}
    ${p.desc ? `<div class="gpoi-desc">${renderBoldMarkers(escapeHtml(p.desc))}</div>` : ''}
    <a class="btn gpoi-btn" href="${guideMapsUrl(p)}" target="_blank" rel="noopener">${ICON.map} Route in Google Maps</a>
  </div>`;

function renderRegionSection(dd, sec){
  const regionName = sec.title.split(' — ')[0].trim();
  const pois = (dd.pois||[]).filter(p=>p.region===regionName).sort((a,b)=>(a.nr||0)-(b.nr||0));
  if(!pois.length) return renderGuideCalloutText(sec.text);
  const names = new Set(pois.map(p=>p.name));
  const blocks = sec.text.split(/\n\s*\n/);
  const kept = []; let insertAt = -1;
  blocks.forEach(bl=>{
    const m = bl.trim().match(/^\*\*(?:[①-⑳]\s*)?(.+?)\*\*/);
    if(m && names.has(m[1].trim())){ if(insertAt<0) insertAt = kept.length; return; }
    kept.push(bl);
  });
  if(insertAt<0) insertAt = kept.length;
  const before = kept.slice(0, insertAt).join('\n\n'), after = kept.slice(insertAt).join('\n\n');
  const cards = `<div class="gpoi-list">${pois.map(renderGuidePoiCard).join('')}</div>`;
  return (before.trim() ? renderGuideCalloutText(before) : '') + cards + (after.trim() ? renderGuideCalloutText(after) : '');
}
function renderGuideChapter(dd, key){
  const chs = guideChapters(dd);
  const idx = chs.findIndex(c=>c[0]===key);
  const label = chs[idx][1];
  const value = dd.guide[key] || '';
  const prev = chs[idx-1], next = chs[idx+1];
  const top = `<div class="gch-top">
      <button type="button" class="gch-back" data-action="close-guide-chapter">‹ Alle Kapitel</button>
      <span class="gch-count">Kapitel ${idx+1} von ${chs.length}</span>
    </div>
    <div class="gch-title"><span class="gch-icon">${ICON[GUIDE_ICONS[key]] || ICON.file}</span><h2>${label}</h2></div>`;
  const nav = `<div class="gch-nav">
      ${prev ? `<button type="button" class="gch-nav-btn" data-action="open-guide-chapter" data-field="${prev[0]}"><small>Zurück</small>‹ ${prev[1]}</button>` : '<span></span>'}
      ${next ? `<button type="button" class="gch-nav-btn gch-next" data-action="open-guide-chapter" data-field="${next[0]}"><small>Weiter</small>${next[1]} ›</button>` : `<button type="button" class="gch-nav-btn gch-next" data-action="close-guide-chapter"><small>Fertig</small>Alle Kapitel ›</button>`}
    </div>`;
  if(state.editingGuideField===key){
    return `${top}
      <textarea class="textarea gch-edit" id="ta-${key}" data-guide-field="${key}">${escapeHtml(value)}</textarea>
      <button type="button" class="btn btn-add" data-action="close-edit-guide-field" style="margin-top:8px;">Fertig</button>`;
  }
  const {intro, secs} = splitGuideSections(value);
  const open = state.guideOpenSecs || [];
  let body = '';
  if(!value.trim()){
    body = '<p class="empty-state">Dieses Kapitel ist noch leer.</p>';
  } else if(!secs.length){
    body = `<div class="gch-sec-body gch-plain">${renderGuideCalloutText(intro)}</div>`;
  } else {
    const chips = secs.length > 1 ? `<div class="gch-chips">${secs.map((x,i)=>`<button type="button" class="gch-chip" data-action="guide-jump" data-idx="${i}">${escapeHtml(x.title.split(' — ')[0])}</button>`).join('')}</div>` : '';
    const lead = intro.trim() ? `<div class="gch-lead"><div class="gch-lead-k">Kurz gesagt</div>${renderGuideCalloutText(intro)}</div>` : '';
    const allOpen = secs.every((x,i)=>open.includes(i));
    const cards = secs.map((x,i)=>{
      const isOpen = open.includes(i);
      const parts = x.title.split(' — ');
      const sub = key==='regions' ? (()=>{ const n = (dd.pois||[]).filter(p=>p.region===parts[0].trim()).length; return [parts[1], n ? n+' Orte' : ''].filter(Boolean).join(' · '); })() : (parts[1]||'');
      return `<div class="gch-sec ${isOpen?'open':''}" id="gsec-${i}">
        <button type="button" class="gch-sec-head" data-action="toggle-guide-sec" data-idx="${i}">
          <span><b>${escapeHtml(parts[0])}</b>${sub ? `<small>${escapeHtml(sub)}</small>` : ''}</span>
          <span class="gch-caret">${isOpen ? '▾' : '▸'}</span>
        </button>
        ${isOpen ? `<div class="gch-sec-body">${key==='regions' ? renderRegionSection(dd, x) : (x.text.trim() ? renderGuideCalloutText(x.text) : '')}</div>` : ''}
      </div>`;
    }).join('');
    body = `${chips}${lead}
      <div class="gch-tools"><button type="button" class="gch-link" data-action="guide-open-all">${allOpen ? 'Alle zuklappen' : 'Alle aufklappen'}</button></div>
      ${cards}`;
  }
  return `${top}${body}${nav}
    <button type="button" class="btn gch-editbtn" data-action="edit-guide-field" data-field="${key}">${ICON.pen} Kapitel bearbeiten</button>`;
}

async function discoverNearby(){
  const resultsEl = document.getElementById('nearby-results');
  if(!resultsEl) return;
  const dest = getCurrentDest();
  const center = state.userLocation || {lat:dest.lat, lng:dest.lng};
  resultsEl.innerHTML = '<p class="hint-text">Suche in der Nähe…</p>';
  try{
    const radius = 5000;
    const query = `[out:json][timeout:15];(node["tourism"="attraction"](around:${radius},${center.lat},${center.lng});node["amenity"="restaurant"](around:${radius},${center.lat},${center.lng});node["tourism"="viewpoint"](around:${radius},${center.lat},${center.lng}););out body 15;`;
    const url = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('failed');
    const data = await res.json();
    const items = (data.elements||[]).filter(el=>el.tags && el.tags.name);
    if(!items.length){ resultsEl.innerHTML = '<p class="hint-text">Nichts in der Nähe gefunden.</p>'; return; }
    resultsEl.innerHTML = items.slice(0,15).map(el=>{
      const category = el.tags.amenity==='restaurant' ? '🍴' : (el.tags.tourism==='viewpoint' ? '🌄' : ICON.locationDot);
      return `<div class="poi-search-result">
        <div class="poi-search-name">${category} ${escapeHtml(el.tags.name)}</div>
        <button type="button" class="btn btn-add" data-action="add-searched-poi" data-lat="${el.lat}" data-lon="${el.lon}" data-name="${escapeHtml(el.tags.name)}" style="padding:6px 12px;font-size:12px;">+ Hinzufügen</button>
      </div>`;
    }).join('');
  }catch(e){
    resultsEl.innerHTML = '<p class="hint-text">Suche fehlgeschlagen (Dienst gerade nicht erreichbar).</p>';
  }
}
async function locateMe(){
  if(!navigator.geolocation){
    showToast('Standortbestimmung wird von diesem Browser nicht unterstützt.');
    return;
  }
  showToast('Suche deinen Standort…');
  try{
    const pos = await new Promise((resolve,reject)=>{
      navigator.geolocation.getCurrentPosition(resolve, reject, {enableHighAccuracy:true, timeout:10000});
    });
    state.userLocation = {lat: pos.coords.latitude, lng: pos.coords.longitude};
    showToast('Standort gefunden.');
    render();
  }catch(err){
    showToast('Standort nicht verfügbar (Berechtigung verweigert oder in dieser Umgebung nicht unterstützt).');
  }
}
async function showRouteTo(poiId){
  if(!state.userLocation){ showToast('Bitte zuerst deinen Standort abrufen.'); return; }
  const dd = destDataCache[state.destId];
  const poi = dd.pois.find(p=>p.id===poiId);
  if(!poi) return;
  showToast('Route wird berechnet…');
  try{
    const url = `https://router.project-osrm.org/route/v1/driving/${state.userLocation.lng},${state.userLocation.lat};${poi.lng},${poi.lat}?overview=full&geometries=geojson`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('route failed');
    const data = await res.json();
    if(!data.routes || !data.routes.length) throw new Error('no route');
    const route = data.routes[0];
    state.currentRoute = {
      coords: route.geometry.coordinates.map(c=>[c[1],c[0]]),
      distanceKm: (route.distance/1000).toFixed(1),
      durationMin: Math.round(route.duration/60)
    };
    render();
  }catch(e){
    showToast('Route konnte nicht berechnet werden (evtl. keine Verbindung zum Routendienst).');
  }
}
function parseCsvLine(line){
  const result = [];
  let cur = '', inQuotes = false;
  for(let i=0;i<line.length;i++){
    const ch = line[i];
    if(inQuotes){
      if(ch==='"'){
        if(line[i+1]==='"'){ cur+='"'; i++; } else { inQuotes=false; }
      } else { cur+=ch; }
    } else {
      if(ch==='"'){ inQuotes=true; }
      else if(ch===','){ result.push(cur); cur=''; }
      else { cur+=ch; }
    }
  }
  result.push(cur);
  return result.map(s=>s.trim());
}
async function onPoiCsvSelected(file){
  try{
    const text = await file.text();
    const lines = text.split(/\r\n|\n|\r/).filter(l=>l.trim().length);
    if(!lines.length){ showToast('Die Datei enthält keine Zeilen.'); return; }
    const firstRow = parseCsvLine(lines[0]);
    const looksLikeHeader = firstRow.length<2 || isNaN(parseFloat(firstRow[1])) || isNaN(parseFloat(firstRow[2]));
    const startIdx = looksLikeHeader ? 1 : 0;
    const dd = destDataCache[state.destId];
    let added = 0, skipped = 0;
    for(let i=startIdx;i<lines.length;i++){
      const cols = parseCsvLine(lines[i]);
      if(cols.length<3){ skipped++; continue; }
      const name = cols[0];
      const lat = parseFloat(cols[1]);
      const lng = parseFloat(cols[2]);
      const region = cols[3] || '';
      const desc = cols[4] || '';
      const geheimtipp = cols[5] ? /^(ja|true|1|yes)$/i.test(cols[5].trim()) : false;
      if(!name || isNaN(lat) || isNaN(lng)){ skipped++; continue; }
      dd.pois.push({id:genId(), name, lat, lng, region, desc, geheimtipp});
      added++;
    }
    await saveDestData(state.destId);
    render();
    showToast(`${added} Orte hinzugefügt${skipped? ', '+skipped+' Zeile(n) übersprungen':''}.`);
  }catch(e){ showToast('CSV-Datei konnte nicht gelesen werden.'); }
}
function initMap(dest, dd){
  const container = document.getElementById('leaflet-map');
  if(!container) return;
  if(typeof L === 'undefined'){
    container.innerHTML = '<p class="empty-state">Karte konnte nicht geladen werden (kein Zugriff auf den Kartendienst).</p>';
    return;
  }
  try{
    if(leafletMap){ leafletMap.remove(); leafletMap=null; }
    delete L.Icon.Default.prototype._getIconUrl;
    L.Icon.Default.mergeOptions({
      iconRetinaUrl:'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-icon-2x.png',
      iconUrl:'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-icon.png',
      shadowUrl:'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png'
    });
    leafletMap = L.map(container).setView([dest.lat, dest.lng], 9);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom:18, attribution:'&copy; OpenStreetMap-Mitwirkende'
    }).addTo(leafletMap);
    const markers = [];
    dd.pois.forEach(p=>{
      const m = L.marker([p.lat,p.lng]).addTo(leafletMap);
      const regionLine = p.region? `<br><em>${escapeHtml(p.region)}</em>` : '';
      const tipLine = p.geheimtipp? '<br>🤫 Geheimtipp' : '';
      m.bindPopup(`<strong>${escapeHtml(p.name)}</strong>${regionLine}${tipLine}<br>${escapeHtml(p.desc||'')}`);
      markers.push(m);
    });
    if(state.userLocation){
      const um = L.circleMarker([state.userLocation.lat, state.userLocation.lng], {
        radius:8, color:'#3F9C97', fillColor:'#3F9C97', fillOpacity:0.9, weight:2
      }).addTo(leafletMap).bindPopup(`${ICON.locationDot} Dein Standort`);
      markers.push(um);
    }
    const boundsLayers = [...markers];
    if(state.currentRoute && state.currentRoute.coords.length){
      const line = L.polyline(state.currentRoute.coords, {color:'#C99A3E', weight:4, opacity:0.85}).addTo(leafletMap);
      boundsLayers.push(line);
    }
    if(boundsLayers.length){
      leafletMap.fitBounds(L.featureGroup(boundsLayers).getBounds().pad(0.3));
    }
    leafletMap.on('click', e=> showPendingPoiForm(e.latlng.lat, e.latlng.lng));
  }catch(err){
    container.innerHTML = '<p class="empty-state">Karte konnte nicht geladen werden.</p>';
  }
}

function parseRouteMeta(r){
  const m = (r.title||'').match(/^(Route\s*\d+)\s*[:–-]\s*(.+?)\s*(?:\(([^)]+)\))?\s*$/i);
  const kicker = m ? m[1] : '';
  const name = m ? m[2] : (r.title||'');
  const nDays = (r.days||[]).reduce((sum,d)=>{ const x = (d.label||'').match(/Tag\s*(\d+)\s*[–-]\s*(\d+)/); return sum + (x ? (parseInt(x[2],10)-parseInt(x[1],10)+1) : 1); }, 0);
  const daysLabel = m && m[3] ? m[3] : (nDays ? nDays+' Tage' : '');
  let budget = '', intro = [];
  (r.text||'').split(/\n\s*\n/).forEach(par=>{
    const bm = par.match(/^\s*Budget:\s*(.+)$/is);
    if(bm && !budget) budget = bm[1].replace(/\s*\(.*$/s,'').replace(/\.\s*$/,'').trim();
    else if(par.trim()) intro.push(par);
  });
  const nights = [];
  (r.days||[]).forEach(d=>{ const o = parseRouteDay(d).overnight; if(o && o!=='–' && !nights.includes(o)) nights.push(o); });
  return {kicker, name, daysLabel, budget, intro:intro.join('\n\n'), nights};
}
function parseRouteDay(d){
  const lm = (d.label||'').match(/^(Tag\s*[\d–-]+)\s*[:–-]?\s*(.*)$/i);
  const num = lm ? lm[1] : '';
  const title = lm ? (lm[2]||'') : (d.label||'');
  let overnight = '', stops = [], text = [];
  (d.text||'').split(/\n\s*\n/).forEach(par=>{
    const om = par.match(/^\s*Übernachtung:\s*([^·\n]*)(?:·\s*Stationen:\s*(.*))?$/is);
    if(om){ overnight = om[1].trim(); if(om[2]) stops = om[2].split(',').map(x=>x.trim()).filter(Boolean); }
    else if(par.trim()) text.push(par);
  });
  return {num, title, overnight, stops, text:text.join('\n\n')};
}
function routeDayMapsUrl(dd, stops){
  const pts = stops.map(n=>(dd.pois||[]).find(p=>p.name===n)).filter(Boolean);
  if(!pts.length) return '';
  if(pts.length===1) return `https://www.google.com/maps/dir/?api=1&destination=${pts[0].lat},${pts[0].lng}`;
  return 'https://www.google.com/maps/dir/' + pts.map(p=>`${(+p.lat).toFixed(5)},${(+p.lng).toFixed(5)}`).join('/');
}

    ${addForm}`;
