/* ---------- Guide-Datei-Import (.docx) ---------- */
const CHAPTER_FIELD_MAP = [
  {pattern:/willkommen.*wie sie diesen guide nutzen/i, field:null},
  {pattern:/verstehen/i, field:'understanding'},
  {pattern:/beste reisezeit/i, field:'bestTime'},
  {pattern:/einreise.*formalit.*gesundheit/i, field:'entryHealth'},
  {pattern:/^anreise\b/i, field:'arrival'},
  {pattern:/fortbewegung vor ort/i, field:'arrival'},
  {pattern:/^unterkunft\b/i, field:'accommodation'},
  {pattern:/regionen im überblick/i, field:'regions'},
  {pattern:/fertige routen/i, field:'ROUTES'},
  {pattern:/top-erlebnisse/i, field:'regions'},
  {pattern:/essen.*trinken/i, field:'RECIPES'},
  {pattern:/budget.*kosten/i, field:'tips'},
  {pattern:/packliste/i, field:'PACKING'},
  {pattern:/praktisches a.z/i, field:'tips'},
  {pattern:/natur.*sicherheit.*wanderregeln/i, field:'natureSafety'},
  {pattern:/checklisten/i, field:'BUCKETLIST'},
  {pattern:/häufig gestellte fragen/i, field:'FAQ'},
  {pattern:/zum schluss/i, field:null},
  {pattern:/mein reisetagebuch/i, field:null}
];
function findChapterField(headingText){
  for(const rule of CHAPTER_FIELD_MAP){
    if(rule.pattern.test(headingText)) return rule.field;
  }
  return 'overview';
}
function getSubHeadingText(node){
  if(node.tagName==='H2' || node.tagName==='H3' || node.tagName==='H4') return node.textContent.trim();
  if(node.tagName==='P'){
    const strong = node.querySelector('strong, b');
    if(strong){
      const fullText = node.textContent.trim();
      const strongText = strong.textContent.trim();
      if(strongText.length>0 && strongText.length===fullText.length && strongText.length<150) return strongText;
    }
  }
  return null;
}
async function onGuideFileSelected(file){
  if(typeof mammoth === 'undefined'){
    showToast('Der Datei-Import-Dienst konnte nicht geladen werden (keine Internetverbindung).');
    return;
  }
  try{
    const arrayBuffer = await file.arrayBuffer();
    const result = await mammoth.convertToHtml({arrayBuffer});
    const html = result.value;
    if(!html.trim()){ showToast('Aus dieser Datei konnte kein Text extrahiert werden.'); return; }

    const doc = new DOMParser().parseFromString(html, 'text/html');
    const nodes = [...doc.body.children];
    const dd = destDataCache[state.destId];
    const fieldBuckets = {understanding:[], overview:[], bestTime:[], entryHealth:[], arrival:[], accommodation:[], regions:[], foodDrink:[], natureSafety:[], tips:[]};
    const listBuckets = {BUCKETLIST:[], PACKING:[]};
    let currentMode = null; // 'field' | 'ROUTES' | 'FAQ' | 'BUCKETLIST' | 'PACKING' | 'RECIPES' | null
    let currentField = null;
    let inChapter2 = false;
    let inRecipeSection = false;
    let inSpracheSubsection = false;
    let subBuffer = null;
    let recipeBuffer = null;
    let anyImported = false;
    const dest = getCurrentDest();

    function flushSub(){
      if(subBuffer){
        if(currentMode==='ROUTES'){
          const descText = (subBuffer.descLines||[]).join('\n').trim();
          const days = (subBuffer.days||[]).map(d=>({label:d.label, place:d.place||'', text:d.lines.join('\n').trim()})).filter(d=>d.text);
          if(/^route\s*\d+/i.test(subBuffer.title)){
            if(descText || days.length){
              dd.routes.push({id:genId(), title:subBuffer.title, text:descText, days});
              anyImported = true;
            }
          } else {
            const combined = [descText, ...days.map(d=>d.label+'\n'+d.text)].filter(Boolean).join('\n\n');
            if(combined){
              fieldBuckets.overview.push(subBuffer.title ? subBuffer.title+'\n'+combined : combined);
              anyImported = true;
            }
          }
        } else if(currentMode==='FAQ'){
          const text = subBuffer.lines.join('\n').trim();
          if(text){
            const question = subBuffer.title||'Frage';
            const dup = dd.faq.some(f=>f.question.trim().toLowerCase()===question.trim().toLowerCase());
            if(!dup){ dd.faq.push({id:genId(), question, answer:text}); anyImported = true; }
          }
        }
      }
      subBuffer = null;
    }
    function flushRecipeBuffer(){
      if(recipeBuffer){
        const blockText = recipeBuffer.title + '\n' + recipeBuffer.lines.join('\n');
        const parsed = parseRecipeText(blockText);
        if(parsed.ingredients || parsed.steps){
          recipes.push({
            id:genId(), destId: dest.id, category:'Sonstiges',
            nameNative: parsed.nameNative || recipeBuffer.title, nameGerman: parsed.nameGerman||'',
            servings: parsed.servings||'', time: parsed.time||'',
            ingredients: parsed.ingredients||'', steps: parsed.steps||''
          });
          anyImported = true;
        } else {
          fieldBuckets.foodDrink.push(blockText);
        }
      }
      recipeBuffer = null;
    }

    for(const node of nodes){
      if(node.tagName==='H1'){
        if(currentMode==='ROUTES' || currentMode==='FAQ') flushSub();
        if(currentMode==='RECIPES') flushRecipeBuffer();
        const headingText = node.textContent.trim();
        inChapter2 = /verstehen/i.test(headingText);
        inRecipeSection = false;
        inSpracheSubsection = false;
        const field = findChapterField(headingText);
        currentMode = null; currentField = null;
        if(field==='ROUTES' || field==='FAQ' || field==='BUCKETLIST' || field==='PACKING' || field==='RECIPES'){ currentMode = field; }
        else if(field!==null){ currentMode = 'field'; currentField = field; }
        continue;
      }
      if(currentMode==='RECIPES'){
        const subHeading = getSubHeadingText(node);
        if(subHeading && /^zum nachkochen/i.test(subHeading)){
          inRecipeSection = true;
        } else if(inRecipeSection && subHeading){
          flushRecipeBuffer();
          recipeBuffer = {title:subHeading, lines:[]};
        } else {
          const t = node.textContent.trim();
          if(t){
            if(inRecipeSection && recipeBuffer){ recipeBuffer.lines.push(t); }
            else if(!inRecipeSection){ fieldBuckets.foodDrink.push(t); }
          }
        }
      } else if(currentMode==='ROUTES'){
        const subHeading = getSubHeadingText(node);
        if(subHeading && /^route\s*\d+/i.test(subHeading)){
          flushSub();
          subBuffer = {title:subHeading, descLines:[], days:[], currentDay:null};
        } else if(subHeading && /^tag\s*\d+/i.test(subHeading)){
          if(!subBuffer) subBuffer = {title:'', descLines:[], days:[], currentDay:null};
          const m = subHeading.match(/^(tag\s*\d+)\s*:?\s*(.*)/i);
          const dayObj = {label: m ? m[1].trim() : subHeading, place: m && m[2] ? m[2].trim() : '', lines:[]};
          subBuffer.days.push(dayObj);
          subBuffer.currentDay = dayObj;
        } else if(subHeading){
          flushSub();
          subBuffer = {title:subHeading, descLines:[], days:[], currentDay:null};
        } else {
          const t = node.textContent.trim();
          if(t){
            if(!subBuffer) subBuffer = {title:'', descLines:[], days:[], currentDay:null};
            if(subBuffer.currentDay){ subBuffer.currentDay.lines.push(t); }
            else { subBuffer.descLines.push(t); }
          }
        }
      } else if(currentMode==='FAQ'){
        const t = node.textContent.trim();
        if(t){
          const fMatch = t.match(/^F\s*:\s*(.+)/i) || t.match(/^Frage\s*:\s*(.+)/i);
          if(fMatch){
            flushSub();
            subBuffer = {title:fMatch[1].trim(), lines:[]};
          } else if(subBuffer){
            subBuffer.lines.push(t.replace(/^A\s*:\s*/i,'').replace(/^Antwort\s*:\s*/i,''));
          } else {
            fieldBuckets.overview.push(t);
            anyImported = true;
          }
        }
      } else if(currentMode==='BUCKETLIST' || currentMode==='PACKING'){
        if(node.tagName==='UL' || node.tagName==='OL'){
          [...node.querySelectorAll('li')].forEach(li=>{
            const t = li.textContent.trim();
            if(t) listBuckets[currentMode].push(t);
          });
        } else {
          let t = node.textContent.trim();
          t = t.replace(/^[•\-\*▪]\s*/, '').replace(/^\d+[\.\)]\s*/, '');
          if(t) listBuckets[currentMode].push(t);
        }
      } else if(currentMode==='field' && currentField){
        if(inChapter2){
          const subHeading = getSubHeadingText(node);
          if(subHeading){
            inSpracheSubsection = /^sprache\b/i.test(subHeading);
            if(inSpracheSubsection) continue;
          }
          if(inSpracheSubsection && node.tagName==='TABLE'){
            [...node.querySelectorAll('tr')].forEach(tr=>{
              const cells = [...tr.querySelectorAll('td,th')];
              let local = '', german = '';
              if(cells.length>=3){ local = cells[0].textContent.trim(); german = cells[2].textContent.trim(); }
              else if(cells.length===2){ local = cells[0].textContent.trim(); german = cells[1].textContent.trim(); }
              if(german && local && !/^deutsch$/i.test(german) && !/^fremdsprache$/i.test(local)){
                const dup = dd.phrases.some(p=>p.local.toLowerCase()===local.toLowerCase() && p.german.toLowerCase()===german.toLowerCase());
                if(!dup){ dd.phrases.push({id:genId(), german, local}); anyImported = true; }
              }
            });
            continue;
          }
        }
        if(node.tagName==='TABLE'){
          const rows = [...node.querySelectorAll('tr')].map(tr=>
            [...tr.querySelectorAll('td,th')].map(c=>c.textContent.trim())
          ).filter(r=>r.some(c=>c));
          if(rows.length){
            fieldBuckets[currentField].push('###TABLE###'+JSON.stringify(rows));
            anyImported = true;
          }
          continue;
        }
        const subHeading = getSubHeadingText(node);
        if(subHeading){
          fieldBuckets[currentField].push('###SUBHEAD###'+subHeading);
          anyImported = true;
          continue;
        }
        const t = node.textContent.trim();
        if(t){ fieldBuckets[currentField].push(t); anyImported = true; }
      }
    }
    if(currentMode==='ROUTES' || currentMode==='FAQ') flushSub();
    if(currentMode==='RECIPES') flushRecipeBuffer();

    Object.keys(fieldBuckets).forEach(field=>{
      if(fieldBuckets[field].length){
        const newText = fieldBuckets[field].join('\n\n');
        dd.guide[field] = dd.guide[field] ? dd.guide[field]+'\n\n'+newText : newText;
      }
    });
    listBuckets.BUCKETLIST.forEach(text=>{ dd.bucketlist.push({id:genId(), text, checked:false}); });
    listBuckets.PACKING.forEach(text=>{ dd.packing.push({id:genId(), text, checked:false}); });
    if(listBuckets.BUCKETLIST.length || listBuckets.PACKING.length) anyImported = true;

    dd.guide.imported = false;
    dd.guide.importedFileName = file.name;
    await saveDestData(state.destId);
    await sSet('recipes', recipes);
    render();
    showToast(anyImported ? 'Reiseführer eingelesen und auf die Reiter verteilt – bitte prüfen.' : 'Es konnte nichts eindeutig zugeordnet werden – bitte manuell prüfen.');
  }catch(e){
    showToast('Datei konnte nicht gelesen werden. Bitte eine .docx-Datei verwenden.');
  }
}

async function locateMeForWeather(){
  if(!navigator.geolocation){
    showToast('Standortbestimmung wird von diesem Browser nicht unterstützt.');
    return;
  }
  showToast('Suche deinen Standort…');
  try{
    const pos = await new Promise((resolve,reject)=>{
      navigator.geolocation.getCurrentPosition(resolve, reject, {enableHighAccuracy:true, timeout:10000});
    });
    const lat = pos.coords.latitude, lng = pos.coords.longitude;
    let name = 'Mein Standort';
    try{
      const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
      if(res.ok){
        const data = await res.json();
        const a = data.address || {};
        name = a.city || a.town || a.village || a.municipality || (data.display_name? data.display_name.split(',')[0] : name);
      }
    }catch(e){}
    await loadWeather(lat, lng, name);
  }catch(err){
    showToast('Standort nicht verfügbar (Berechtigung verweigert oder in dieser Umgebung nicht unterstützt).');
  }
}

async function computeBudgetGrandTotal(trip){
  const el = document.getElementById('budget-grand-total-value');
  if(!el) return;
  const targetSel = document.getElementById('budget-total-currency');
  const target = targetSel ? targetSel.value : 'EUR';
  const CVE_PER_EUR = 110.265;
  el.textContent = 'Rechne…';
  try{
    const totals = {};
    trip.budget.forEach(b=>{ totals[b.currency]=(totals[b.currency]||0)+Number(b.amount); });
    let grandTotalEur = 0;
    for(const [cur,sum] of Object.entries(totals)){
      if(cur==='EUR') grandTotalEur += sum;
      else if(cur==='CVE') grandTotalEur += sum/CVE_PER_EUR;
      else { const rate = await fetchRate(cur,'EUR'); grandTotalEur += sum*rate; }
    }
    let result = grandTotalEur;
    if(target==='CVE') result = grandTotalEur*CVE_PER_EUR;
    else if(target!=='EUR'){ const rate2 = await fetchRate('EUR', target); result = grandTotalEur*rate2; }
    el.textContent = `${result.toFixed(2)} ${target}`;
  }catch(e){
    el.textContent = 'nicht verfügbar';
  }
}
async function fetchRate(base, symbol){
  const r = await fetch(`https://api.frankfurter.dev/v1/latest?base=${base}&symbols=${symbol}`);
  if(!r.ok) throw new Error('rate fetch failed');
  const j = await r.json();
  return j.rates[symbol];
}
async function doConvertCurrency(){
  const amount = parseFloat(document.getElementById('conv-amount').value);
  const from = document.getElementById('conv-from').value;
  const to = document.getElementById('conv-to').value;
  const resultEl = document.getElementById('conv-result');
  if(isNaN(amount)){ resultEl.textContent='Bitte einen Betrag eingeben.'; return; }
  if(from===to){ resultEl.textContent = `${amount.toFixed(2)} ${from} = ${amount.toFixed(2)} ${to}`; return; }
  resultEl.textContent = 'Rechne um…';
  const CVE_PER_EUR = 110.265;
  try{
    let eurAmount;
    if(from==='CVE') eurAmount = amount/CVE_PER_EUR;
    else if(from==='EUR') eurAmount = amount;
    else { const rate = await fetchRate(from,'EUR'); eurAmount = amount*rate; }

    let result;
    if(to==='CVE') result = eurAmount*CVE_PER_EUR;
    else if(to==='EUR') result = eurAmount;
    else { const rate2 = await fetchRate('EUR',to); result = eurAmount*rate2; }

    resultEl.textContent = `${amount.toFixed(2)} ${from} = ${result.toFixed(2)} ${to}`;
  }catch(err){
    resultEl.textContent = 'Umrechnung nicht verfügbar (keine Verbindung zum Kursdienst).';
  }
}

    case 'confirm-add-ticket': await confirmAddTicket(); break;
    case 'delete-ticket': await deleteTicket(el.dataset.id); break;
    case 'show-add-trip-doc': state.addingTripDoc=true; render(); break;
    case 'cancel-add-trip-doc': state.addingTripDoc=false; render(); break;
    case 'confirm-add-trip-doc': await confirmAddTripDoc(); break;
    case 'delete-trip-doc': await deleteTripDoc(el.dataset.id); break;
    case 'open-dest-from-trip': await openDestination(el.dataset.id); break;
    case 'toggle-guide-bucket-item': await toggleGuideBucketItem(el.dataset.destId, el.dataset.id); break;
    case 'delete-guide-bucket-item': await deleteGuideBucketItem(el.dataset.destId, el.dataset.id); break;
    case 'show-add-guide-bucket-item': state.addingList='bucket:'+el.dataset.destId; render(); break;
    case 'confirm-add-guide-bucket-item': await confirmAddGuideBucketItem(el.dataset.destId); break;
    case 'show-add-activity-ticket': state.addingActivityTicket=true; render(); break;
    case 'cancel-add-activity-ticket': state.addingActivityTicket=false; render(); break;
    case 'confirm-add-activity-ticket': await confirmAddActivityTicket(); break;
    case 'delete-activity-ticket': await deleteActivityTicket(el.dataset.id); break;
    case 'add-ticket-photo':
      state.ticketPhotoTarget = {listKey: el.dataset.list, ticketId: el.dataset.id};
      document.getElementById('ticket-photo-input').click();
      break;
    case 'view-ticket-photo':
      await openLightbox(el.dataset.photoId, {type:'ticket', listKey:el.dataset.list, ticketId:el.dataset.id});
      break;
    case 'edit-ticket': state.editingTicketId = el.dataset.id; render(); break;
    case 'cancel-edit-ticket': state.editingTicketId = null; render(); break;
    case 'confirm-edit-ticket': await confirmEditTicket(el.dataset.id); break;
    case 'confirm-edit-activity-ticket': await confirmEditActivityTicket(el.dataset.id); break;
    case 'add-tripdoc-file':
      state.tripDocFileTarget = el.dataset.id;
      document.getElementById('tripdoc-file-input').click();
      break;
    case 'view-tripdoc-file':
      await openLightbox(el.dataset.fileId, {type:'tripdoc', docId:el.dataset.id});
      break;
    case 'delete-lightbox-photo': await deleteLightboxPhoto(); break;
    case 'trigger-poi-csv-upload': document.getElementById('poi-csv-input').click(); break;
    case 'search-poi': await searchPoi(); break;
    case 'discover-nearby': await discoverNearby(); break;
    case 'search-new-dest': await searchNewDest(); break;
    case 'apply-new-dest-search': {
      document.getElementById('new-dest-lat').value = el.dataset.lat;
      document.getElementById('new-dest-lng').value = el.dataset.lon;
      const nameInput = document.getElementById('new-dest-name');
      if(!nameInput.value.trim()) nameInput.value = el.dataset.name;
      const resultsEl = document.getElementById('new-dest-search-results');
      if(resultsEl) resultsEl.innerHTML = '<p class="hint-text">Koordinaten übernommen.</p>';
      break;
    }
    case 'add-searched-poi':
      showPendingPoiForm(parseFloat(el.dataset.lat), parseFloat(el.dataset.lon), el.dataset.name);
      break;
    case 'locate-me': await locateMe(); break;
    case 'locate-me-weather': await locateMeForWeather(); break;
    case 'show-route': await showRouteTo(el.dataset.id); break;
    case 'clear-route': state.currentRoute=null; render(); break;
    case 'trigger-guide-file-upload': document.getElementById('guide-file-input').click(); break;
    case 'ask-revert-guide': state.confirmingRevertGuide=true; render(); break;
    case 'cancel-revert-guide': state.confirmingRevertGuide=false; render(); break;
    case 'do-revert-guide': await revertGuideToManual(); break;
    case 'switch-tab': await switchTab(el.dataset.tab); break;
    case 'toggle-dest-sidebar': state.showDestSidebar = !state.showDestSidebar; render(); break;
    case 'close-dest-sidebar': state.showDestSidebar = false; render(); break;
    case 'switch-tab-from-sidebar':
      state.showDestSidebar = false;
      await switchTab(el.dataset.tab);
      break;
    case 'switch-trip-tab-from-sidebar':
      state.showDestSidebar = false;
      await switchTripTab(el.dataset.tab);
      break;
    case 'jump-to-dest-tab': {
      state.showDestSidebar = false;
      discardDraftIfActive();
      await loadDestData(el.dataset.destId);
      state.view='destination'; state.destId=el.dataset.destId; state.tab=el.dataset.tab;
      state.addingList=null; state.addingDiary=false; state.addingBudget=false;
      state.addingDoc=null; state.pendingPoi=null; state.lightboxPhotoId=null;
      state.currentRoute=null; state.expandedGuideFields=[]; state.editingGuideField=null;
      render();
      break;
    }
    case 'toggle-check': await toggleCheck(el.dataset.list, el.dataset.id); break;
    case 'delete-item': await deleteListItem(el.dataset.list, el.dataset.id); break;
    case 'show-add-item': state.addingList=el.dataset.list; render(); break;
    case 'cancel-add-item': state.addingList=null; render(); break;
    case 'confirm-add-item': await confirmAddItem(el.dataset.list); break;
    case 'delete-poi': await deletePoi(el.dataset.id); break;
    case 'toggle-poi-geheimtipp': await togglePoiGeheimtipp(el.dataset.id); break;
    case 'save-pending-poi': await savePendingPoi(); break;
    case 'cancel-pending-poi':
      state.pendingPoi=null;
      const c=document.getElementById('poi-pending-container'); if(c) c.innerHTML='';
      break;
    case 'show-add-diary': state.addingDiary=true; render(); break;
    case 'cancel-add-diary': state.addingDiary=false; render(); break;
    case 'confirm-add-diary': await confirmAddDiary(); break;
    case 'delete-diary': await deleteDiary(el.dataset.id); break;
    case 'trigger-photo-upload': document.getElementById('photo-input').click(); break;
    case 'view-photo': await openLightbox(el.dataset.id); break;
    case 'close-lightbox': closeLightbox(); break;
    case 'open-lightbox-fullscreen': state.lightboxFullscreen = true; render(); break;
    case 'close-lightbox-fullscreen': state.lightboxFullscreen = false; render(); break;
    case 'noop': break;
    case 'show-add-budget': state.addingBudget=true; render(); break;
    case 'cancel-add-budget': state.addingBudget=false; render(); break;
    case 'confirm-add-budget': await confirmAddBudget(); break;
    case 'delete-budget': await deleteBudget(el.dataset.id); break;
    case 'toggle-budget-paid': await toggleBudgetPaid(el.dataset.id); break;
    case 'convert-currency': await doConvertCurrency(); break;
    case 'show-add-doc': state.addingDoc=el.dataset.kind; render(); break;
    case 'cancel-add-doc': state.addingDoc=null; render(); break;
    case 'confirm-add-doc': await confirmAddDoc(el.dataset.kind); break;
    case 'delete-doc': await deleteDoc(el.dataset.kind, el.dataset.id); break;
  }
}
document.getElementById('app').addEventListener('click', onAppClick);

document.getElementById('app').addEventListener('change', async function(e){
  if(e.target.id==='photo-input'){
    const file = e.target.files[0];
    if(file) await onPhotoSelected(file);
    e.target.value='';
  }
  if(e.target.id==='new-ticket-file'){
    const file = e.target.files[0];
    if(file) await onNewTicketFileSelected(file);
  }
  if(e.target.id==='new-activity-file'){
    const file = e.target.files[0];
    if(file) await onNewActivityFileSelected(file);
  }
  if(e.target.id==='ticket-photo-input'){
    const file = e.target.files[0];
    if(file && state.ticketPhotoTarget){
      await onTicketPhotoSelected(file, state.ticketPhotoTarget.listKey, state.ticketPhotoTarget.ticketId);
    }
    e.target.value='';
    state.ticketPhotoTarget = null;
  }
  if(e.target.id==='tripdoc-file-input'){
    const file = e.target.files[0];
    if(file && state.tripDocFileTarget){
      await onTripDocFileSelected(file, state.tripDocFileTarget);
    }
    e.target.value='';
    state.tripDocFileTarget = null;
  }
  if(e.target.id==='recipe-photo-input'){
    const file = e.target.files[0];
    if(file) await onRecipePhotoSelected(file);
    e.target.value='';
  }
  if(e.target.id==='recipe-file-input'){
    const file = e.target.files[0];
    if(file) await onRecipeFileSelected(file);
    e.target.value='';
  }
  if(e.target.id==='booking-file-input'){
    const file = e.target.files[0];
    if(file) await onBookingFileSelected(file);
    e.target.value='';
  }
  if(e.target.id==='poi-csv-input'){
    const file = e.target.files[0];
    if(file) await onPoiCsvSelected(file);
    e.target.value='';
  }
  if(e.target.id==='gpx-file-input'){
    const file = e.target.files[0];
    if(file) await onGpxFileSelected(file);
    e.target.value='';
  }
  if(e.target.id==='guides-import-input'){
    const file = e.target.files[0];
    if(file) await importGuidesBackup(file);
    e.target.value='';
  }
  if(e.target.id==='trips-import-input'){
    const file = e.target.files[0];
    if(file) await importTripsBackup(file);
    e.target.value='';
  }
  if(e.target.id==='guide-file-input'){
    const file = e.target.files[0];
    if(file) await onGuideFileSelected(file);
    e.target.value='';
  }
  if(e.target.classList && e.target.classList.contains('trip-guide-select')){
    const slot = parseInt(e.target.dataset.slot,10);
    const newId = e.target.value;
    const trip = trips.find(t=>t.id===state.tripId);
    if(trip){
      if(newId){
        trip.destIds[slot] = newId;
        trip.destIds = trip.destIds.filter((id,idx)=> trip.destIds.indexOf(id)===idx);
        await loadDestData(newId);
      } else {
        trip.destIds = trip.destIds.slice(0, slot);
      }
      await saveTrips();
      render();
    }
  }
  if(e.target.dataset && e.target.dataset.tripField){
    const trip = trips.find(t=>t.id===state.tripId);
    if(trip){
      trip[e.target.dataset.tripField] = e.target.value;
      await saveTrips();
      if(e.target.dataset.tripField==='dateFrom' || e.target.dataset.tripField==='dateTo'){
        const el = document.getElementById('trip-duration-display');
        if(el) el.innerHTML = renderTripDurationInfo(trip);
      }
    }
  }
  if(e.target.dataset && e.target.dataset.dayField){
    const trip = trips.find(t=>t.id===state.tripId);
    const day = trip && trip.dayPlan.find(d=>d.id===e.target.dataset.dayId);
    if(day){
      day[e.target.dataset.dayField] = e.target.value;
      await saveTrips();
    }
  }
  if(e.target.id==='day-import-dest'){
    state.dayImportDestId = e.target.value; state.dayImportRouteId = null; render();
  }
  if(e.target.id==='hiking-search-poi'){
    state.hikingSearchPoiIndex = parseInt(e.target.value,10);
  }
  if(e.target.id==='day-import-route'){
    state.dayImportRouteId = e.target.value; render();
  }
  if(e.target.id==='budget-total-currency'){
    await computeBudgetGrandTotal(trips.find(t=>t.id===state.tripId));
  }
  if(e.target.dataset && e.target.dataset.recipeField){
    const recipe = recipes.find(r=>r.id===e.target.dataset.recipeId);
    if(recipe){
      recipe[e.target.dataset.recipeField] = e.target.value;
      await sSet('recipes', recipes);
    }
  }
});

document.getElementById('app').addEventListener('focusout', async function(e){
  if(e.target.dataset && e.target.dataset.guideField){
    const dd = destDataCache[state.destId];
    dd.guide[e.target.dataset.guideField] = e.target.value;
    await saveDestData(state.destId);
  }
  if(e.target.dataset && e.target.dataset.photoCaption){
    const pid = e.target.dataset.photoCaption;
    if(photoCache[pid]){
      photoCache[pid].caption = e.target.value;
      await sSet('photo:'+pid, photoCache[pid]);
    }
  }
  if(e.target.id==='lightbox-day-assign'){
    const trip = trips.find(t=>t.id===state.tripId);
    if(trip){
      if(!trip.photoDayAssignments) trip.photoDayAssignments = {};
      const val = e.target.value;
      if(val==='') delete trip.photoDayAssignments[state.lightboxPhotoId];
      else trip.photoDayAssignments[state.lightboxPhotoId] = parseInt(val,10);
      await saveTrips();
    }
  }
});

setInterval(()=>{
  if(state.view==='home'){ triggerMascotAnim('wave', 1500); }
}, 20000);
init();
</script>
</body>
</html>
